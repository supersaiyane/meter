- id: CHG-0160
  date: '2026-10-12'
  type: Feature
  what: TASK-P12-001, the two compositions
  commit: pending
  detail: 'finops_ingest/composition.py binds the 33 collectors the worker runs for a deployment: the six
    that read only Meter for real, ownership on tags, and the twenty that need AWS failing each run typed as
