# Local development only. Production runs on ECS Fargate, provisioned by
# Terraform. See docs/04-DEPLOYMENT.md.
#
# LocalStack stands in for AWS so that a developer can run the ingestion
# framework end to end with no AWS account and no cost.

name: meter

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: meter
      POSTGRES_PASSWORD: meter_local_only
      POSTGRES_DB: meter
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meter -d meter"]
      interval: 5s
      timeout: 3s
      retries: 10

  localstack:
    image: localstack/localstack:3
    environment:
      SERVICES: sts,sqs,s3,secretsmanager,organizations,ce,logs,cloudwatch
      DEBUG: 0
    ports:
      - "4566:4566"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    environment:
      METER_ENV: local
      METER_DATABASE_URL: postgresql+psycopg://meter:meter_local_only@postgres:5432/meter
      METER_IDENTITY_PROVIDER: local_config
      METER_LOCAL_AUTH_FILE: /app/local-auth.yaml
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: eu-west-1
    ports:
      - "8000:8000"
    volumes:
      - ./local-auth.yaml:/app/local-auth.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy

  dispatcher:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    # The runtime image has no shell, so the role is a command argument rather
    # than an environment variable the entrypoint expands. See ADR-0010.
    command: ["finops_ingest.dispatcher"]
    environment:
      METER_ENV: local
      METER_DATABASE_URL: postgresql+psycopg://meter:meter_local_only@postgres:5432/meter
      METER_QUEUE_URL: http://localstack:4566/000000000000/meter-ingest
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: eu-west-1
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    command: ["finops_ingest.worker"]
    environment:
      METER_ENV: local
      METER_DATABASE_URL: postgresql+psycopg://meter:meter_local_only@postgres:5432/meter
      METER_QUEUE_URL: http://localstack:4566/000000000000/meter-ingest
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: eu-west-1
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    ports:
      - "5173:8080"
    depends_on:
      - api

volumes:
  postgres_data:
