# The local stack only. Never built into an image and never deployed.
#
# In a deployed environment the load balancer terminates `/api` and the web
# container never sees an API request, which is why `docker/nginx.conf` has no
# proxy in it. Locally there is no load balancer, so without this every screen
# renders a 404 from nginx where its data should be, and the stack that ships
# with the repository cannot show its own data.
#
# Mounted over the image's config by docker-compose.
server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # What the load balancer does in a deployed environment. The trailing slash
    # is deliberately absent on both sides, so `/api/v1/x` arrives as
    # `/api/v1/x` rather than as `/v1/x`.
    location /api {
        proxy_pass         http://api:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    add_header X-Content-Type-Options   "nosniff"        always;
    add_header X-Frame-Options          "DENY"           always;
    add_header Referrer-Policy          "same-origin"    always;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;
}
