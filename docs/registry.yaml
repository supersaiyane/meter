  status: FIXED
  detail: '`scripts/demo/seed_demo.py`, `finops_fakes/health.py`,
    `finops_fakes/platform_cost.py`'
- id: ISS-159
  severity: HIGH
  summary: The ingest screen could never show a run. `build_meta` derives freshness from an
    `as_of` column, `ingest_run` has none, so the envelope carried two nulls and the screen
