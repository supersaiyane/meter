  detail: 'FEAT-029. FIXED on 2026-09-28, verified rather than assumed. docs/00-GOAL.md names realized
    savings as the north star in the same words this issue used, not identified and not
    potential. finops_query/realized.py judges two windows into VERIFIED, REGRESSED or
    INCONCLUSIVE and carries the working, finops_ingest/collectors/realized_savings.py is the
    only writer that moves a recommendation out of DONE, and the screen groups the totals by
    verdict and refuses to sum them, which is the specific defence against the vanity metric
    named here: one realized figure would be added to the estimate on the recommendations screen
    within a week of anybody seeing both. Fifteen tests pass. One gap stays open elsewhere and
    is not this issue: ISS-208, a commitment action has no resource to join on, so no commitment
    purchase can be verified against the bill yet'
- id: ISS-030
  severity: MEDIUM
  summary: No data freshness contract
  status: FIXED
  detail: 'FEAT-006. FIXED on 2026-09-28, and the second of its three requirements was the one worth
    checking. as_of and collected_at are non nullable on every fact table, held by two tests
    that read the metadata rather than a list, and a dedicated freshness screen exists and draws
    each collector against its own cadence. Freshness on every screen was true and was held by
    nothing at all: it was one new screen away from being false, and a screen rendering a number
    with no freshness is the exact defect constraint 10 exists to prevent, because a stale
    figure looks identical to a current one. finops-
    web/src/screens/__tests__/freshnessContract.test.ts now reads the route table in App.tsx and
    asserts every routed screen calls useReportMeta. Falsified by removing the call from the
    budgets screen and watching it be named, and it checks for a call rather than a mention
    because the first attempt at falsifying it did not fail'
