    two orderings equal did not catch it, because they agreed about a package neither mentioned.
    tests/scripts/test_layer_agreement.py now asserts every declared package has a layer, and the
    constraint was probed by importing finops_api and confirming it breaks'
- id: ISS-200
  severity: MEDIUM
  status: OPEN
  summary: finops_providers/aws/config_inventory.py has never made a call. Every response shape in it is read from the AWS Config advanced query documentation and from nothing else, and the tests answer from a literal
  detail: 'Three mappings are the part a first real call will correct, and the module docstring names all three: the resource type to node kind table, the prose relationship names, and the set of types treated as global rather than regional. The last is the least certain, because Config records a global resource under whichever region had global recording enabled, so awsRegion is a fact about our own configuration rather than about the resource'
- id: ISS-201
  severity: LOW
  status: OPEN
  summary: The node kind enumeration has fourteen members and the estate has more kinds of thing than that, so a container cluster, a cache, a stream, a transit gateway and a peering connection all draw as OTHER
  detail: 'Ten of the twenty four resource types the generated estate contains map to OTHER. resource_type travels beside node_kind so a screen can still name them, and the fourteen are fixed by the P4 specification and held by a check constraint, so widening them is a migration. The edge kinds have the same gap in one place: replication has no member, and a read replica is joined with ROUTES_TO, which is the closest of the seven and not the right word. An unmapped type is deliberately not a coverage shortfall, because an estate with a fleet of clusters would then be PARTIAL on every run forever'
- id: ISS-202
  severity: MEDIUM
  status: OPEN
  summary: finops_providers/aws/topology.py has never made a call. The four APIs it reads, Transit Gateway attachments, VPC peering, PrivateLink endpoint connections and IAM trust policies, are exercised against clients that answer from a literal
  detail: 'The trust policy parser is the part most likely to be wrong, because the document arrives URL encoded as a string and the adapter reads only account principals from it. Service and federated principals are skipped on purpose, since an edge to ec2.amazonaws.com would put every instance role in every other one''s blast radius. The ARN builders are the second: three of the four APIs return bare identifiers and topology_node.provider_id is an ARN everywhere else, so a partition or a service prefix that is wrong would produce a node that never joins the one Config wrote'
- id: ISS-203
  severity: MEDIUM
  status: OPEN
  summary: infra/terraform/config has never been planned and never been applied, which is what done means for TASK-P4-010 rather than a caveat on it. No AWS Config recorder exists, so every figure in its COST.md is modelled and none is measured
  detail: 'terraform validate and fmt check pass on the stack and make tf-validate runs them on all four. The recorders cost money per configuration item, so provisioning them before the estimate has been argued with somebody who owns the bill is the failure ISS-012 exists to prevent. The least certain assumption is four configuration items per resource per month: an estate with autoscaling groups cycling instances is very much more, and at ten the estimate is 3600 USD rather than 1440. Constraint 7 tags every resource finops:module equals config, so the real figure will appear beside the estimate on the platform cost screen'
- id: ISS-204
  severity: LOW
  status: FIXED
  summary: The navigation promises an /inventory/resources screen arriving with P4, and the P4 specification never scheduled one, so a delivered sub project is named as the thing that will bring a screen nobody planned
  detail: 'Found on 2026-09-26 while reviewing IBM Turbonomic, whose equivalent is its Search and entity list views. Section 9 of the P4 specification names only /inventory/topology, and all eleven P4 tasks are done, so the arrives marker in finops-web/src/shell/sections.ts now reads as a bug to anybody who clicks it. The data the screen would render already exists: topology_node carries the region and the zone FEAT-030 was built for. Two ways to close it and the choice is the owner''s. Either add a task to the P4 plan and amend the specification, or move the marker to the sub project that will actually bring it. The marker is deliberately left alone until then, because the test in sections.test.ts requires it to name a sub project and picking one silently would hide the inconsistency rather than record it'
- id: ISS-205
  severity: MEDIUM
  status: OPEN
  summary: A recommendation from a first party source names a bare provider identifier and topology_node.provider_id is an ARN, so the two do not join and the entity detail page lists no findings for exactly the resources a reader is most likely to open
  detail: 'Measured on 2026-09-26 while building FEAT-053 rather than argued about. The seven bespoke waste_compute candidates carry an ARN and join. The first party findings carry what the source returned, i-oversized and eipalloc-fake in the seeded estate, and match no node. The page reports the count of unmatched findings for this reason, so the gap is visible rather than rendered as a clean resource, and that count is the measurement of how often it happens. Same root cause as the second paragraph of ISS-202: three of the four supplementary APIs return bare identifiers and the ARN is the identity everywhere else. Two ways to close it and the choice is the owner''s. Either normalise the identifier at ingest, which is where FOCUS normalisation already happens and which needs a partition and a service prefix the collector does not always have, or store both the ARN and the bare identifier on the node and join on either, which is a migration and an index. Normalising at ingest is the one that matches constraint 2'
- id: ISS-206
  severity: MEDIUM
  status: OPEN
  summary: Meter holds no timezone for a tenant, so a parking window is reported in UTC and a team outside UTC has to convert it before they can act on it
  detail: 'Found on 2026-09-26 building FEAT-054. A window of 19:00 to 08:00 means a different thing to a team in Sydney than to a team in Dublin, and a bare clock time is read by whoever opens the screen as their own. The rationale labels every time UTC and says why, which makes the finding correct rather than convenient: nobody is misled, and somebody still has to do arithmetic before they can act. The fix is a timezone on the tenant, which is one column and a screen setting, and it is not free because every other screen that shows a time then has to decide whether it uses it. Deliberately not done inside a collector: a timezone is a tenant fact and inventing a default there would put a policy decision in the wrong layer'
- id: ISS-207
  severity: MEDIUM
  status: OPEN
  summary: recommendation.waste_class is a free text column with no check constraint, so the closed list is a convention in Python rather than an invariant, which is exactly what constraint 11 forbids
  detail: 'Found on 2026-09-26 adding PARKABLE_WINDOW for FEAT-054. The WasteClass docstring says adding a member is a migration rather than a string, and it is not: the column is Text with nothing behind it, so any string reaches the database and any screen that switches on the value silently falls through for one nobody declared. The docstring being wrong is the worse half, because it is the thing a contributor reads before deciding whether they need a migration. Two ways to close it: a check constraint listing the members, which is a migration on every addition and is what constraint 11 asks for, or a lookup table with a foreign key, which is one insert per addition and also tells a reader what the list is. The same question applies to source and lifecycle, which were not checked while looking at this'
- id: ISS-208
  severity: LOW
  status: OPEN
  summary: FEAT-029 measures whether a recommendation delivered by joining it to cost on the resource, and a commitment action has no resource, so no commitment purchase can be verified against the bill yet
  detail: 'Named in ADR-0025 as a consequence rather than found later. The existing path joins recommendation to cost_focus_daily on resource_id over two windows, and a commitment covers a class of usage rather than one thing, so there is nothing to join on. The honest verification is different arithmetic as well as a different join: the question is not whether a resource got cheaper but whether the commitment was used, which is already measured in commitment_use as utilization. So the work is to relate a closed commitment_action to the commitment_use rows that appeared after it, and that relation does not exist because nothing tells us which purchase answered which finding. Deliberately not built: the measurement is only meaningful after a term has run, no term has started, and a verification path written now would be tested against nothing'
- id: ISS-209
  severity: MEDIUM
  status: OPEN
  summary: finops_providers/aws/terraform_state.py has never read a real state file. The state format and the addressing rules are read from the Terraform documentation for state version 4 and from nothing else, and the tests answer from a literal
  detail: 'Same footing as ISS-200 and ISS-202. The part most likely to be wrong is the address, because an address that is slightly wrong points FEAT-040 at the wrong block, which is worse than pointing at none: the rules for counted and for_each resources render differently, aws_vpc.main[0] and aws_vpc.main["a"] are different addresses, and only one of them exists in any given file. The second is the identifier: only the arn attribute is read, and a resource type that does not publish one cannot be joined at all, which is counted rather than guessed at but means whole classes of resource are invisible to this feature. Building it also demonstrated ISS-202 rather than just describing it: the fake estate''s provider_id is amazonvpc/account/region/name and not an ARN, although the column is documented as an ARN, so the fake state had to follow the estate rather than the schema comment. Closing ISS-202 or ISS-205 by normalising identifiers at ingest moves those three fake rows with it'
- id: ISS-210
  severity: MEDIUM
  status: OPEN
  summary: A budget must exist at the provider to exist in Meter, so an organization that tracks
    budgets in a spreadsheet or in a finance system has none here and sees an empty screen
  detail: 'Decided on 2026-09-27 building FEAT-060 rather than discovered afterwards. The budget
    table carries ingest_run_id and both timestamps because a budget read from a provider is a
    fact with a provenance, and everything in Meter that a screen renders has one. A budget typed
    into Meter would be the first thing in the product with none. Closing it is not one column: it
    needs a write API, which nothing else in v1 has, a form, validation, and an audit trail,
    because a limit somebody can change silently is a limit nobody can rely on. It also needs a
    decision about which source wins when a provider budget and a Meter budget describe the same
    scope, and that decision is the expensive half'
- id: ISS-211
  severity: MEDIUM
  status: OPEN
  summary: finops_providers/aws/budgets.py has never made a real call. Every response shape in it
    is read from the AWS Budgets API documentation and from nothing else, and the tests answer
    from a literal
  detail: 'Same footing as ISS-200, ISS-202 and ISS-209. The part most likely to be wrong is the
    filter to scope mapping: only LinkedAccount and Service are recognised, and everything else
    becomes UNSUPPORTED, so a budget filtered on a dimension that is actually reproducible would
    be counted as uncomputable rather than compared. That fails safe, which is why it was built
    this way, but it fails quietly. The second is the period: only MONTHLY COST budgets are
    matched, and a quarterly budget is marked unsupported rather than being divided, because
    dividing a quarterly limit by three invents a monthly limit nobody set'
- id: ISS-212
  severity: MEDIUM
  status: OPEN
  summary: An account scoped budget is invisible to the team that owns the account, because the
    budget table is PayerWide and a narrowed reader reads nothing
  detail: 'Named in ADR-0025 terms on 2026-09-27 as a consequence rather than found later. A
    budget is set at the payer and the API that reports it is a payer API, so the guard scopes the
    table the way it scopes commitment_coverage: a narrowed reader reads nothing rather than a
    figure that is not theirs. The cost is that a budget drawn around one account, which is
    exactly the budget that account team most needs, is hidden from them. Closing it properly
    means a per row rule rather than a per table one, so a budget whose scope names an account is
    readable by that account and a payer wide one is not, and that is the same per class rule
    ADR-0025 already refused once because two implementations of an authorization rule is how an
    authorization bug is created. It is a scoping decision with a real security surface, so it is
    the owner call rather than mine'

- id: ISS-213
  severity: LOW
  status: OPEN
  summary: A region name prefix is continental, so FEAT-061 places a resource in Europe and can
    never place it in Dublin, and a reader who takes a marker for a datacentre has been misled
    about where their data is
  detail: 'Named on 2026-09-27 while building FEAT-061 as the cost of the design rather than
    found afterwards. The alternative was a coordinate per region, which has to name every region
    and makes the next region a provider opens invisible until somebody notices, which is the
    failure scripts/ci/check_hardcoded.py exists to prevent. So the prefix is the right trade and
    it is a trade. Three mitigations are in place rather than one: the caption says a marker is a
    continent and not a datacentre, the regions inside each continent are listed rather than
    counted so a reader sees whether Europe means Dublin or Frankfurt or both, and the drawing is
    a graticule with no coastline, because a coastline implies a precision the data does not have.
    Closing it properly means a coordinate source that is not a hardcoded table, which is either a
    published dataset admitted through make dep-check or a provider API that returns a location,
    and neither exists in a form this product can read today. REDUCED on 2026-09-27 by a third option neither of those is. A region name carries a second fact after its prefix, a compass word: eu-west-1 and eu-central-1 are both Europe and the name also says one is western and one is central. The drawing places a marker per region rather than per continent now, offset inside its geography by that word, which needs no table of regions and goes stale for nothing, the property the prefix was chosen for. finops_core returns the word and the drawing turns it into a position, so the domain still holds no coordinates. What remains open is the original gap and is smaller: a compass point is a part of a continent and still not a city, and a region whose name carries no direction sits on the continent anchor, which is the honest answer to a name that did not say'
- id: ISS-214
  severity: LOW
  status: FIXED
  summary: The account count on a geography is summed across the regions inside it, so an account
    present in two regions of one continent is counted twice
  detail: 'Found on 2026-09-27 building FEAT-061 and left visible rather than quietly wrong. The
    grouped read counts distinct accounts per region, and the route adds those counts up per
    geography, which double counts any account spanning two regions of the same continent. That is
    common: a platform account with a disaster recovery copy is exactly it. The honest figure needs
    a second grouped read keyed on the geography rather than the region, which means resolving the
    prefix in SQL and therefore a second implementation of the rule, or a distinct count over a
    derived column. Until then the field is named account slices on the screen rather than
    accounts, so the number is not presented as something it is not. The resource count is
    unaffected, since a resource is in exactly one region. FIXED on 2026-09-27, and by neither of the two routes above: the grouped read returns the account identifiers rather than a count of them, and the route unions them per geography and counts once. That needs no second read and no second implementation of the prefix rule, which was the objection to both original options. The figure is a distinct count now and the screen says accounts, because it is. A route test builds an estate where an account spans two regions of one continent and asserts the figure is two rather than three'

- id: ISS-215
  severity: MEDIUM
  status: FIXED
  summary: A misconfiguration reaches the screen as SchemaDrift, which names the wrong remedy. A
    wrong aggregator name or a state file path that does not exist tells an operator their schema
    has drifted, when the fix is one setting
  detail: 'Found on 2026-09-28 by comparing the error codes each operation declares in the
    botocore service model against the three sets translate maps, rather than by hitting one.
    Nothing is hidden: an unmapped code becomes SchemaDrift, which is loud and is deliberately
    never NoData, because an unknown failure rendered as a zero is the defect the whole taxonomy
    exists to prevent. The problem is the word rather than the visibility. Eleven declared codes
    fall through across four operations and most of them are configuration rather than drift:
    NoSuchConfigurationAggregatorException is an aggregator name that does not exist, NoSuchKey is
    a state file path that does not exist, NotFoundException is an account with no budgets, and
    InvalidNextTokenException and ExpiredNextTokenException are a page token that expired part way
    through a long read, which is a retry and not a fault at all. Two ways to close it and the
    choice is the owner s. A seventh cause, which is an ADR because it changes the check
    constraint in 0014, every screen that renders a cause and the six way taxonomy those screens
    were designed around. Or a per adapter remediation string on the existing SchemaDrift, which
    changes nothing structural and gives an operator the right sentence, at the cost of the cause
    itself still reading as drift in every count and filter. Pinned meanwhile by
    tests/providers/aws/test_response_shapes.py, which asserts the fall through set exactly, so a
    code a future SDK adds is a failure rather than a silent join. FIXED on 2026-09-28 by the seventh cause, ADR-0026. Misconfigured maps the three codes where a person fixes it by editing configuration: the Config aggregator named in settings, and a Terraform state bucket or key named in settings. The remaining codes stay SchemaDrift and stay named in the pin, and one group of them is a different problem worth stating: ServiceFailure, InternalErrorException, ExpiredNextTokenException and InvalidNextTokenException are transient and want a retry, not a diagnosis, and mapping them to Throttled would be wrong because Throttled means over a quota and would inflate a number somebody reads. That group has no cause and is not urgent: it is loud today and recovers on the next cadence'
- id: ISS-216
  severity: LOW
  status: OPEN
  summary: The four adapters that have never made a real call now have their field names, their
    pagination tokens and their required request parameters verified against the botocore service
    model, and that is the whole of what can be checked without an account
  detail: 'Recorded on 2026-09-28 to say precisely what ISS-200, ISS-202, ISS-209 and ISS-211
    still mean, because the verification that was added is easy to mistake for closing them. What
    is now checked is names: every response field each adapter reads exists in the model boto3
    builds its clients from, every continuation token is the one the service pages on, and every
    required request parameter is sent. All of it passed on the first run, so no name was wrong,
    and the checks are falsifiable, which was confirmed by claiming a field S3 does not have and
    watching the assertion name it. What is not checked, and what keeps the four issues open, is
    everything a shape cannot express: whether a field is populated in practice, whether an empty
    list means none or means not permitted, how throttling actually arrives under load, and
    whether the semantics match what each adapter assumes about them. Those need a real account,
    which is ISS-002 and has been waiting since 2026-08-23'

- id: ISS-217
  severity: LOW
  status: OPEN
  summary: Two components live in finops-web/src/screens and are not screens, so any rule about
    what a screen must do has to carry an exception naming them
  detail: 'Found on 2026-09-28 while closing ISS-030. QueryGroups and RemediationControls sit in
    the screens directory, are not routed, and take props: QueryGroups is rendered inside
    QueryFindingsScreen and RemediationControls takes a detail prop from its parent. Neither
    reports freshness and neither should, because their parent screens report it for them. The
    cost is small and is entirely in comprehension: the freshness contract reads the route table
    rather than the directory precisely so it does not have to name them, and its docstring still
    has to explain why two files in screens are out of scope. Moving them to components/ is a
    rename, an import change in two files and a test path, and the reason it is not done here is
    that it would sit inside an unrelated change'

- id: ISS-218
  severity: LOW
  status: OPEN
  summary: A quota finding has no severity and is not ranked beside the cost findings, which the
    P5 definition of done asks for and no task delivers
  detail: 'Found on 2026-09-28 while finishing P5. The specification section 2 says a quota
    approaching its limit is a finding with a severity, ranked beside the rest. Neither half was
    built and the reason is the same reason two ADRs already give. ADR-0016 derives severity from
    monthly impact, and a quota has no money: it is the one signal in the product that is not
    about spend, so ranking it beside findings ordered by dollars needs a money equivalent
    nobody can compute, which is the fabrication ADR-0025 refused for a payer wide finding and
    ADR-0027 refused for a refusal with no saving. What was built instead is the quota list
    ordered by how full each quota is, which is exact rather than banded, and an inverted bar
    so ninety percent is visually distinct from ten. A severity band over an exact fraction is
    strictly less information than the fraction. What is genuinely lost is the home screen: a
    quota about to be hit does not appear there, so somebody who only reads the front page will
    not see it. Closing this properly means either a non money severity vocabulary with
    argued thresholds, which is an ADR, or a home screen tile that links to the quota list
    without pretending to rank against money, which is the cheaper of the two'
- id: ISS-219
  severity: MEDIUM
  status: FIXED
  summary: The cost route tests called the newest billing period still running and asserted
    it was open, which was false on the first of every month
  detail: 'A period has billed up to yesterday, so on the first of a month the open month
    holds no days and the newest period in the fake estate is the previous, closed one. Found
    on 2026-10-01 while building TASK-P6-003, by a failure in a test nothing in that task
    touched. It would have fired on any first of month run since the fixture was written. The
    estate for those tests is now built at a clock nudged past the first, so the period the
    tests call open is one that is actually open'
- id: ISS-220
  severity: MEDIUM
  status: FIXED
  summary: A schema test created a cost partition by hand under a name no production code
    writes, so CREATE TABLE IF NOT EXISTS could not stop it overlapping the real one
  detail: 'It wrote cost_focus_daily_p2026_08 and the helper writes cost_focus_daily_p202608.
    IF NOT EXISTS matches on the name, not the range, so the test passed only while nothing
    else had created that month first and Postgres refused the overlap once something did.
    Found on 2026-10-01 when a new P6 test module changed which suite ran first. It goes
    through ensure_partition now'
- id: ISS-221
  severity: MEDIUM
  status: OPEN
  summary: On the first of a month the fake estate's newest period holds no days, so the seed
    produces an estate a month thinner than the commitment collector needs
  detail: 'A period has billed up to yesterday, so on the first the open month is empty. The
    commitment collector needs a usage floor across its window and finds nothing, so
    tests/scripts/test_seed_demo.py asserted against an empty list. The test half is fixed: those
    tests now take a clock nudged past the first, the fix ISS-219 used, and a run with the
    clock frozen to 2026-10-01 passes while the same run on the raw clock fails. Left open for
    the other half, which is a decision rather than a patch: make seed has the same thin estate
    on that day, and that is the product''s own clock. Distinct from ISS-222, which looked like
    the same defect and was not'
- id: ISS-222
  severity: HIGH
  status: FIXED
  summary: The fake bill's drift was a per month sawtooth, so an untouched resource looked
    cheaper on some dates and the planted REGRESSED saving was VERIFIED instead
  detail: 'drift was indexed by the day of the month, enumerate over one period''s days, so it
    reset to its lowest value every first rather than rising as its comment said. A resource
    whose bill is meant never to move then had a thirty day cost that depended on where in the
    month its windows fell, and the realized savings collector read the planted load balancer as
    a saving whenever the after window landed on cheaper early month days. Green on 2026-09-28,
    flipped on 2026-10-02 and 2026-10-04, reproduced on main with no P6 code at all. On
    2026-10-01 the flip was wrongly blamed on P6 split cost lines, because the date rolled into
    October the same day they were added. Drift is now anchored to the estate clock and
    monotonic, over the same one to one point one five range, and the seed tests pass with the
    clock frozen to the 1st, 2nd, 4th, 15th and 28th. The rest of the backend suite did not move'
- id: ISS-223
  severity: MEDIUM
  status: OPEN
  summary: The fake container estate reports OOM status for clusters with enhanced
    observability, and the AWS adapter never does
  detail: 'finops_fakes/containers.py observes kills on an enhanced cluster, so the larger
    25 percent memory margin is reachable in every test. finops_providers/aws/container_insights.py
    always reports UNOBSERVED, following spec section 5.4, which says Container Insights does not
    reliably report OOM events. Enhanced observability may publish an OOM termination metric, but
    no metric name here has been checked against a real account, so the adapter was not changed
    on a belief. The consequence today is that against a real account every EC2 workload gets
    the 15 percent margin and the sentence saying the check could not be made. The contract
    suite constrains only clusters that cannot report requests, so both implementations pass
    while disagreeing. Resolve with ISS-002'
- id: ISS-224
  severity: MEDIUM
  status: OPEN
  summary: Fargate sizing runs only against the fake, because the AWS container adapter
    reads EKS and never ECS
  detail: 'finops_providers/aws/container_insights.py discovers clusters through the
    ContainerInsights node metrics and reports every one as EKS, so no ECS service and no
    Fargate task ever reaches the sizing rule from a real account. FEAT-037 is built and
    tested against the matrix, and it produces nothing against AWS until ECS is read. Two
    further limits are stated in every Fargate rationale rather than hidden: the saving is
    modelled from the published rate, because a task cost is a pure function of its size and
    the bill carries no Fargate grain, and it is per task, because how many tasks a service
    runs is not read'
- id: ISS-225
  severity: MEDIUM
  status: FIXED
  summary: Each assistant question holds two API worker threads while the model works, so
    enough concurrent questions stop every synchronous route
  detail: 'finops_api/toolbox.py InProcessTransport. The ask route is synchronous and holds a
    worker thread for the whole question, and each tool call it makes is a synchronous route
    that needs a second. Modelled, not measured, from anyio''s default limit of forty threads:
    twenty questions in the middle of a tool call take the whole pool, and at forty every
    thread is held by a question waiting on a tool call that cannot get one, so nothing
    progresses and no timeout here ends it. No load test has run. The cheapest fix is a limiter
    on the ask route set below half the pool, answering the excess as Throttled. FIXED on
    2026-10-05: the service takes a slot without waiting before the loop and gives it back
    however the loop ends, a question past METER_ASSISTANT_MAX_CONCURRENT_QUESTIONS is
    answered at once as Throttled with nothing spent, and the setting refuses anything above
    nineteen, a ceiling tests/api/test_assistant_limit.py holds below half the installed
    anyio pool. Still no load test'
- id: ISS-226
  severity: MEDIUM
  status: OPEN
  summary: A person's questions to the assistant survive an erasure request, and no P7 table
    has a retention job
  detail: 'scripts/ops/erase_principal.py tombstones the principal and deletes its
    principal_scope rows, and reaches neither assistant_exchange, which holds the question a
    person typed, nor redaction_event, which names whose question a rule fired on. Redaction
    removes secrets, not personal data, so a question can still hold a name. team_digest holds
    no personal data and has no retention job either. Two decisions come first and are
    OPEN-14'
- id: ISS-227
  severity: MEDIUM
  status: OPEN
  summary: Anomaly narration is built and nothing calls it, and nothing reads Config,
    CloudTrail or deploy history for it
  detail: 'finops_query/narration.py composes a narration from a cost_anomaly row and the change
    events it is given, labels every correlation with its source and its distance in time, and
    says correlated, never caused. No collector reads Config history, CloudTrail or deploy
    timestamps, and no route or screen calls narrate, so FEAT-039 is In build. Against a real
    account every source would be reported as not read, which is honest and not useful. Needs
    a read only change history collector and a place on the anomaly screen'
- id: ISS-228
  severity: MEDIUM
  status: OPEN
  summary: Remediation pull requests are authored and only a fake receives them
  detail: 'finops_query/remediation.py authors a Terraform removed block with destroy for the
    eight removal classes, and refuses any other class and any address with an instance key,
    naming why. PullRequestSink has RecordingPullRequests and no adapter, because the code host
    is OPEN-13, and no route or screen calls propose, so FEAT-040 is In build. Only removals
    are authored: a resize needs the target value and the file that sets it, and nothing reads
    either'
- id: ISS-229
  severity: LOW
  status: OPEN
  summary: The figure check on an answer lets the word one through, so a count of one could
    be stated uncited
  detail: 'finops_core/domain/insight.py SPELLED_FIGURES rejects every numeral and the spelled
    figures from zero to trillion except one, which is also a pronoun and a determiner, as in
    which one, and rejecting it would refuse ordinary answers. The exposure is a single uncited
    count of one. Recorded so the exclusion is a decision rather than an oversight'
- id: ISS-230
  severity: MEDIUM
  status: FIXED
  summary: Bedrock spend will not carry finops:module, so the platform cost screen will not
    show what the assistant costs
  detail: 'P7 spec section 15, exit criterion 7, which no task in the P7 plan took. An on demand
    call to a foundation model is not a resource, so the hub stack''s default_tags cannot tag
    it, and its cost line arrives with no module. Constraint 7 puts the platform''s own cost on
    the front page, and this would leave the newest feature off it. The per exchange estimate
    in assistant_exchange is modelled and is not the bill. The likely fix is an application
    inference profile in the hub stack, tagged, with its ARN as the configured model id and the
    IAM grant moved to it, and nothing here has checked that against a real account, ISS-002.
    FIXED in code on 2026-10-05: each model named in assistant_model_ids gets an application
    inference profile tagged finops:module = assistant, the task role may reach the model only
    through it, and the API task is told the model identifier to record and the profile ARN to
    call, two settings because the ARN names the hub account. Unverified against an account or
    a bill, ISS-002. The first thing to confirm there is that bedrock:InferenceProfileArn is set
    for an application profile, because the grant depends on it, and the pipeline deploy role
    needs the inference profile create, get, delete and tag actions'
- id: ISS-231
  severity: MEDIUM
  status: FIXED
  summary: A citation carries a value and its as_of and nothing else, so the assistant screen
    infers from a field's name whether a figure is money
  detail: 'finops_core/domain/insight.py Citation has no unit, no collected_at and no envelope
    behind it. finops-web/src/components/citations.ts draws a figure as dollars when the last
    word list of its field holds cost, spend, saving, total, change or a similar word, and as a
    count otherwise or under meta. Measured on 2026-10-04 against all 33 numeric fields the 11
    tools return, it classifies every one correctly, and a future tool returning money under a
    name without such a word, or a percentage named change, would be drawn wrongly with no test
    failing. Constraint 10 asks for both timestamps and only as_of reaches a citation. P7 spec
    section 9 asks for a citation to expand to its call and envelope, and the exchange stores
    the call without the envelope. A unit and collected_at belong on the tool spec, which knows
    what its fields mean. FIXED for the unit on 2026-10-05: each tool declares the unit of
    every numeric field it returns, a test walks every envelope and fails on a field without
    one or a unit without a field, the loop fails a figure whose unit is undeclared as
    SchemaDrift rather than defaulting, and the screen draws the unit it is sent and no longer
    reads field names. collected_at and the envelope moved to ISS-232'
- id: ISS-232
  severity: MEDIUM
  status: OPEN
  summary: A citation carries no collected_at, and an exchange keeps no envelope behind its
    calls
  detail: 'Split from ISS-231 on 2026-10-05. Constraint 10 asks for both timestamps on every
    figure, and a citation records only as_of, so where a figure needs a collected time the
    screen uses the exchange''s answered time and shows only as_of. P7 spec section 9 asks for
    a citation to expand to its call and envelope, and assistant_exchange stores each call
    without the envelope it returned, so the screen shows the call and the path and not the
    rows behind them. Storing envelopes is a size and retention decision, which OPEN-14 also
    covers'
- id: ISS-233
  severity: HIGH
  status: FIXED
  summary: Four screens kept their own list of failure causes without Misconfigured, so a
    failed ingest run could draw its row count as a measured figure
  detail: 'finops-web AppShell.tsx, surfaceStateFor.ts, IngestScreen.tsx and
    QuerySurfacesScreen.tsx each held the five causes known before ADR-0026. The shell labelled
    a Misconfigured failure UNRECOGNISED, and Ingest drew the run''s items written as a measured
    number, which constraint 5 forbids. Found by the UI audit of 2026-10-05. FIXED the same day:
    provenance.ts exports FAILURE_CAUSES derived from CAUSE_LABEL, the four copies are deleted,
    and an unknown cause on Ingest draws as UNRECOGNISED rather than as the count'
- id: ISS-234
  severity: LOW
  status: FIXED
  summary: Home listed realized savings as not yet collected and arriving with P3, after P3
    shipped
  detail: 'finops-web HomeScreen.tsx ABSENT. The list''s own rule is that a slot leaves the day
    its sub project lands, and this one stayed. Found by the UI audit of 2026-10-05 and FIXED the
    same day: the slot is removed, and the rail draws nothing for an empty list instead of a
    heading over nothing. A realized savings tile on Home belongs to the UI review'
- id: ISS-235
  severity: MEDIUM
  status: FIXED
  summary: Filters are not read from the query string, so links that carry one land on an
    unfiltered screen
  detail: 'docs/13-UI-ARCHITECTURE.md says filters live in the query string, and nothing in
    finops-web reads it. A link to /waste with a finding, from the FinOps Score screen, and one
    with a geography, from the Geography screen, both open the screen unfiltered with no word
    that the filter was dropped. Found by the UI audit of 2026-10-05. Belongs to the UI review,
    whose saved views and report filters need the same mechanism. Fixed on 2026-10-05 by
    TASK-P8-003: useFilters in finops-web/src/shell/filters.ts reads and writes every filter
    through the query string, each screen declares its keys in sections.ts, the shell names a
    parameter a screen does not take, and both links now land filtered'
- id: ISS-236
  severity: MEDIUM
  status: FIXED
  summary: The file graph check passed on an empty graph, never compared the committed graph with
    the source, and graphed files git ignores
  detail: 'Found on 2026-10-05. scripts/docs/build_file_graph.py judged SKIP_DIRS against every part
    of the absolute path, so a checkout under a directory named tmp, build, dist, scratch or security
    held no files: make doc-sync in a worktree under /private/tmp wrote a graph of 0 files and 0 edges,
    and --check passed it, because --check rebuilt the graph and checked layering without comparing
    anything. The files came from the disk, so the committed graph described whichever checkout ran
    it last: at 52c78c0 it held 164 declaration files that tsc --build writes into finops-web/dist-types
    and git ignores, and at c0b435e, merged the same morning, 164. Fixed on 2026-10-05: the files
    come from git ls-files, a skip is judged inside the root, --check fails when either output differs
    from what the source builds or is missing and names the files the two disagree about, no files
    fails in both modes, and a tree git does not know is refused rather than read from disk. The JSON
    ends with a newline, so the end-of-file hook in .pre-commit-config.yaml cannot make it stale.
    Every pipeline job that runs make or the test suite on a slim image now installs git, as code-review
    does: python:3.13-slim and alpine have none, the code-review diff came back empty without it,
    and check_memory.py resolves commits with it. tests/scripts/test_build_file_graph.py, each case
    watched failing, and a rule in tests/scripts/test_pipeline.py'
- id: ISS-237
  severity: LOW
  status: OPEN
  summary: The generated file graph points readers at docs/architecture/file-graph.html, which was
    removed
  detail: render_mermaid in scripts/docs/build_file_graph.py writes a line naming docs/architecture/file-graph.html
    as the interactive version, and that output was removed under ISS-063. On 2026-10-05 docs/architecture
    held no such file. Found while fixing ISS-236 and left for its own change
- id: ISS-238
  severity: LOW
  status: FIXED
  summary: The architecture Ports section and project_map.md described an earlier shape of finops_core/ports
  detail: Found on 2026-10-04 and fixed on 2026-10-05 from an import of every module in the package.
    docs/02-ARCHITECTURE.md said six interfaces, listed six, and gave MetricSource and ResourceInventory
    AWS implementations that neither has. project_map.md said the nine ports and the six cloud ports,
    its ports tree left out budget.py, cloudwatch_estate.py, iac.py, recommendations.py and tickets.py,
    and its header claimed a check of the tree on 2026-10-09, later than the day the drift was found.
    The section now lists every protocol with its group, its responsibility and its adapter, and states
    no count
- id: ISS-239
  severity: MEDIUM
  status: OPEN
  summary: 10 protocols in finops_core/ports are in no group, so tests/core/test_ports.py never checks
    them
  detail: 'The test takes its subjects from EXPECTED_PORTS, which must equal PROVIDER_PORTS, SURFACE_PORTS
    and MODEL_PORTS together. In no group: BudgetSource, CloudWatchEstate, CommitmentReport, PullRequestSink,
    QueryEvidence, QueryParser, RecommendationSource, StateSource, TicketSink and TopologySource.
    None of them is checked to be a runtime checkable protocol, to name a typed cause for every method,
    or to keep an ARN or boto out of its signatures. Measured on 2026-10-05: TopologySource.read_slice
    and all 7 methods of QueryParser name none of the causes in finops_core.errors, which the test
    refuses for a grouped port. Its scan for cloud imports does cover the whole package. [architecture](docs/02-ARCHITECTURE.md)
    section Ports'
- id: ISS-240
  severity: LOW
  status: OPEN
  summary: CloudWatchEstate, MetricSource, PanelRewrite and ResourceInventory have a fake and no adapter,
    and nothing in the registry says why
  detail: 'Measured on 2026-10-05 by importing every first party package. MetricSource: aws/waste.py
    CloudWatchWasteMetrics has read_many over GetMetricData and no read_series, so it does not satisfy
    the port. ResourceInventory: the AWS Config aggregator adapter implements TopologySource instead.
    No provider class has any method of CloudWatchEstate or PanelRewrite. Until 2026-10-05 the architecture
    document named CloudWatch for MetricSource and the Config aggregator for ResourceInventory. PullRequestSink
    and TicketSink are fake only too, and OPEN-13 and OPEN-05 say why'
- id: ISS-241
  severity: LOW
  status: OPEN
  summary: The documents that describe the ports are kept by hand, and no check fails when they drift
  detail: FEAT-003 is named Provider port abstraction, eight provider ports, and PROVIDER_PORTS holds
    9. No check script under scripts/ reads finops_core/ports, so nothing fails when a port module
    goes unnamed in project_map.md, which is how 5 did, and on 2026-10-05 the aws/ block there did
    not name budgets.py, config_inventory.py, recommendations.py, terraform_state.py, topology.py
    and waste.py. The P0 records that say eight ports, CHG-0039, CHG-0040, tasks/STATUS.md and docs/checkpoint_archive.md,
    describe 2026-08-24 and are right as records
- id: ISS-242
  severity: HIGH
  status: OPEN
  summary: The hub's private subnets reach six AWS services, and its collectors call about
    fifteen more, several only in us-east-1 or in eu-west-2
  detail: '`infra/terraform/hub/network.tf` has interface endpoints for `sts`, `sqs`,
    `secretsmanager`, `logs`, `ecr.api` and `ecr.dkr` plus the S3 gateway, and a private route
    table with no default route, and its comment calls that list every AWS service the tasks
    call. The adapters in `finops_providers/aws` also call `ec2`, `cloudwatch` (endpoint
    `monitoring`), `athena`, `config`, `ce`, `organizations`, `budgets`, `support`,
    `service-quotas`, `cloudtrail`, `compute-optimizer`, `cost-optimization-hub`,
    `bedrock-runtime` and `iam`, and `finops_providers/grafana/amg.py` calls `grafana`. None of
    them has a path. Cost Explorer, Organizations, Budgets, Support and Cost Optimization Hub
    answer only in us-east-1, calls into eu-west-2 need that Region''s endpoints, and cross
    Region PrivateLink does not cover them. Budgets and Support have no interface endpoint at
    all (measured 2026-10-05,
    https://docs.aws.amazon.com/vpc/latest/privatelink/aws-services-privatelink-support.html).
    `docs/04-DEPLOYMENT.md` names a Cost Explorer interface endpoint among the hub''s own, which
    are made in the hub''s Region, and none can be made there: Cost Explorer answers only in
    us-east-1, so its endpoint is in us-east-1 only (measured 2026-10-05,
    https://docs.aws.amazon.com/general/latest/gr/billing.html). On a real account most
    collectors would fail as Unreachable. Found on 2026-10-05 by the P9 price research. It went
    unseen because nothing has run against AWS, ISS-002. The owner chose the path in OPEN-16 on
    2026-10-05, A plus C: interface endpoints for every service that has one, and two functions outside the
    VPC for Budgets and Support. It stays OPEN until TASK-P9-001 builds that path. Numbered 236
    on branch p9-plan, in commit d85410d, and renumbered before the merge because main had
    registered that number first'
- id: ISS-243
  severity: MEDIUM
  status: FIXED
  summary: The frontend's test coverage is not measured, so the definition of done's 80 percent
    rule has no number behind it for any change to `finops-web`
  detail: '`make test-web` runs `npm run test -- --run` without coverage, and
    `@vitest/coverage-v8` is not installed, so `npx vitest run --coverage` stops on a missing
    dependency. Found on 2026-10-05 by the verification of TASK-P8-006, which covers each branch
    of the new table code with a named test instead of a measured percentage. Every P8 task so
    far shipped under the same gap. Closing it adds a development dependency, which goes through
    `make dep-check` and is the owner''s decision, and then a coverage threshold in `test-web`.
    The owner chose to add it on 2026-10-05. `@vitest/coverage-v8` 4.1.11 passed `make dep-check`
    with zero findings, and `make test-web` and the pipeline''s frontend job now run with
    `--coverage` against a threshold of 80 percent of lines, statements and functions for each
    file, in `finops-web/vite.config.ts`. A run of one test file fails that gate 317 times and
    the full suite passes it (measured 2026-10-05). The three files under the bar,
    `finops-web/src/api/client.ts`, `finops-web/src/components/GraphCanvas.tsx` and `finops-web/src/components/TopologyCanvas.tsx`,
    gained tests for paths no test had run: the CSV fetch, a failed write, and the taps that
    must not open an unreachable node or a boundary. Branches are not gated, ISS-244.'
- id: ISS-244
  severity: LOW
  status: OPEN
  summary: Branch coverage in `finops-web` is reported on every run and gated on none
  detail: 'Vitest 4.1.11 applies `thresholds.perFile` to every threshold it is given, and skips a
    `perFile` set on a glob, so a suite wide branch threshold cannot sit beside the per file one
    ISS-243 added. A per file branch bar of 80 percent would fail 22 files (measured 2026-10-05),
    among them the treemap, the heatmap and the stacked bar. The suite reaches 85.94 percent of
    its branches (measured 2026-10-05). Closing it is either tests for those branches, file by
    file, until a per file bar passes, or a second check over the suite total.'
- id: ISS-245
  severity: LOW
  status: OPEN
  summary: No gate checks the frontend's formatting, so code Prettier would change can be
    committed and merged
  detail: '`make lint` runs `npm run lint`, which is ESLint, and `npm run format:check` exists
    but neither the Makefile nor the pipeline runs it. Found on 2026-10-05 when four Cost
    Explorer files went into 6fac9d8 unformatted and were fixed in 3befffc.
    `finops-web/e2e/topology.spec.ts` also differs from Prettier, and `format:check` reads `src`
    only, so it would not catch that file. Closing it is `npm run format:check` in `make lint`
    and in the frontend job, widened to `e2e`.'
- id: ISS-246
  severity: MEDIUM
  status: FIXED
  summary: The degraded state listed failing collectors by their codes, finops_score and
    account_health among them, on every screen of the demo
  detail: '`finops-web/src/components/StateBoundary.tsx` joined the raw collector names into
    its Failing line. TASK-P8-004 promised no raw identifier on any screen, and its rendered
    text test never met a failing collector because no fixture carries one. The owner saw it on
    the live demo on 2026-10-05. Fixed the same day: the line names each collector through
    `collectorName`, and `StateBoundary.test.tsx` holds that a degraded state says Account
    health and FinOps Score and never their codes.'
- id: ISS-247
  severity: LOW
  status: OPEN
  summary: A view with more than one table exports only its first, so commitment coverage and
    actions, unmeasurable quotas, and the forecast's days and backtest are on screen and not
    in a file
  detail: 'TASK-P8-009 writes one table per export, because a CSV holds one table and the
    workbook and the CSV of a view hold the same rows. `/cost/commitments` exports commitment
    use and not coverage or purchase actions, `/governance/quotas` exports the measurable quotas
    and not the unmeasurable ones, and `/cost/forecast` exports its months and not the daily
    chart or the backtest. Each says so on its About sheet rather than dropping the rest
    silently. Found 2026-10-05 while wiring the exports.'
- id: ISS-248
  severity: MEDIUM
  status: FIXED
  summary: The realized savings screen printed each verdict by its code, VERIFIED among them,
    and the raw identifier test could not see it
  detail: '`finops-web/src/screens/WasteSavingsScreen.tsx` headed each verdict total with the
    code itself. `rawIdentifiers.test.tsx` reads the page text with a word boundary, and the
    heading before the tile ended in a letter, so SavingsVERIFIED never matched. Found
    2026-10-05 when the Export menu put a full stop before it. Fixed the same day: the tile
    names the verdict through `verdictName`.'
- id: ISS-249
  severity: MEDIUM
  status: OPEN
  summary: An export record names the person who made it, and no retention job or erasure
    reaches report_run
  detail: '`report_run`, FEAT-067, holds the principal of every export file. It is classified
    personal in `docs/09-DATA-CLASSIFICATION.md`, but `scripts/ops/erase_principal.py` does not
    delete or tombstone its rows and no retention job reads it, the gap ISS-226 records for the
    P7 tables. Found 2026-10-05 while classifying the table.'
- id: ISS-250
  severity: HIGH
  status: OPEN
  summary: The hub's task definitions pass 6 of the 74 settings the API requires, so a deployed
    API refuses to start
  detail: '`finops_core/config.py` reads every setting from the environment, with no defaults
    and no file, and `load_settings` refuses to start without one. `infra/terraform/hub/ecs.tf`
    passes the environment, region, queue, external id secret, collector role, org reader role,
    data bucket and the assistant pair, and the database URL as a secret, and nothing else: no
    environment file and no parameter store. Counted on 2026-10-05 against
    `Settings.model_fields`: 68 required settings reach no deployed task, METER_EXPORT_ROW_LIMIT
    from TASK-P8-009 among them. `.env.example` is the one complete description and `make up`
    holds a local `.env` to it; nothing holds the hub to it. Found while checking where the
    export row limit would come from in AWS. Where deployed settings live is a decision for the
    owner.'
- id: ISS-251
  severity: LOW
  status: OPEN
  summary: No gate checks the frontend's formatting, so it drifts unnoticed
  detail: '`make lint` runs `ruff format --check` on the Python and never `npm run format:check`
    on the TypeScript, and `make fmt` and both npm scripts cover `finops-web/src` only, so the
    journeys under `finops-web/e2e` are formatted by nothing. Found on 2026-10-06 while writing
    the viewport journey: `e2e/topology.spec.ts` on main and two files from TASK-P8-009 failed
    `prettier --check`. The two P8 files were reformatted in the same change; topology was left
    for the change that closes this, which is adding the check to `make lint` over `src` and
    `e2e` together.'
- id: ISS-252
  severity: MEDIUM
  status: OPEN
  summary: The search box finds resources by scanning the tenant's resources, with no index for
    the text
  detail: '`q` on `/api/v1/inventory/resources`, FEAT-075, matches a substring of the name or the
    ARN in any letter case. `topology_node` is indexed by tenant, account and region, and by run,
    so the match reads every resource the scope reaches and the bound of three to 200 characters
    and eight results limits what comes back, not what is read. Nothing has measured it: the tests
    seed five resources, and no estate of 1,399 accounts has been read. The usual answer
    is a trigram index on the two columns, which needs the `pg_trgm` extension in the database and
    a migration built concurrently, and is a decision about the database for the owner.'
- id: ISS-253
  severity: HIGH
  status: FIXED
  summary: Python dependencies were resolved afresh by every install, so CI and the images could
    run versions nothing had tested
  detail: '`pyproject.toml` declares ranges with no upper bound and nothing pinned them, so make
    setup, four CI jobs and both Python images each resolved PyPI on the day they ran. Found on
    2026-10-06 when a `uv run` call resolved the project again and moved 31 packages under a
    working tree, SQLAlchemy 2.0 to 2.1.3 among them, and mypy failed 154 checks, measured, in
    code nobody had touched. Fixed by ADR-0031: hashed locks in `requirements/`, installed with
    --require-hashes everywhere, and `[tool.uv] managed = false`.'
- id: ISS-254
  severity: HIGH
  status: FIXED
  summary: An amd64 image built on an arm64 machine carried arm64 compiled extensions
  detail: 'Found by reading on 2026-10-06 and reproduced on 2026-10-07, measured: the API image
    built for linux/amd64 on an Apple Silicon Mac held 37 of its 163 compiled files as arm64,
    every compiled extension in /opt/venv, and its own Python failed to import pydantic_core under
    amd64. make verify-platform passed it, because it read only the image label. Fixed in both
    Python images: the builder stage builds on the target platform, emulated where the build
    machine differs, and verify-platform reads every compiled file in each image with
    scripts/ci/check_image_arch.py. After the fix, measured: all 162 compiled files in the
    amd64 API image are amd64, and the same imports succeed under amd64.'

- id: ISS-255
  severity: MEDIUM
  status: OPEN
  summary: A saved view names its owner, and no retention job or erasure reaches saved_view
  detail: '`saved_view`, FEAT-068, holds the principal who saved each view and the names they chose.
    It is classified personal in `docs/09-DATA-CLASSIFICATION.md`, but `scripts/ops/erase_principal.py`
    does not reach it and no retention job reads it, the gap ISS-226 and ISS-249 record for the P7
    tables and `report_run`. Erasing a shared view also takes it from everyone it was shared with,
    which is a decision as well as a deletion. Found 2026-10-07 while classifying the table.'

- id: ISS-256
  severity: MEDIUM
  status: OPEN
  summary: A report schedule names its owner and its recipients, and erasure does not reach report_schedule
  detail: '`report_schedule`, FEAT-069, holds the principal who owns each schedule and the principals
    it renders for. It is classified personal in `docs/09-DATA-CLASSIFICATION.md`, but `scripts/ops/erase_principal.py`
    does not reach it and no retention job reads it, the gap ISS-255 records for `saved_view`. Erasing
    a person also has to remove them from other people''s recipient lists, which is a change to rows
    they do not own. Found 2026-10-07 while classifying the table.'

- id: ISS-257
  severity: LOW
  status: FIXED
  summary: With transparency reduced, the rail and the trust strip kept their backdrop blur
  detail: 'Found 2026-10-07 by TASK-P8-014''s sweep with transparency reduced, measured: on all 29 screens
    on the rail, in both themes, the rail and the trust strip kept a computed backdrop-filter, because
    each fallback in tokens.css switched off the blur of .meter-panel by name and those two surfaces declare
    their own. Their surfaces were already opaque, so nothing showed through, but the preference was not
    honoured and the blur was still composited. Fixed the same day: the blur is one token, --panel-filter,
    declared in :root alone, which every glass surface reads and the reduced transparency, no backdrop-filter
    and print blocks set to none. glass.test.ts holds every stylesheet to the token, and e2e/a11y.spec.ts
    holds every screen unblurred under both fallbacks.'

- id: ISS-258
  severity: MEDIUM
  status: FIXED
  summary: The Overview still promised scheduled reports for P8 after they were built, and its guards
    could not see it
  detail: 'Found 2026-10-07 by TASK-P8-014. The FinOps practitioner''s Overview said Scheduled reports
    were not built and arrive with P8, after TASK-P8-011 built them. App.test.tsx and HomeScreen.test.tsx
    each exist to catch a promise naming a sub project that has shipped, and neither could: each ended
    its pattern at a word boundary, and the page''s text runs one panel''s last word into the next panel''s
    title with no space, so P8 followed by Showback never matched. Measured by putting the promise back:
    HomeScreen.test.tsx passed over it before the change, and both fail over it after. Fixed the same
    day: the panel lists the reader''s schedules, and both patterns end on not a digit and cover P8.'

open_questions:
- id: OPEN-07
  question: What does the cost screen show for a tenant whose first ingest has not run, an
    empty state or the same not built yet panel the unbuilt screens use
  status: OPEN
  blocks: 'Nothing. It is a decision to make before the screen is written rather than after'
  detail: '[P1 spec](docs/specs/2026-09-18-p1-cost-intelligence-design.md) section 13. They are
    different situations, no bill collected yet and no screen built yet, and looking the same
    would send a person to the wrong place'
- id: OPEN-08
  question: Is there a point at which a closed billing period is declared final and Meter stops
    re reading it
  status: OPEN
  blocks: 'The collector cadence for closed periods. Not the first cut'
  detail: '[P1 spec](docs/specs/2026-09-18-p1-cost-intelligence-design.md) section 13. A
    restatement can arrive months later, and the cost of confirming a month is one Athena query'
- id: OPEN-09
  question: Does the unallocated bucket belong on the main cost screen as well as on allocation
  status: OPEN
  blocks: 'Nothing'
  detail: '[P1 spec](docs/specs/2026-09-18-p1-cost-intelligence-design.md) section 13. It is the
    number most likely to embarrass an estate, which argues both for showing it first and for
    not leading with it'
