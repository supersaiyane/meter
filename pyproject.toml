# Basic boiler Plate Doc | Grade B
# Why this file exists: Packaging, dependencies, and the lint, type and test configuration in
# one place.
# Grade B here: copy it, then replace the project name, the packages and the dependency list.
# Grades: A copy into a new project as is, no edits. B copy it and swap the
# names, paths or patterns named above. C leave behind, it is this project's
# own content rather than scaffolding, and is not tagged.

[project]
name = "meter"
version = "0.1.0"
description = "FinOps platform for AWS, built so other providers are connectors rather than rewrites"
# 3.13 rather than 3.12, chosen by measurement at TASK-P0-029: the 3.12 base
# image carries 3 High findings and 3.13 carries none. See ADR-0018.
requires-python = ">=3.13"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "boto3>=1.35",
    "structlog>=24.4",
    "pyyaml>=6.0",
    # The MCP server is a facade over the HTTP API, so it needs an HTTP client
    # at runtime rather than only in tests. Admitted through make dep-check.
    "httpx>=0.27",
    "mcp>=1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-asyncio>=0.24",
    "moto[all]>=5.0",
    "testcontainers[postgres]>=4.8",
    "ruff>=0.8",
    "mypy>=1.13",
    "import-linter>=2.1",
    # The docstring gate and the reference it generates. Both admitted through
    # make dep-check. Development only: neither ships in an image.
    "interrogate>=1.7",
    "pdoc>=15.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

# Found rather than listed, because an explicit list is a list of TOP LEVEL
# packages only: subpackages like finops_api.db and finops_ingest.collectors
# were never installed into the wheel. Nothing noticed locally, where the
# repository is on the path, and the image then failed on
# `No module named 'finops_api.db'` the first time a migration ran inside it.
# ISS-143.
[tool.setuptools.packages.find]
include = [
    "finops_core*",
    "finops_providers*",
    "finops_ingest*",
    "finops_api*",
    "finops_mcp*",
    "finops_query*",
]

[tool.ruff]
line-length = 100
target-version = "py313"


[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "ARG", "PTH", "RUF"]

[tool.ruff.lint.flake8-bugbear]
# B008 exists because a function call in a default is evaluated once at import
# and shared. FastAPI's dependency markers are built to be used exactly that
# way, so the rule is right in general and wrong for these five names.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Body",
]

[tool.ruff.lint.per-file-ignores]
# N818 wants every exception to end in Error. These six names are not only
# class names: each one is the value stored in the cause column and returned
# on the wire, and they are named as they stand in CLAUDE.md constraint 5 and
# in the P0 specification. Renaming them to satisfy a linter would silently
# change stored data and break the two documents that define the taxonomy.
"finops_core/errors.py" = ["N818"]
# ARG002 wants an unused method argument removed or renamed. A port
# implementation cannot do either. It has to accept the whole signature the
# protocol declares, under the declared names, or a keyword call against the
# port breaks on this implementation and not on the others. The fake ignores
# some of what it is handed precisely because it is a fake.
"finops_providers/fake/provider.py" = ["ARG002"]

[tool.pytest.ini_options]
# Restored to 80 by TASK-P0-005, the task that landed the first real module.
# A coverage gate parked at 0 and forgotten is a coverage gate that does
# nothing, so raising it back was an acceptance criterion of that task rather
# than a tidy up to be done later.
addopts = """-q --strict-markers \
  --cov=finops_core --cov=finops_providers --cov=finops_ingest \
  --cov=finops_api --cov=finops_mcp --cov=finops_query \
  --cov-report=term-missing --cov-fail-under=80"""
testpaths = ["tests"]
markers = [
    "integration: requires a database or LocalStack",
    "contract: port contract test, runs against both the fake and the aws adapter",
]

[tool.mypy]
python_version = "3.13"
strict = true

# pyyaml ships no type information and there is no bundled stub. The alternative
# is admitting types-PyYAML through make dep-check, which enlarges the tracked
# dependency surface for a package that contributes nothing at runtime. Values
# read from yaml are narrowed explicitly at the point of use instead, which is
# where the checking has to happen anyway.
[[tool.mypy.overrides]]
module = "yaml"
ignore_missing_imports = true

# boto3 and botocore ship no py.typed marker. The typed alternative is
# boto3-stubs, which is a large, service split, version pinned dependency for a
# package that contributes nothing at runtime, and it would have to be admitted
# through make dep-check. The adapter narrows every value it takes out of a
# response at the point of use instead, which is where the checking has to
# happen regardless of whether a stub exists. Worth revisiting if the adapter
# surface grows past a handful of calls.
[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "botocore", "botocore.*"]
ignore_missing_imports = true
warn_unreachable = true

# The rule that keeps multi cloud cheap. finops_core must stay free of every
# cloud SDK and every framework. Enforced here, not by good intentions.
[tool.importlinter]
# Required whenever a contract forbids an external module. Without it the
# contracts referencing boto3, fastapi and sqlalchemy do not fail, they simply
# never see those imports, which is worse than no contract because it looks
# like one. Found by TASK-P0-001.
include_external_packages = true
root_packages = [
    "finops_core",
    "finops_providers",
    "finops_ingest",
    "finops_api",
    "finops_mcp",
    "finops_query",
]

[[tool.importlinter.contracts]]
name = "finops_core is independent of cloud SDKs and frameworks"
type = "forbidden"
source_modules = ["finops_core"]
forbidden_modules = ["boto3", "botocore", "fastapi", "sqlalchemy", "requests", "httpx"]

# ADR-0009 and CLAUDE.md constraint 8: the MCP server is a facade in front of
# the HTTP API. It calls the API over the network with the caller's token and
# never reaches into the service layer, because two implementations of one
# authorization rule is how an authorization bug is created.
#
# Until this contract existed, that rule was enforced by nothing. AUDIT-001,
# finding A001-F02.
[[tool.importlinter.contracts]]
name = "finops_mcp is a facade, never a second implementation"
type = "forbidden"
source_modules = ["finops_mcp"]
# CAUTION. import-linter can only forbid a module it can resolve. finops_api.db
# and finops_api.guards do not exist yet, so those two entries are INERT: this
# contract currently protects against the other three only. Verified by probe at
# TASK-P0-001. TASK-P0-011 and TASK-P0-024 create those modules and each carries
# an acceptance criterion to re-run the probe and confirm the contract fires.
# ISS-109.
forbidden_modules = [
    "finops_api.db",
    "finops_api.guards",
    "finops_ingest",
    "finops_providers",
    "boto3",
    "botocore",
    "sqlalchemy",
]

[[tool.importlinter.contracts]]
name = "layers are respected"
type = "layers"
layers = [
    "finops_mcp",
    "finops_api",
    "finops_ingest",
    # P2 analysis. Above the providers because it reads what an adapter
    # fetched, below the ingest because a collector drives it. It was in
    # neither layer list until 2026-09-04, which meant it could have imported
    # finops_api and nothing would have said so.
    "finops_query",
    "finops_providers",
    "finops_core",
]

# ---------------------------------------------------------------- docstrings
#
# The gate behind `make check-docstrings`, and the input to the generated API
# reference. It exists because a reference generated from docstrings is only as
# good as the docstrings, and nothing else in the build looks at them.
#
# `fail-under` is a RATCHET. It is the measured figure at the time it was set,
# not an aspiration, so the build fails the moment coverage drops and never
# passes on a promise. Raise it when the number rises. Never lower it: lowering
# it is how a gate becomes a formality. ISS-117 tracks reaching 80.
#
# The fake provider is excluded. It is a test double implementing ports whose
# Protocols already document every method, including which of the six causes
# each one raises, and a copy of that text on the double would drift from the
# Protocol within a release.
[tool.interrogate]
fail-under = 70
exclude = ["finops_providers/fake", "tests", "migrations", "scripts", "finops-web"]
ignore-init-module = true
ignore-init-method = true
ignore-private = true
ignore-magic = true
ignore-nested-functions = true
ignore-property-decorators = true
