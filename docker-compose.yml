# Local development only. Production runs on ECS Fargate, provisioned by
# Terraform. See docs/04-DEPLOYMENT.md.
#
# Two profiles:
#   default            the running application, started by `make up`
#   security           one shot scanners, run by `make scan-local`
#
# The security profile does NOT start with `make up`. Scanners are one shot
# jobs, not services, and blocking application startup on a vulnerability
# database download would make the development loop slow and flaky for no
# security gain. See docs/05-SECURITY.md, "Why compose is not a gate".

# Values come from .env, created by `make up` from .env.example. Nothing is
# hardcoded here that an operator might need to change. See ADR-0017.

name: meter

# Host ports are the 9730 series and nothing else. 8000 is the most contested port on a
# developer's machine: on 2026-09-27 this stack could not start because another project on the
# same laptop held it, and the failure reads as a docker networking error rather than as a
# clash. Only the host side moved. Every container still listens on the port its image expects,
# because an image's own port is its business and changing it means changing health checks,
# internal URLs and anything that talks container to container.
#
#   9731 api        9732 web, the built bundle behind nginx
#   9733 mcp        9734 localstack
#
# The web development server and the Playwright preview take 9735 and 9736, in
# finops-web/vite.config.ts and finops-web/playwright.config.ts. They are separate from 9732 on
# purpose: the dev server and the built bundle used to share 5173, so the two could never run
# at once and nobody could compare them.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: meter
      POSTGRES_PASSWORD: meter_local_only
      POSTGRES_DB: meter
    ports:
      # Overridable, because a developer machine often already runs a postgres
      # on 5432 and a hard binding makes the whole stack unstartable for them.
      # Set METER_POSTGRES_PORT to move it. ISS-143.
      - "${METER_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meter -d meter"]
      interval: 5s
      timeout: 3s
      retries: 10

  # LocalStack emulates the AWS APIs Meter calls, on this machine.
  #
  # WHY IT IS HERE
  #   Meter's whole job is reading from AWS: assume a role, list an
  #   organization, read a queue, fetch cost data. Without an emulator, running
  #   the ingestion loop locally needs a real AWS account, real credentials on
  #   every developer machine, and it bills for every Cost Explorer and
  #   GetMetricData call. For a product that exists to stop runaway cloud
  #   spend, a development loop that quietly bills per keystroke is the wrong
  #   default.
  #
  # WHAT IT IS NOT
  #   LocalStack is not AWS. Community edition does not enforce IAM, its
  #   pagination and throttling behaviour differ, and its error codes are not
  #   always the real ones. So it proves the plumbing works. It does NOT prove
  #   the AWS semantics are right.
  #
  #   Correctness against real AWS behaviour is covered by moto and the port
  #   contract suite in tests/contract/, which is exactly why that suite is
  #   parameterised over providers. Never conclude "it works" from LocalStack
  #   alone, and never test a permission boundary against it.
  #
  # NEVER USED TO DEPLOY ANYTHING.
  localstack:
    image: localstack/localstack:3
    environment:
      SERVICES: sts,sqs,s3,secretsmanager,organizations,ce,logs,cloudwatch
      DEBUG: 0
    ports:
      - "9734:4566"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    # Every setting, so a new one does not have to be added here as well as
    # in .env. The explicit block below still wins, which is what keeps the
    # in network database URL pointing at the postgres service. ISS-143.
    env_file:
      - .env
    environment:
      METER_ENV: local
      METER_DATABASE_URL: postgresql+psycopg://meter:meter_local_only@postgres:5432/meter
      METER_IDENTITY_PROVIDER: local_config
      METER_LOCAL_AUTH_FILE: /app/local-auth.yaml
      # The tenant `make seed` writes. The local stack has no other source of
      # data, so any other value here makes every screen empty and the first
      # read fail on the audit insert rather than say so. ISS-149.
      METER_LOCAL_TENANT_ID: 5eeded00-0000-4000-8000-000000000001
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: eu-west-1
    ports:
      - "9731:8000"
    volumes:
      - ./local-auth.yaml:/app/local-auth.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy

  # The same image as `api`, with a different command. That is the whole of
  # ADR-0009's deployment claim, and running it here is what stops the claim
  # from being true only on paper. It talks to the API over the network, as any
  # other caller does, and holds no credential of its own.
  mcp:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    command:
      - /opt/venv/bin/uvicorn
      - finops_mcp.server:bootstrap
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "8001"
    # Every setting, so a new one does not have to be added here as well as
    # in .env. The explicit block below still wins, which is what keeps the
    # in network database URL pointing at the postgres service. ISS-143.
    env_file:
      - .env
    environment:
      METER_API_BASE_URL: http://api:8000
    ports:
      - "9733:8001"
    depends_on:
      - api

  dispatcher:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    # The runtime image has no shell, so the role is a command argument rather
    # than an environment variable the entrypoint expands. See ADR-0010.
    command: ["finops_ingest.dispatcher"]
    # Every setting, so a new one does not have to be added here as well as
    # in .env. The explicit block below still wins, which is what keeps the
    # in network database URL pointing at the postgres service. ISS-143.
    env_file:
      - .env
    environment:
      METER_ENV: local
      METER_DATABASE_URL: postgresql+psycopg://meter:meter_local_only@postgres:5432/meter
      METER_QUEUE_URL: http://localstack:4566/000000000000/meter-ingest
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: eu-west-1
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    command: ["finops_ingest.worker"]
    # Every setting, so a new one does not have to be added here as well as
    # in .env. The explicit block below still wins, which is what keeps the
    # in network database URL pointing at the postgres service. ISS-143.
    env_file:
      - .env
    environment:
      METER_ENV: local
      METER_DATABASE_URL: postgresql+psycopg://meter:meter_local_only@postgres:5432/meter
      METER_QUEUE_URL: http://localstack:4566/000000000000/meter-ingest
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: eu-west-1
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    ports:
      - "9732:8080"
    # The deployed configuration has no `/api` proxy because the load balancer
    # terminates that path. Locally there is no load balancer, so without this
    # overlay every screen renders an nginx 404 where its data should be.
    # ISS-150.
    volumes:
      - ./docker/nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

  # ------------------------------------------------------------------ security
  #
  # One shot scanners, in the `security` profile so they never start with
  # `make up`. Run them with `make scan-local`, which is the local mirror of
  # what the pipeline does after every build.
  #
  # These are a convenience, not a gate. A container cannot gate an image that
  # already exists and is already running. The real gates are the pre push
  # hook, the pipeline scan stage, the cosign verification at deploy, and the
  # nightly scan of the running digest. See docs/05-SECURITY.md.

  sbom:
    profiles: ["security"]
    image: anchore/syft:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./security/sbom:/out
    command: >
      packages docker:meter-api:${IMAGE_TAG:-local}
      -o spdx-json=/out/api-${IMAGE_TAG:-local}.spdx.json

  grype:
    profiles: ["security"]
    image: anchore/grype:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./security:/security
    environment:
      GRYPE_DB_AUTO_UPDATE: "true"
    command: >
      docker:meter-api:${IMAGE_TAG:-local}
      --config /security/policy/grype.yaml
      --output json --file /security/reports/local-grype-api.json

  trivy:
    profiles: ["security"]
    image: aquasec/trivy:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./security:/security
      - trivy_cache:/root/.cache/trivy
    command: >
      image meter-api:${IMAGE_TAG:-local}
      --config /security/policy/trivy.yaml
      --format json --output /security/reports/local-trivy-api.json

volumes:
  postgres_data:
  trivy_cache:
