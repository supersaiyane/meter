# Basic boiler Plate Doc | Grade B
# Why this file exists: The pipeline: verify, build, plan, deploy.
# Grade B here: copy it, then replace every job. Only the stage shape carries over, and none of
# it carries over at all if the next project is not on GitLab.
# Grades: A copy into a new project as is, no edits. B copy it and swap the
# names, paths or patterns named above. C leave behind, it is this project's
# own content rather than scaffolding, and is not tagged.

# Meter delivery pipeline.
#
# Flow: push to GitLab, verify, build three images with Kaniko, push to ECR,
# then Terraform applies the hub stack with the new image tag. Terraform owns
# the ECS task definition, so the deploy is a Terraform apply rather than a
# separate aws ecs update-service call. One system owns the desired state,
# which means no drift between what Terraform believes and what is running.
#
# Authentication uses GitLab OIDC into an AWS role. No long lived AWS keys are
# stored as CI variables.

stages:
  - verify
  - security
  - build
  - scan
  - plan
  - deploy

variables:
  AWS_REGION: eu-west-1
  ECR_REGISTRY: "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
  IMAGE_TAG: "${CI_COMMIT_SHORT_SHA}"
  TF_ROOT: "${CI_PROJECT_DIR}/infra/terraform/hub"
  # Target servers are amd64. Kaniko builds for the runner's architecture
  # unless told otherwise, and a push never converts an image, so this is
  # pinned rather than inferred.
  TARGET_PLATFORM: "linux/amd64"
  PIP_CACHE_DIR: "${CI_PROJECT_DIR}/.cache/pip"

default:
  interruptible: true

cache:
  key:
    files:
      - pyproject.toml
      - finops-web/package-lock.json
  paths:
    - .cache/pip
    - finops-web/node_modules

# Reusable OIDC assume role. GitLab mints a JWT, AWS trades it for a session.
.aws_oidc: &aws_oidc
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: https://gitlab.com
  before_script:
    - >
      export $(aws sts assume-role-with-web-identity
      --role-arn "${AWS_DEPLOY_ROLE_ARN}"
      --role-session-name "gitlab-${CI_PIPELINE_ID}"
      --web-identity-token "${GITLAB_OIDC_TOKEN}"
      --duration-seconds 3600
      --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]'
      --output text
      | awk '{print "AWS_ACCESS_KEY_ID="$1" AWS_SECRET_ACCESS_KEY="$2" AWS_SESSION_TOKEN="$3}')

# python:slim is Debian without build tools, so neither `make` nor git is in it.
# Every job below that invokes a Makefile target or the test suite needs this
# first. The jobs used to call make on an image that does not have it, which
# fails with "make: command not found" before running a single check. git
# followed on 2026-10-05: the file graph is built from the files git lists,
# check_memory.py resolves commits with it, and the suite builds repositories
# with it.
.needs_make_and_git: &needs_make_and_git
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends make git
      > /dev/null

# ------------------------------------------------------------------ verify

lint:
  stage: verify
  image: python:3.13-slim
  <<: *needs_make_and_git
  script:
    - pip install --require-hashes -r requirements/dev.lock
    - pip install --no-deps -e .
    - pip check
    - make lint

writing-rules:
  stage: verify
  image: alpine:3.20
  script:
    - apk add --no-cache grep make bash git
    - make check-writing

test:
  stage: verify
  image: python:3.13-slim
  <<: *needs_make_and_git
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    POSTGRES_USER: meter
    POSTGRES_PASSWORD: ci_only
    POSTGRES_DB: meter_test
    # The service above is the database the integration tests run against, and
    # this is how they are told to use it. It was METER_DATABASE_URL until
    # 2026-09-06, which nothing in the test path reads: the settings fixture
    # builds from .env.example, and the database fixture started a
    # testcontainer regardless, which this image has no Docker socket to do.
    # The service and the variable were both decoration, and the job could not
    # have run an integration test. ISS-178.
    METER_TEST_DATABASE_URL: "postgresql+psycopg://meter:ci_only@postgres:5432/meter_test"
  script:
    - pip install --require-hashes -r requirements/dev.lock
    - pip install --no-deps -e .
    - pip check
    - pytest --cov-report=term-missing --cov-report=xml --junitxml=report.xml
  coverage: '/^TOTAL.*\s+(\d+(?:\.\d+)?)%$/'
  artifacts:
    when: always
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

test-frontend:
  stage: verify
  image: node:22-alpine
  script:
    - cd finops-web
    - npm ci
    - npm run lint
    # The same gate as `make test-web`, coverage thresholds included. ISS-243.
    - npm run test -- --run --coverage

# `make check-docs` rather than three of its checks, which is what this
# job used to run. The five it was missing were the registry sync check, the
# context index check, the feature flag check, the hardcoded value check and the
# forbidden import check, all of which ran locally in `make verify` and nowhere
# in the pipeline. A gate that only runs on the machine of whoever remembers is
# not a gate. ADR-0011.
docs-consistency:
  stage: verify
  image: python:3.13-slim
  <<: *needs_make_and_git
  script:
    - pip install pyyaml
    - make check-docs

# The memory log is checked the same way the code is. A resume vector pointing
# at a path that no longer exists, or a checkpoint citing a commit that does not
# resolve, is a document that will mislead the next person to read it.
memory-consistency:
  stage: verify
  image: python:3.13-slim
  <<: *needs_make_and_git
  script:
    - pip install pyyaml
    - make check-memory

# The reference is generated and published, never committed: it is four
# megabytes of derived HTML that changes on every docstring. The coverage gate
# is a ratchet set to the measured figure, so it fails when the number drops.
api-reference:
  stage: verify
  image: python:3.13-slim
  <<: *needs_make_and_git
  script:
    - pip install --require-hashes -r requirements/dev.lock
    - pip install --no-deps -e .
    - pip check
    - make check-docstrings
    - make api-reference
  artifacts:
    when: always
    expose_as: "API reference"
    paths:
      - docs/api/
    expire_in: 30 days

terraform-validate:
  stage: verify
  image:
    name: hashicorp/terraform:1.15
    entrypoint: [""]
  script:
    - terraform -chdir=infra/terraform/hub fmt -check -recursive
    - terraform -chdir=infra/terraform/hub init -backend=false
    - terraform -chdir=infra/terraform/hub validate
    - terraform -chdir=infra/terraform/member fmt -check -recursive
    - terraform -chdir=infra/terraform/member init -backend=false
    - terraform -chdir=infra/terraform/member validate
    # The management stack was validated nowhere. It holds the one role with
    # organization wide read, which makes it the least good place to skip.
    - terraform -chdir=infra/terraform/management fmt -check -recursive
    - terraform -chdir=infra/terraform/management init -backend=false
    - terraform -chdir=infra/terraform/management validate

# ------------------------------------------------------------------ security
#
# Policy is zero vulnerabilities at any severity, see docs/05-SECURITY.md and
# ADR-0010. These jobs do not warn, they fail.

.security_tools: &security_tools
  image: python:3.13-slim
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends curl ca-certificates git
    - curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
    - curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh  | sh -s -- -b /usr/local/bin
    - curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
    # gitleaks is required by scan.sh, which exits 2 without it. Omitting it
    # made dependency-scan fail on tooling rather than on a finding, and a job
    # that always fails gets marked allow_failure by the third person who hits
    # it. AUDIT-001, finding A001-F03.
    - curl -sSfL -o /tmp/gl.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
    - tar -xzf /tmp/gl.tar.gz -C /usr/local/bin gitleaks
    - pip install pyyaml pip-audit

secrets-scan:
  stage: security
  image:
    name: zricethezav/gitleaks:latest
    entrypoint: [""]
  script:
    - gitleaks detect --source . --report-format json --report-path gitleaks.json --redact --no-banner
  artifacts:
    when: always
    paths: [gitleaks.json]

dependency-scan:
  <<: *security_tools
  stage: security
  script:
    - bash scripts/security/scan.sh
  artifacts:
    when: always
    paths:
      - security/reports/
      - security/POSTURE.md
    expire_in: 90 days

# The admission gate, re run on any manifest change so it cannot be skipped by
# editing pyproject.toml directly instead of using make dep-check.
dependency-admission:
  <<: *security_tools
  stage: security
  script:
    - |
      git fetch origin "${CI_DEFAULT_BRANCH}" --depth=1
      CHANGED=$(git diff --name-only "origin/${CI_DEFAULT_BRANCH}...HEAD" || true)
      if echo "$CHANGED" | grep -qE 'pyproject.toml|package-lock.json'; then
        echo "Dependency manifest changed. Running the admission gate."
        bash scripts/security/scan.sh
      else
        echo "No dependency manifest change. Gate not required."
      fi
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

code-review:
  stage: security
  image: python:3.13-slim
  # git for the diff this review is scoped to, and for the file graph its
  # layering check builds. python:slim has none, so without this the diff came
  # back empty and the layering check, which blocks, could not run.
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends git > /dev/null
  script:
    - pip install --require-hashes -r requirements/dev.lock
    - pip install --no-deps -e .
    - pip check
    - python scripts/ci/code_review.py --diff "origin/${CI_DEFAULT_BRANCH}" --output security/reviews
  artifacts:
    when: always
    expose_as: "Code review"
    paths: [security/reviews/]
    expire_in: 30 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # Also on the default branch. Without this the branch everything is
    # deployed from is the one branch nothing reviews.
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ------------------------------------------------------------------ build

# Kaniko rather than docker-in-docker. No privileged runner is required, which
# is the difference between a pipeline a platform team will approve and one
# they will not.
.build_image: &build_image
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  script:
    - >
      /kaniko/executor
      --context "${CI_PROJECT_DIR}"
      --dockerfile "${CI_PROJECT_DIR}/${DOCKERFILE}"
      --destination "${ECR_REGISTRY}/meter-${SERVICE}:${IMAGE_TAG}"
      --destination "${ECR_REGISTRY}/meter-${SERVICE}:${CI_COMMIT_REF_SLUG}"
      --custom-platform "${TARGET_PLATFORM}"
      --cache=true
      --cache-repo "${ECR_REGISTRY}/meter-cache"
      --build-arg "GIT_SHA=${CI_COMMIT_SHA}"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

build:api:
  <<: *build_image
  variables:
    SERVICE: api
    DOCKERFILE: docker/Dockerfile.api

build:worker:
  <<: *build_image
  variables:
    SERVICE: worker
    DOCKERFILE: docker/Dockerfile.worker

build:web:
  <<: *build_image
  variables:
    SERVICE: web
    DOCKERFILE: docker/Dockerfile.web

# The relay's zip, TASK-P9-001 and ADR-0035. Built here because the plan and the apply both
# read it and their image has no Python. Deterministic, so the plan only replaces the function
# when its code changed.
build:relay:
  stage: build
  image: python:3.13-slim
  script:
    - python scripts/deploy/build_relay.py --out build/relay.zip
  artifacts:
    paths:
      - build/relay.zip
    expire_in: 7 days
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# ------------------------------------------------------------------ scan
#
# Every image is scanned after it is built and before it can be deployed. An
# image with a finding never reaches an environment.

.scan_image: &scan_image
  <<: *security_tools
  stage: scan
  script:
    - syft "${ECR_REGISTRY}/meter-${SERVICE}:${IMAGE_TAG}" -o spdx-json > "security/sbom/${SERVICE}-${IMAGE_TAG}.spdx.json"
    # Confirm the pushed manifest is the target architecture before anything
    # is allowed to deploy. An arm64 image in an amd64 environment fails with
    # "exec format error", which reads like a broken binary rather than a
    # wrong architecture, and costs an afternoon to diagnose.
    - |
      ARCH=$(crane config "${ECR_REGISTRY}/meter-${SERVICE}:${IMAGE_TAG}" | grep -o '"architecture":"[^"]*"' | cut -d'"' -f4)
      OS=$(crane config "${ECR_REGISTRY}/meter-${SERVICE}:${IMAGE_TAG}" | grep -o '"os":"[^"]*"' | cut -d'"' -f4)
      echo "manifest reports ${OS}/${ARCH}, expected ${TARGET_PLATFORM}"
      test "${OS}/${ARCH}" = "${TARGET_PLATFORM}" || { echo "FAIL: wrong platform"; exit 1; }
    - grype "${ECR_REGISTRY}/meter-${SERVICE}:${IMAGE_TAG}" -o json --config security/policy/grype.yaml > "grype-${SERVICE}.json"
    - trivy image "${ECR_REGISTRY}/meter-${SERVICE}:${IMAGE_TAG}" --format json --output "trivy-${SERVICE}.json" --config security/policy/trivy.yaml
    - |
      mkdir -p scanout && cp grype-*.json trivy-*.json scanout/
      python scripts/security/report.py --gate-only --input scanout \
        --allowlist security/policy/allowlist.yaml --label "meter-${SERVICE}:${IMAGE_TAG}"
    - cosign sign --yes "${ECR_REGISTRY}/meter-${SERVICE}:${IMAGE_TAG}"
    - cosign attest --yes --predicate "security/sbom/${SERVICE}-${IMAGE_TAG}.spdx.json" --type spdxjson "${ECR_REGISTRY}/meter-${SERVICE}:${IMAGE_TAG}"
  artifacts:
    when: always
    paths: [security/sbom/]
    expire_in: 90 days

scan:api:
  <<: *scan_image
  variables: { SERVICE: api }
  needs: ["build:api"]

scan:worker:
  <<: *scan_image
  variables: { SERVICE: worker }
  needs: ["build:worker"]

scan:web:
  <<: *scan_image
  variables: { SERVICE: web }
  needs: ["build:web"]

# The gate that actually stops an unscanned image reaching an environment.
#
# Signing at build time proves an image came from this pipeline. Verifying at
# deploy time is what makes that useful, because without verification anyone
# who can push to ECR can put an unscanned image where the deploy will find it.
#
# This is the admission control for this project. It runs before every deploy.
verify-provenance:
  <<: *aws_oidc
  stage: scan
  image:
    name: gcr.io/projectsigstore/cosign:v2.4.1
    entrypoint: [""]
  script:
    - |
      for svc in api worker web; do
        REF="${ECR_REGISTRY}/meter-${svc}:${IMAGE_TAG}"
        echo "== ${REF}"
        cosign verify \
          --certificate-identity-regexp "${COSIGN_IDENTITY_REGEXP}" \
          --certificate-oidc-issuer "${COSIGN_OIDC_ISSUER}" \
          "${REF}"
        # An image with no SBOM attestation was not scanned by this pipeline.
        cosign verify-attestation --type spdxjson \
          --certificate-identity-regexp "${COSIGN_IDENTITY_REGEXP}" \
          --certificate-oidc-issuer "${COSIGN_OIDC_ISSUER}" \
          "${REF}" > /dev/null
        echo "   signature and SBOM attestation verified"
      done
  needs: ["scan:api", "scan:worker", "scan:web"]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ------------------------------------------------------------------ plan

terraform-plan:
  <<: *aws_oidc
  stage: plan
  image:
    name: hashicorp/terraform:1.15
    entrypoint: [""]
  script:
    - terraform -chdir=${TF_ROOT} init -backend-config=envs/${TF_ENV}.backend.hcl
    - >
      terraform -chdir=${TF_ROOT} plan
      -var-file=envs/${TF_ENV}.tfvars
      -var="image_tag=${IMAGE_TAG}"
      -out=tfplan
    - terraform -chdir=${TF_ROOT} show -no-color tfplan > plan.txt
  artifacts:
    paths:
      - infra/terraform/hub/tfplan
      - infra/terraform/hub/plan.txt
    expire_in: 7 days
  parallel:
    matrix:
      - TF_ENV: [dev, prod]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      variables:
        TF_ENV: dev
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ------------------------------------------------------------------ deploy

# The apply is the deploy. Terraform writes a new ECS task definition revision
# carrying the new image tag, and ECS performs a rolling replacement behind the
# ALB. The container health check gates the rollout, so a container that cannot
# reach its database never receives traffic.
.deploy: &deploy
  <<: *aws_oidc
  stage: deploy
  image:
    name: hashicorp/terraform:1.15
    entrypoint: [""]
  script:
    - terraform -chdir=${TF_ROOT} init -backend-config=envs/${TF_ENV}.backend.hcl
    - terraform -chdir=${TF_ROOT} apply -auto-approve tfplan
    - >
      aws ecs wait services-stable
      --cluster "meter-${TF_ENV}"
      --services "meter-api-${TF_ENV}" "meter-worker-${TF_ENV}" "meter-web-${TF_ENV}"
  environment:
    name: ${TF_ENV}

deploy:dev:
  <<: *deploy
  variables:
    TF_ENV: dev
  needs: ["verify-provenance", "terraform-plan", "build:relay"]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

deploy:prod:
  <<: *deploy
  variables:
    TF_ENV: prod
  needs: ["deploy:dev", "build:relay"]
  when: manual
  allow_failure: false
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Database migrations run as a one off ECS task before the service rollout, on
# the same image. Migrations must be backward compatible, because during a
# rolling deploy the old and new revisions run against the same schema at once.
migrate:dev:
  <<: *aws_oidc
  stage: deploy
  image: python:3.13-slim
  variables:
    TF_ENV: dev
  script:
    - pip install awscli
    - ./scripts/run_migration_task.sh "${TF_ENV}" "${IMAGE_TAG}"
  needs: ["build:api"]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ------------------------------------------------------------------ nightly
#
# The most important security job in this file.
#
# A CVE published tonight against a dependency shipped last week turns a green
# build red with no change to the code. A pipeline that scans only at build
# time reports zero forever while the deployed image degrades silently. So this
# scans the digest that is actually running, not the last thing that was built.
#
# Schedule it in GitLab with CI_NIGHTLY_SCAN set. It raises an issue rather
# than rolling back, because an automatic rollback triggered by a newly
# published advisory is its own outage risk.

nightly-posture-scan:
  <<: *security_tools
  stage: scan
  script:
    - |
      for env in dev prod; do
        for svc in api worker web; do
          DIGEST=$(aws ecs describe-task-definition \
            --task-definition "meter-${svc}-${env}" \
            --query 'taskDefinition.containerDefinitions[0].image' --output text)
          echo "Scanning ${env}/${svc} at ${DIGEST}"
          bash scripts/security/scan.sh --digest "${DIGEST}" || FAILED=1
        done
      done
      test -z "${FAILED:-}" || exit 1
  artifacts:
    when: always
    paths:
      - security/reports/
      - security/POSTURE.md
    expire_in: 365 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $CI_NIGHTLY_SCAN == "true"
