# Basic boiler Plate Doc | Grade B
# Why this file exists: Findings accepted as unfixable, each carrying the reachability argument
# that justifies it. The argument is then enforced by a build check, so an acceptance cannot
# quietly stop being true.
# Grade B here: copy it, then replace the entries. The schema, and the pairing of an acceptance
# with an enforcement, are the asset.
# Grades: A copy into a new project as is, no edits. B copy it and swap the
# names, paths or patterns named above. C leave behind, it is this project's
# own content rather than scaffolding, and is not tagged.

# Unfixable findings, accepted with a reachability argument. See ADR-0018.
#
# This is NOT the allowlist. The allowlist, in allowlist.yaml, is for findings
# that HAVE a fix which we are temporarily not taking, and every entry expires
# within 90 days.
#
# This file is for findings with no published fix, where no rebuild and no
# version bump makes them go away. Six fields, all mandatory:
#
#   id            the advisory
#   package       the affected package
#   target        which image or component
#   unfixable     must be true, and is verified against the scanner output
#   reachability  WHY the vulnerable code path does not exist in Meter.
#                 "We accept the risk" is not a reachability argument.
#   owner         a person
#   added         when accepted
#   review        when to re-examine. NOT an expiry: an unfixable finding does
#                 not become fixable on a date. The review asks one question,
#                 has a fix been published yet
#
# Where a reachability claim can be enforced, it must be. The CPython entries
# below are stdlib modules Meter does not import, and
# scripts/ci/check_forbidden_imports.py fails the build if anyone imports one.
# An npm entry is a development dependency that never ships, and
# scripts/ci/check_dev_only.py fails the scan if one reaches the production tree. There is
# none since 2026-10-11: source-map-js 1.2.2 fixed GHSA-68fv-2mgg-jv7q, the last one.
# That turns "we do not use it" from a claim into a fact.

accepted:
  - id: CVE-2026-17084
    package: python-3.13
    target: base-image
    unfixable: true
    reachability: >
      Affects the stringprep module, which processes RFC 3454 tables B.2 and
      B.3. Meter never imports stringprep. It is reachable in CPython only via
      encodings.idna, and Meter performs no internationalised domain name
      handling. Enforced by check_forbidden_imports.py.
    owner: PLACEHOLDER-security
    added: 2026-08-23
    review: 2026-11-21

  - id: CVE-2026-15806
    package: python-3.13
    target: base-image
    unfixable: true
    reachability: >
      Affects urllib.request.HTTPPasswordMgr and its subclasses. Meter never
      constructs an HTTPPasswordMgr and never uses urllib basic auth handling.
      Outbound HTTP uses httpx with bearer tokens. Enforced by
      check_forbidden_imports.py, which forbids importing urllib.request.

      The exclusion added on 2026-09-02 for the P2 prototype copy was removed on
      2026-09-04 when TASK-P2-003 deleted that copy. The Grafana adapter that
      replaced it uses httpx, so the claim is unconditional again and the
      checker has no skip in it.
    owner: PLACEHOLDER-security
    added: 2026-08-23
    review: 2026-11-21

  - id: CVE-2026-19672
    package: python-3.13
    target: base-image
    unfixable: true
    reachability: >
      Affects the tarfile module's extraction filters, which created empty
      directories outside the destination for a member whose name leaves the
      destination and returns to it. Meter never imports tarfile and extracts no
      archives at all: every input it reads is JSON over HTTP or a row from its
      own database, and nothing it writes is an archive. Enforced by
      check_forbidden_imports.py.
    owner: PLACEHOLDER-security
    added: 2026-08-29
    review: 2026-11-27

  - id: CVE-2025-15367
    package: python-3.13
    target: base-image
    unfixable: true
    reachability: >
      Command injection in the poplib module via newlines in a user controlled
      command. Meter never imports poplib and speaks no mail protocol.
      Enforced by check_forbidden_imports.py.
    owner: PLACEHOLDER-security
    added: 2026-08-23
    review: 2026-11-21

  # --- infrastructure as code -------------------------------------------------
  #
  # These five were invisible until 2026-08-27. The report parser read only the
  # Vulnerabilities array from the trivy output and never the Misconfigurations
  # array, so every one of these was parsed into nothing and the gate printed
  # "PASS: zero unresolved findings" over them. The parser is fixed. Four of the
  # findings it then surfaced were real and were fixed; these five are
  # deliberate and are recorded here with the argument rather than silenced.

  - id: AWS-0053
    package: hub/alb.tf
    target: terraform
    unfixable: true
    reachability: >
      The load balancer is internet facing because Meter is a web product that
      people sign into from a browser. It is the only resource in the hub with a
      public address, every task sits in a private subnet with no route to the
      internet, and the tasks accept traffic from this security group only.
      Making it internal would mean the product is not reachable, which is not a
      fix.
    owner: PLACEHOLDER-security
    added: 2026-08-27
    review: 2026-11-27

  - id: AWS-0054
    package: hub/alb.tf
    target: terraform
    unfixable: true
    reachability: >
      The plain HTTP listener serves only when certificate_arn is empty, which
      is development. With a certificate it does nothing but redirect to HTTPS
      with a 301. Production cannot be applied without a certificate: a
      precondition in alb.tf fails the plan, because "we will add TLS before we
      go live" is a sentence that survives going live. The scanner reads the
      dynamic block statically and cannot see the precondition.
    owner: PLACEHOLDER-security
    added: 2026-08-27
    review: 2026-11-27

  - id: AWS-0343
    package: hub/database.tf
    target: terraform
    unfixable: true
    reachability: >
      Deletion protection is set to var.env == "prod", so production has it and
      development does not. A development cluster that cannot be destroyed is a
      development cluster somebody works around by creating a second one. The
      scanner evaluates the conditional statically and reports the development
      branch.
    owner: PLACEHOLDER-security
    added: 2026-08-27
    review: 2026-11-27

  - id: AWS-0089
    package: hub/storage.tf
    target: terraform
    unfixable: true
    reachability: >
      This finding is against the access log bucket itself. A bucket that logs
      its own access to itself produces a log entry for every log entry, which
      does not terminate. The bucket it exists to log, aws_s3_bucket.data, does
      have access logging, which is what this same rule asked for and what was
      fixed on the same day.
    owner: PLACEHOLDER-security
    added: 2026-08-27
    review: 2026-11-27

  - id: AWS-0132
    package: hub/storage.tf
    target: terraform
    unfixable: true
    reachability: >
      S3 server access logging cannot deliver to a bucket encrypted with a
      customer managed key. The delivery is performed by the S3 log delivery
      group, which has no grant on the key and cannot be given one. The choice
      is SSE-S3 on the log bucket or no access log at all, and no access log is
      worse. The data bucket it logs uses the customer managed key.
    owner: PLACEHOLDER-security
    added: 2026-08-27
    review: 2026-11-27
