  status: FIXED
  detail: '`finops-web/src/components/density.ts`, `finops-web/src/components/Figure.tsx`'
- id: ISS-156
  severity: MEDIUM
  summary: The trust strip sat inside the sidebar column rather than as a band above the content,
    so on a 1440 px screen the freshness line fell below the fold and the page lost the one
    statement that says what its numbers are worth. Section 8 of docs/13-UI-ARCHITECTURE.md asks
