  severity: HIGH
  summary: No realized savings verification
  status: FIXED
  detail: 'FEAT-029. FIXED on 2026-09-28, verified rather than assumed. docs/00-GOAL.md names realized
    savings as the north star in the same words this issue used, not identified and not
    potential. finops_query/realized.py judges two windows into VERIFIED, REGRESSED or
    INCONCLUSIVE and carries the working, finops_ingest/collectors/realized_savings.py is the
    only writer that moves a recommendation out of DONE, and the screen groups the totals by
    verdict and refuses to sum them, which is the specific defence against the vanity metric
    named here: one realized figure would be added to the estimate on the recommendations screen
    within a week of anybody seeing both. Fifteen tests pass. One gap stays open elsewhere and
    is not this issue: ISS-208, a commitment action has no resource to join on, so no commitment
    purchase can be verified against the bill yet'
