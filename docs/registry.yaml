  status: FIXED
  detail: '`finops_fakes/provider.py`, `finops_fakes/health.py`'
- id: ISS-162
  severity: MEDIUM
  summary: The organization tree drew every node at the same left edge, so the one thing the
    screen exists to show, the shape of the organization, was invisible. React Aria stamps
    `--tree-item-level` on each row and leaves the indent to the stylesheet, and the first attempt
