- id: OPEN-02
  question: Single payer or multiple payer accounts
  status: OPEN
  blocks: P1 design
  detail: '[tasks/ISSUES.md](tasks/ISSUES.md)'
- id: OPEN-03
  question: Is Business or Enterprise support available
  status: OPEN
  blocks: P3 and P5 coverage
  detail: '[tasks/ISSUES.md](tasks/ISSUES.md)'
- id: OPEN-04
  question: 'Amazon Managed Grafana only, or self hosted and Grafana Cloud too. ANSWERED 2026-08-23:
    all three, behind per tenant flags. RE ANSWERED 2026-09-02, superseding that: Amazon Managed
    Grafana only. The earlier answer is kept rather than overwritten, because the two connection
    strategies it authorised were planned as TASK-P2-007 and TASK-P2-008 and those tasks are now
