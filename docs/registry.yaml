- id: CHG-0134
  date: '2026-10-08'
  type: Feature
  what: TASK-P9-001, the hub reaches every AWS API it calls, ADR-0035
  commit: pending
  detail: Ten interface endpoints added in the hub's Region, endpoint VPCs in us-east-1 and eu-west-2
    peered to the hub with a private hosted zone per service, and a relay outside the VPC, finops_relay,
    for Budgets, Support and Invoicing and for spot prices and Savings Plans rates. The relay makes only
    six allow listed read calls, as the role the list names, narrowed by a session policy, and imports
    nothing of Meter's; the existing adapters read through it unchanged. The member and payer roles trust
    it by name, and the payer role gains budgets:ViewBudget, closing ISS-259. A test reads every service
    the adapters call from the code and holds each to its path; four red checks failed it. Endpoint prices
    measured from the AWS price list; about 338 USD a month in all, modelled. Validated offline against
    installed providers. ISS-242 closed, ISS-260 found
- id: CHG-0135
  date: '2026-10-08'
  type: Feature
  what: TASK-P9-002, the price and instance type ports and their fakes, shaped by AWS's real data
  commit: pending
  detail: PriceCatalog and InstanceCatalog in a group of their own, CATALOG_PORTS, with Price,
    PriceListVersion and InstanceTypeSpec in the domain. The fakes take their structure from real
    extracts kept in tests/providers/aws/extracts, an ElastiCache price list for eu-west-1 and AWS's
    published DescribeInstanceTypes example, and their prices from the estate's own table. Reading the
    real list corrected the spec, section 5.3, the same day, that an All Upfront reservation is nought an
    hour beside its fee, so a price row is a term with both and only a term nought in both is refused,
    and that SkuPriceId is the SKU with its term. A contract test the adapters of TASK-P9-004 and
    TASK-P9-005 join; three red checks
- id: CHG-0136
  date: '2026-10-08'
  type: Feature
  what: TASK-P9-003, the price catalog's tables, every invariant a constraint
  commit: pending
  detail: Migration 0033 adds price_list_version, price, instance_type_spec, volume_type_spec, spot_price
    and spot_price_daily, and four nullable target columns on the recommendation. A price is an offer term
    whose two prices are never negative and never both nought, belongs to a recorded version by a foreign
    key, and names its lease and payment exactly when it is a reservation; a burstable type carries its
    baseline and its source; a spot day's low is never above its high; and a recommendation's target is a
    recorded price of the same Region and version. Per tenant like every table, so the guard needs no new
    rule. A test per constraint, two red checks
- id: CHG-0137
  date: '2026-10-08'
  type: Feature
  what: TASK-P9-004, AWS's prices for five services in every commercial Region, on demand and reserved
  commit: pending
  detail: The Price List adapter reads ListPriceLists for each service's versions, the version and its
    publication read from the ARN, and GetProducts a page at a time as a generator, EC2 narrowed at the
    source to the comparable instance price and EBS storage. A nought term, a missing price or an unreadable
    product is SchemaDrift. The price_catalog collector runs every 8 hours, loads only a version it does not
    hold, one savepoint per service and Region with failures to sync_error, and prunes superseded prices
    except those a recommendation quotes. Migration 0034 seeds its schedule row; the hub role gains the two
    Pricing reads. Held to AWS's own samples and the real ElastiCache list; the row count and a real EC2
    instance product wait on ISS-261
- id: CHG-0138
  date: '2026-10-08'
  type: Feature
  what: TASK-P9-005, what each instance type is, in every Region it is sold in
  commit: pending
  detail: AwsInstanceCatalog pages DescribeInstanceTypes, network figures summed over the cards and None
    where unpublished; PriceListInstanceCatalog reads RDS, ElastiCache, Redshift and OpenSearch classes from
    their products, only those carrying vCPUs and memory. Burstable baselines are the EC2 guide's credit table,
    held as data with its URL and checked against the guide's formulas on import. The instance_catalog
    collector runs every 8 hours, describes EC2 in the hub's Region and stores each type where the price list
    sells it, compares a second Region when one is configured, reads a managed service only where its price
    list changed, and marks withdrawn types not offered. Migration 0035 seeds its schedule; the hub role gains
    ec2:DescribeInstanceTypes. The domain now refuses an empty architecture list and a peak below its baseline
- id: CHG-0139
  date: '2026-10-08'
  type: Feature
  what: TASK-P9-012, Savings Plans rates for EC2 in every Region the price list sells EC2 in
  commit: pending
  detail: AwsSavingsPlansRates reads DescribeSavingsPlansOfferingRates through the relay, one call per plan
    type and payment option, EC2 in shared tenancy, and returns a PriceSheet whose version is a digest of its
    rates, because the API publishes none. The relay follows nextToken itself for a call botocore cannot page,
    up to 200 pages, and refuses a longer one whole. The savings_plan_rates collector runs every 8 hours,
    reads the Regions the price catalog holds EC2 for, and stores a sheet only when its version is new,
    through store and prune steps now shared with the price catalog collector. Migration 0036 seeds its
    schedule. A third catalog port, SavingsPlansRates, with a fake and a contract
- id: CHG-0140
  date: '2026-10-08'
  type: Feature
  what: TASK-P9-013, spot prices in every Region, the latest per pool and 90 days of daily ranges
  commit: pending
  detail: AwsSpotPrices reads DescribeSpotPriceHistory through the relay for the window since a Region's last
    read, one invocation a Region, every zone and product description; a reading of nought or outside its
    Region is SchemaDrift and a Region not opted into NotOptedIn. The spot_prices collector replaces the
    latest price per pool only with a reading at least as new, merges each day's low and high with the price
    in effect at the close counted towards its day, and removes daily rows older than 90 days, OPEN-18.
    Migration 0037 seeds its schedule. A fourth catalog port, SpotPrices, with a fake and a contract
- id: CHG-0141
  date: '2026-10-08'
  type: Feature
  what: TASK-P9-006, Compute Optimizer in every Region and account, every ranked option kept and priced
  commit: pending
  detail: The Compute Optimizer read asks each Region about each member account alone, follows nextToken,
    and asks for Graviton through the architecture preference; every option is a RankedOption with its rank,
    performance risk and the provider's own saving. One scope failing comes back as ScopedFindings beside
    what was read, recorded in sync_error, and only findings in scopes read can be withdrawn. Migration 0038
    adds recommendation_option, each option priced from a recorded catalog price or saying why not, and
    price pruning now spares a price an option quotes. The recommendation's current and target prices are
    set from one version
- id: CHG-0142
  date: '2026-10-08'
  type: Feature
  what: TASK-P9-007, Meter's own rightsizing names the cheapest type that fits and quotes the price difference
  commit: pending
  detail: finops_query/targets.py chooses from the same family one or two sizes down and the newer generations
    with their AMD and Graviton variants, offered and priced in the Region, holding CPU p99 with 30 percent
    headroom, memory peak with 15 or 25, and network and EBS p99 to the target's baselines; without an agent
    only one size down within the family. waste_compute reads network and EBS bytes, puts each CPU
    rightsizing through the rule against the catalog, and quotes the price difference for the hours run at
    list and as the bill pays, never scaled up, with both prices and the version. The planted m5.2xlarge at 7
    percent names m5.xlarge and saves about half its cost. The comparable price is now one shared read,
    catalog_reads, for the recommendation and waste collectors alike
- id: CHG-0143
  date: '2026-10-08'
  type: Feature
  what: TASK-P9-008, an instance under pressure is an Upsize with an added monthly cost
  commit: pending
  detail: CPU or memory p95 above 90 percent, or network at its baseline, after a refused shrink names the
    cheapest larger type that fits, the next size or a newer generation, or more memory per vCPU where memory
    is the pressure. The recommendation is UPSIZE_INSTANCE with a saving of nought and added_monthly_cost,
    the list price difference for the hours run scaled to the bill, held together by migration 0039; its
    severity reads from the added cost. The Overview's savings by category leaves Upsizes out, so no total of
    savings falls. The planted c6i.2xlarge above 90 percent is an Upsize to c6i.4xlarge
- id: CHG-0144
  date: '2026-10-08'
  type: Feature
  what: TASK-P9-009, a gp2 volume is priced as the gp3 that does its work
  commit: pending
  detail: finops_query/volumes.py gives gp3 the larger of what gp2 gives and the measured p99, for IOPS and
    throughput, and costs it as storage plus IOPS above 3,000 plus MiB/s above 125, inside the EBS user
    guide's limits read on 2026-10-08, 80,000 IOPS, 2,000 MiB/s, 500 IOPS per GiB and 0.25 MiB/s per IOPS.
    The price list adapter reads gp3's IOPS and throughput families, allowed to come back empty;
    waste_compute prices attached gp2 volumes in the same batch through waste_volumes, with the working in
    the rationale; the instance catalog collector stores gp2's and gp3's figures with their source in
    volume_type_spec. The planted 1,000 GiB gp2 volume saves 15.00 a month (modelled). ISS-265
- id: CHG-0145
  date: '2026-10-08'
  type: Feature
  what: TASK-P9-010, the catalog routes and the Alternatives table
  commit: pending
  detail: GET /catalog/instance-types, filtered by service, Region, family, architecture, vCPUs and memory,
    and GET /catalog/prices, filtered by service, Region, SKU, instance type, pricing category and version,
    each Region's newest by default; both exportable, every row carrying its version and as_of, and coverage
