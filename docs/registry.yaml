  status: FIXED
  detail: '`finops_api/routes/ingest.py`, `finops_api/routes/platform.py`'
- id: ISS-160
  severity: MEDIUM
  summary: A sparkline whose series never changes drew every point on the floor, because
    normalising a series with no range divides by a span of zero and the fallback put everything
    at the minimum. A module costing the same amount every day for thirty days therefore drew the
    same line as one costing nothing. Fixed 2026-09-12 by drawing a flat series down the middle,
    and the component now has tests, which it did not before
  status: FIXED
  detail: '`finops-web/src/components/Sparkline.tsx`'
- id: ISS-161
  severity: LOW
  summary: The fake account and organization fixtures carry a fixed observation date, which is
    right for a test asserting a value and wrong for a demo estate. Two screens read as five days
    stale beside four reading as current, in one estate seeded in one act. The fake provider and
