  status: ANSWERED
  blocks: 'ISS-226, a retention job and erasure for assistant_exchange and redaction_event'
  detail: '[docs/09-DATA-CLASSIFICATION.md](docs/09-DATA-CLASSIFICATION.md). Deleting takes the person''s spend out of
    the month''s token budget sum. Tombstoning the question and the identifier keeps the spend counted. Answered by
    the owner on 2026-10-12: kept 90 days, retention_assistant, and an erasure tombstones the questions and keeps
    the rows'
- id: OPEN-15
  question: How long are generated report runs and their files kept
  status: OPEN
  blocks: 'A deletion job for report files, TASK-P8-011. Files are kept until it is answered'
  detail: '[P8 spec](docs/specs/2026-10-05-p8-experience-and-reporting-design.md) section 6'
- id: OPEN-17
  question: 'How does the hub read spot prices and Savings Plans rates in every commercial
    Region: a small function outside the VPC that writes rows to S3, the pattern approved for
    Budgets and Support, or an interface endpoint for each in every Region. ANSWERED 2026-10-07: the function
    outside the VPC'
  status: ANSWERED
  blocks: 'Nothing now. TASK-P9-001 builds the function, and TASK-P9-013 still waits on OPEN-18'
  detail: '[P9 spec](docs/specs/2026-10-05-p9-price-catalog-design.md) section 14.5. Raised
    2026-10-07 when the owner widened the catalog to every Region and four price types. Every
    other part of the catalog is read through the endpoint in us-east-1 already approved.
    Recommended: the function outside the VPC, a few USD a month (modelled). The alternative is
    about 30 Regions at about 14.7 USD a month an endpoint, roughly 440 USD a month for spot
    alone (modelled), on top of the 290 USD a month approved for OPEN-16. The owner chose the function on
    2026-10-07: about 2,700 runs a month inside the Lambda always free allowance, under 1 USD
    a month with its S3 writes and logs (modelled)'
- id: OPEN-18
  question: 'How much spot price history does the catalog keep: the latest price per pool plus
    each day''s low and high for 90 days, every 8 hourly reading, or the latest only. ANSWERED
    2026-10-07: the latest plus a daily low and high for 90 days'
  status: ANSWERED
  blocks: nothing
  detail: '[P9 spec](docs/specs/2026-10-05-p9-price-catalog-design.md) section 14.5. Raised
    2026-10-07. Spot prices change far more often than list prices, so keeping every reading
    for every pool in every Region grows without limit. Recommended: the latest per pool,
    replaced each run, plus a daily low and high kept for 90 days. The owner chose it on
    2026-10-07, and spec section 14.7 holds the two tables'

- id: OPEN-19
  question: Does the report library also list a person's own export records, report_run?
  status: OPEN
  blocks: nothing
  detail: 'Raised 2026-10-07 while building TASK-P8-010. Three documents written with TASK-P8-009
    said the library would list a reader''s own exports, and the task''s acceptance criteria do not
    ask for it, so it was not built there. TASK-P8-011 built the spec''s GET /reports/runs, and the
    Scheduled screen lists a person''s runs with their exports among them, so a person can see what
    they took. Left open: whether the library lists them as well. Recommended: no, one list is enough.'
- id: OPEN-16
  question: 'How does the hub reach the AWS APIs its collectors call: endpoints in every Region
    used plus a us-east-1 endpoint VPC, a NAT gateway with an AWS-only allow list, or collectors
    outside the VPC. ANSWERED 2026-10-05: A plus C for two. Interface endpoints for every service
    that has one, and Budgets and Support, which have none, as two functions outside the VPC
    that write rows to S3'
  status: ANSWERED
  blocks: 'Nothing now. TASK-P9-001 builds the path and writes the ADR that prices it, and
    ISS-242 stays OPEN until it is built'
  detail: '[P9 spec](docs/specs/2026-10-05-p9-price-catalog-design.md) section 5.1. The owner
    chose on 2026-10-05: an interface endpoint for every service that has one, in an endpoint
    VPC in us-east-1 for the services that answer only there and in each Region called for the
    rest. Budgets and Support have no interface endpoint (measured 2026-10-05,
    https://docs.aws.amazon.com/vpc/latest/privatelink/aws-services-privatelink-support.html),
    so they run as two small functions outside the VPC that write rows to S3, and the hub keeps
    no route out, which ADR-0028 relies on. About 20 endpoints at about 14.7 USD a month each,
    roughly 290 USD a month (modelled); the ADR measures it. B, the NAT gateway, was not chosen'
- id: OPEN-06
  question: 'Which regions beyond Ireland and London. ANSWERED 2026-08-23: those two only, eu-west-1 and
    eu-west-2'
  status: ANSWERED
  blocks: nothing
  detail: Set in METER_REGIONS, see .env.example section 3
- id: OPEN-20
  question: Which of proposals 2 to 9 in next-in-scope.txt are approved, and in what order? ANSWERED IN PART
    2026-10-08, proposal 3, owners and a savings ledger, is next, as P11; the rest stay open
  status: OPEN
  blocks: Every proposal after P9
  detail: 'Raised 2026-10-07 with the market research. Priorities 1 to 3 were approved the same day. The
    rest are FinOps for AI, owners and a savings ledger, graded autonomy through pull requests, commitments,
    costing before deployment, performance aware rightsizing, more providers through FOCUS, and carbon
    beside cost. Recommended: the order in section 7 of next-in-scope.txt, owners and the savings ledger
    first because ISS-021 blocks every action after it.'
- id: OPEN-21
  question: 'Should Meter read AWS''s FOCUS export instead of normalising CUR 2.0 itself? WITHDRAWN 2026-10-07:
    Meter already reads AWS''s FOCUS export, so the question rested on a wrong premise'
  status: ANSWERED
  blocks: nothing
  detail: Raised and withdrawn 2026-10-07 with P10. The P10 draft said Meter normalised raw CUR 2.0; finops_providers/aws/cur.py
    already reads AWS's FOCUS export through Athena by FOCUS column names. P10 spec section 5.2 now reads
    the new columns where the export carries them. CHG-0128.
- id: OPEN-22
  question: 'Savings Plans rates: read every Region every 8 hours, about 16,200 relay calls a month, or
    read them daily?'
  status: OPEN
  blocks: nothing
  detail: 'Raised 2026-10-08 by TASK-P9-012. Spec section 14.5 modelled about 2,700 relay runs a month for
    spot and Savings Plans together, one a Region a poll. The Savings Plans API has no paginator, no
    version and about 77,000 EC2 rates a Region (modelled), so the adapter makes six calls a Region to keep
    each answer inside the relay''s 256 MB, and must read every Region to learn whether anything moved:
    about 180 calls a run, 16,200 a month at 8 hours (modelled). That is inside the Lambda free allowance of
    1 million requests and costs about 0.08 USD a month in S3 writes (modelled), so it is built as asked.
    Recommended: keep 8 hours, since the cost is negligible and the cadence is a schedule row that can be
    changed without code; revisit if ISS-263 measures a larger answer.'
- id: OPEN-23
  question: 'Where are Compute Optimizer''s ranked options kept: a table of their own, or a JSON column on
    the recommendation? BUILT 2026-10-08 as recommended, a table'
  status: OPEN
  blocks: nothing
  detail: 'Raised 2026-10-08 by TASK-P9-006. The spec asks for every ranked option to be kept and priced,
    and its data model gave the recommendation one target. Recommended and built: a table,
    recommendation_option, migration 0038, because constraint 11 makes an option''s rules database
    constraints, priced from a recorded price by a foreign key or naming why not, ranks unique, risk on
    its scale, and a JSON column could hold none of them. The cost is one more table scoped through its
    recommendation. Reversing it is a migration that folds the rows into a column; the owner may say so.'
- id: OPEN-24
  question: 'Are Meter''s own alternatives written when its rule judges them, beside Compute Optimizer''s,
    or worked out again when the screen asks? BUILT 2026-10-08 as recommended, written'
  status: OPEN
  blocks: nothing
  detail: 'Raised 2026-10-08 by TASK-P9-010. FEAT-073 said the screen would work Meter''s alternatives out
    again from the rule and the catalog. It cannot: the rule needs the demand it measured, CPU, memory,
    network and EBS, and nothing stores it, so a list worked out later could not say which types fit.
    Recommended and built: the rule keeps every priced type that fits, cheapest first, and waste_compute
    writes them to recommendation_option each run, replacing the last run''s. Compute Optimizer scores its
    options'' risk from 0 to 4 and Meter''s rule gives none, so migration 0040 lets that column be null
    rather than invent a nought that would read as no risk. The cost is a write per targeted finding.
    Reversing it is storing the demand on the recommendation instead; the owner may say so.'
- id: OPEN-25
  question: 'Which service catalogue names owners, AWS AppRegistry, a Backstage catalogue, or a list kept in
    Meter? ANSWERED 2026-10-08 as recommended: AWS AppRegistry'
  status: ANSWERED
  blocks: TASK-P11-003
  detail: 'Raised 2026-10-08 by the P11 spec, section 5.3. Recommended: AWS AppRegistry, the store behind
    myApplications, read only through four calls in the botocore 1.43.108 model, the owner read from the
    application''s attribute group under a configurable key. Backstage waits on OPEN-13, the code host;
    a list kept in Meter would be a second source of truth.'
- id: OPEN-26
  question: 'Are creators read from CloudTrail''s event history, or from CloudTrail Lake or the organization
    trail through Athena? ANSWERED 2026-10-08 as recommended: the event history'
  status: ANSWERED
  blocks: TASK-P11-004
  detail: 'Raised 2026-10-08 by the P11 spec, section 5.4. Recommended: the event history through
    LookupEvents by resource name, which needs no new infrastructure and reuses the paging the query
    evidence adapter has, read once per resource; a resource older than the history says so. Lake or the
    organization trail reach further back and need infrastructure no account has yet, ISS-122, and either
    can replace the adapter behind the same port.'
- id: OPEN-27
  question: 'May the savings ledger rank individual engineers, or teams only? ANSWERED 2026-10-08 as
    recommended: teams only'
  status: ANSWERED
  blocks: TASK-P11-008
  detail: 'Raised 2026-10-08 by the P11 spec, section 5.6. Recommended: teams only, a person named only as
    the owner on a team''s credits, because a leaderboard of named engineers is a performance review
    nobody asked Meter to run. Ranking individuals is a change to the screen and its route, not to the
    data.'
- id: OPEN-28
  question: 'What do the dispatcher and worker run against before an AWS account is connected? ANSWERED
    2026-10-12 as recommended: fakes by a setting'
  status: ANSWERED
  blocks: TASK-P12-001
  detail: 'Raised 2026-10-12 by the P12 spec, section 5.1. Recommended: METER_PROVIDERS, fake or aws with no
    default, so the local stack and any deploy before an account run end to end on the fakes and a deployed
    environment says aws. The alternative, AWS only, would leave the local stack unable to run end to end.
    Amended 2026-10-12, TASK-P12-001: ADR-0022 keeps fakes out of the runtime image and the owner chose to
    keep it so, so fakes run only in the local stack through their own entry points and no setting is needed.'
- id: OPEN-29
  question: 'Where do a deployed Meter''s settings live? ANSWERED 2026-10-12: SSM Parameter Store'
  status: ANSWERED
  blocks: TASK-P12-006
  detail: 'Raised 2026-10-12 by the P12 spec, section 5.4, for ISS-250. Recommended was a Terraform map per
    environment written into the task definitions with secrets in Secrets Manager; the owner chose SSM
    Parameter Store, one parameter per setting under /meter/<env>/, injected through each task definition''s
    secrets, the secret ones created with a placeholder and set by the owner.'
- id: OPEN-30
  question: Which git host takes the remote, and so where does the first pipeline run happen?
  status: OPEN
  blocks: ISS-179
  detail: 'Raised 2026-10-12 by the P12 spec, section 3. The pipeline is written for GitLab, .gitlab-ci.yml,
    and has never run because the repository has no remote. Choosing the host and adding the remote is the
    owner''s; the first push runs the pipeline for the first time, and a push to main runs deploy:dev.'
- id: OPEN-31
  question: 'How does a deployed Meter reach OpenAI and Anthropic, which have no VPC endpoint? ANSWERED 2026-10-12: a NAT gateway'
  status: ANSWERED
  blocks: TASK-P13-001
  detail: 'Raised 2026-10-12 by the P13 spec, section 5.1. The choices were a NAT gateway, the relay of ADR-0035, or Network Firewall with a domain allow list. The owner chose a NAT gateway; ADR-0036 records it, with only the worker''s security group allowed to use it.'
- id: OPEN-32
  question: 'Where does Bedrock cost per user and agent come from? ANSWERED 2026-10-12 as recommended: invocation logs where enabled'
  status: ANSWERED
  blocks: TASK-P13-003
  detail: 'Raised 2026-10-12 by the P13 spec, section 5.4. The bill names the IAM principal, usually a shared role. Invocation logs name the caller and the request metadata, and hold the prompt and response, so Meter reads them through an aggregate query only, where an account sends them to CloudWatch Logs, and reads NotOptedIn where it does not.'
- id: OPEN-33
  question: 'What does GPU spend show? ANSWERED 2026-10-12: utilization as well as hours and cost'
  status: ANSWERED
  blocks: TASK-P13-006
  detail: 'Raised 2026-10-12 by the P13 spec, section 5.6. Hours and cost come from the bill. The owner added utilization, read from the CloudWatch agent''s NVIDIA metrics where an instance publishes them, and shown as not published, never zero, where it does not.'
- id: OPEN-34
  question: 'How are token fields stored before FOCUS 1.5 names them? ANSWERED 2026-10-12 as recommended: x_ columns now, renamed when FOCUS 1.5 lands'
  status: ANSWERED
  blocks: TASK-P13-002
  detail: 'Raised 2026-10-12 by the P13 spec, section 5.2. FOCUS reserves the x_ prefix for a producer''s own columns. The rename follows constraint 12: add the new columns, backfill, and drop the x_ ones a release later.'
- id: OPEN-35
  question: 'Where does a purchase plan come from? ANSWERED 2026-10-13 as recommended: Meter''s own and AWS''s, side by side'
  status: ANSWERED
  blocks: TASK-P14-006, TASK-P14-007
  detail: 'Raised 2026-10-13 by the P14 spec, section 5.1. Meter drafts a plan from the steady baseline and P9''s rates; AWS''s recommendation is read from Cost Explorer as the payer at USD 0.01 a request, modelled. The screen explains the difference rather than choosing.'
- id: OPEN-36
  question: 'What does approving a purchase plan mean, when Meter never buys? ANSWERED 2026-10-13 as recommended: it is recorded, and a person buys'
  status: ANSWERED
  blocks: TASK-P14-008
  detail: 'Raised 2026-10-13 by the P14 spec, section 5.2. Draft, approved, bought and verified, each recorded with the principal and the time; a bought plan is verified by finding its commitment in the inventory. Constraint 6 holds.'
- id: OPEN-37
  question: 'Which commitments does the inventory read? ANSWERED 2026-10-13: every reservable service, Savings Plans, EC2 and RDS first'
  status: ANSWERED
  blocks: TASK-P14-002, TASK-P14-003
  detail: 'Raised 2026-10-13 by the P14 spec, section 5.3. The owner chose the recommended three and every reservable service: ElastiCache, OpenSearch, Redshift and MemoryDB follow. DynamoDB reserved capacity has no read API, ISS-295.'
- id: OPEN-38
  question: 'What does a purchase plan aim for by default? ANSWERED 2026-10-13 as recommended: the cautious ladder'
  status: ANSWERED
