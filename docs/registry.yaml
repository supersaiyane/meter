    They also backfilled ServiceProviderName from PublisherName, where FOCUS introduced it to replace
    ProviderName. Corrected before any code: five columns are read where the export has them, both provider
    columns derive from ProviderName, and OPEN-21 is withdrawn'


- id: CHG-0129
  date: '2026-10-07'
