- id: ISS-174
  severity: LOW
  summary: The ad hoc screen cannot tell an estate with no hand run queries from one whose
    evidence could not be read. Both render as an empty table. `_observations` in the query
    audit collector catches a CollectionError and returns None so the run continues, which
    is correct for the findings, because a modelled estate is still worth reporting and an
    aborted one is not. It leaves nothing for this screen to read. The fix is to record the
    evidence failure as a typed failure on the envelope, which is a change to the
    collector's error path rather than to the screen. Found 2026-09-06 while writing
    TASK-P2-026, and left as the one acceptance criterion that task did not meet. Fixed
    2026-09-06 by recording the failure through the run ledger, the same table and the
    same path an unreachable workspace uses, so it reaches the trust strip on every
