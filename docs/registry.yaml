  decision: Minimus base images and a continuously maintained zero CVE posture
  status: Accepted, threshold amended by ADR-0018
  doc: docs/adr/ADR-0010-minimus-zero-cve-base-images.md
- id: ADR-0011
  decision: A decision ladder before any new code, and token economy
  status: Superseded by ADR-0013
  doc: docs/adr/ADR-0011-minimal-code-decision-ladder.md
- id: ADR-0012
  decision: Collection cadence is data, not code, and is bounded by the source
  status: Accepted
  doc: docs/adr/ADR-0012-collector-cadence-registry.md
- id: ADR-0013
  decision: Seven rung ladder with a Rung Disqualification Record and a security sign off gate
  status: Accepted
  doc: docs/adr/ADR-0013-seven-rung-ladder-and-disqualification.md
- id: ADR-0014
  decision: Derived documentation is generated from a registry, not hand maintained
  status: Accepted
  doc: docs/adr/ADR-0014-generated-documentation.md
- id: ADR-0015
  decision: Deterministic forecasting is permitted where a language model number is not
  status: Accepted
  doc: docs/adr/ADR-0015-deterministic-forecasting-is-permitted.md
- id: ADR-0016
  decision: Severity on a cost finding is derived from the money, never chosen
  status: Accepted
  doc: docs/adr/ADR-0016-dollar-based-severity.md
- id: ADR-0017
  decision: Nothing is hardcoded, and every feature flag has an owner and an expiry
  status: Accepted
  doc: docs/adr/ADR-0017-configuration-and-feature-flags.md
- id: ADR-0018
  decision: The threshold is zero fixable findings, not zero findings
  status: Accepted
  doc: docs/adr/ADR-0018-zero-fixable-not-zero-findings.md
- id: ADR-0019
  decision: Headless component behaviour, our own visual layer
  status: Accepted, styling row superseded by ADR-0021
  doc: docs/adr/ADR-0019-headless-components-own-visual-layer.md
- id: ADR-0020
  decision: Seven fixed navigation groups, and the routes they fix
  status: Superseded by ADR-0030
  doc: docs/adr/ADR-0020-seven-fixed-navigation-groups.md
- id: ADR-0021
  decision: Plain CSS over a utility framework, against our own tokens
  status: Accepted
  doc: docs/adr/ADR-0021-plain-css-over-a-utility-framework.md
- id: ADR-0022
  decision: The fakes live outside the production packages, kept there by three mechanisms
  status: Accepted
  doc: docs/adr/ADR-0022-fakes-outside-the-production-packages.md
- id: ADR-0023
  decision: A coverage cause is the error taxonomy plus one member, never attempted
  status: Accepted
  doc: docs/adr/ADR-0023-coverage-cause-is-the-taxonomy-plus-one.md
- id: ADR-0024
  decision: One collector owns a slice's graph, with a composite source rather than two schedules
  status: Accepted
  doc: docs/adr/ADR-0024-one-collector-owns-a-slice.md
- id: ADR-0025
  decision: A payer wide finding gets its own table, not a row in recommendation
  status: Accepted
