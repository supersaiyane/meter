  plan: plans/P5-implementation-plan.md
  depends_on: P0, P4
- id: P6
  name: Containers
  status: Delivered, 12 of 12 tasks in its first cut. Cost by cluster, namespace and
    workload, request against use, sizing into P3's table, Fargate snapped to sizes that
    can be ordered, and forecast as a third provenance before anything forecasts. FEAT-037
    is In build because the AWS adapter reads EKS and never ECS, ISS-224
  spec: specs/2026-09-20-p6-containers-design.md
  plan: plans/P6-implementation-plan.md
  depends_on: P0, P1
- id: P7
  name: Insight and LLM layer
  status: Delivered, 14 of 14 tasks in its first cut. A question answered from the routes the
    screens read, every figure cited from a tool result and never written by the model,
    refusals and failures as shapes of their own, a monthly token budget, secrets redacted or
    blocked before any prompt is built, and weekly digests composed whether or not anything can
    send them. FEAT-039 and FEAT-040 are In build because nothing reads change history or opens
    a pull request yet, ISS-227 and ISS-228. Bedrock spend is tagged for the platform cost
    screen through an inference profile per model, unverified against an account, ISS-002
  spec: specs/2026-09-28-p7-insight-and-llm-layer-design.md
  plan: plans/P7-implementation-plan.md
  depends_on: P1, P2, P3
- id: P8
  name: Experience and reporting
  status: Delivered, 18 of 18 tasks. Two themes of one glass design system, navigation by the FinOps Framework,
    Cost Explorer and the spend forecast, Excel and CSV reports behind the scope guard, saved views and
    scheduled reports rendered for each recipient, three persona dashboards and the account picker. Nothing
    is sent until OPEN-11 and nothing deleted until OPEN-15
  spec: specs/2026-10-05-p8-experience-and-reporting-design.md
  plan: plans/P8-implementation-plan.md
  depends_on: P1, P2, P3, P4, P5, P6, P7
- id: P9
  name: Price catalog and rightsizing targets
  status: Specified, planned and approved by the owner 2026-10-05, not started, TASK-P9-001 next.
    EC2 and EBS list prices from AWS, rightsizing down and up to a named and priced target, and gp2
    to gp3, once the hub reaches AWS by the path chosen in OPEN-16
  spec: specs/2026-10-05-p9-price-catalog-design.md
  plan: plans/P9-implementation-plan.md
  depends_on: P3
