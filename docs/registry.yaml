- id: OPEN-11
  question: Where does a per team digest go, email or Slack or both
  status: OPEN
  blocks: 'Nothing. TASK-P7-012 composes and stores a digest regardless, and sent_at stays null,
    which is a real state the screen states rather than an absence it hides'
  detail: '[P7 spec](docs/specs/2026-09-28-p7-insight-and-llm-layer-design.md) section 13. A
