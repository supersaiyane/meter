- id: CHG-0157
  date: '2026-10-11'
  type: Fix
  what: source-map-js 1.2.2, and npm's fix read as npm states it, ISS-269
  commit: pending
  detail: 'source-map-js moves from 1.2.1 to 1.2.2, which fixes GHSA-68fv-2mgg-jv7q, admitted through
    make dep-check; npm audit reports no vulnerability. The scan report now reads npm''s fixAvailable of
