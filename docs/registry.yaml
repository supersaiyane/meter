    them past the window, and make check-memory warns about it every session rather than failing,
    so nothing ever forced the issue. Found 2026-09-22 by running the script rather than trusting
    the warning. Eight rows appended after the closing prose on 2026-09-21 were moved into the log
    table the same day, which took the block count from 19 to 11 and is not a fix. The fix is
    either a script that rotates the first block and leaves the prose alone, or a checkpoint file
