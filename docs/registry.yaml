    fallback fired every time. Harmless until TASK-P2-021 made that column the one scope
    enforcement reads, at which point a scoped viewer silently lost every workspace. The upsert
    also never refreshed the column, so a corrected value would not have reached an existing
    estate. Fixed 2026-08-29 by carrying the account and region on SurfaceInstance from the
    adapter that knows them, and refreshing both on conflict
  status: FIXED
  detail: '`finops_core/domain/query.py`, `finops_providers/grafana/amg.py`,
