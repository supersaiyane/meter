# Alembic is the only way this schema changes. A manual ALTER against any
# environment is a change nothing can reproduce, and the next deploy either
# overwrites it or fails on it. See docs/07-DATA-MODEL.md.
#
# The database URL is deliberately absent from this file. migrations/env.py
# reads it from the settings object, so a connection string comes from exactly
# one place and no credential sits in a committed file.

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
path_separator = os
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
