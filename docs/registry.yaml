- id: ISS-081
  severity: LOW
  status: OPEN
  summary: The pxpipe proxy currently compresses nothing, every request skipped as unsupported_model,
    so it provides accounting rather than savings. Its log is also machine global rather than scoped to
    this project
  detail: Documented in [README.md](README.md). Re check with make stats after a session on the current
    model
- id: ISS-082
  severity: MEDIUM
  status: FIXED
  summary: Cost finding severity was a chosen label rather than derived from impact, so the ranking reflected
    the author rather than the money
  detail: '[ADR-0016](docs/adr/ADR-0016-dollar-based-severity.md)'
- id: ISS-083
  severity: MEDIUM
  status: FIXED
  summary: Anomaly detection had no thresholds defined at all, which is how anomaly detection becomes
    noise and gets muted
  detail: '[Competitive review](docs/11-COMPETITIVE-REVIEW.md). FEAT-023 amended with three concurrent
    thresholds'
- id: ISS-084
  severity: MEDIUM
  status: OPEN
  summary: The topology graph was built and used only for drawing, when it can score the blast radius
    of a change and gate auto apply
  detail: FEAT-044
- id: ISS-085
  severity: HIGH
  status: OPEN
  summary: Nothing scans what leaves for the language model provider, so a secret could be sent outbound
    in a prompt
  detail: FEAT-046. Seven scanners cover what comes in and none cover what goes out
- id: ISS-086
  severity: MEDIUM
  status: OPEN
  summary: Allocation had no export path, and finance does not work inside the product interface
  detail: FEAT-045
- id: ISS-087
  severity: MEDIUM
  status: OPEN
  summary: Feature flag owners and CODEOWNERS entries are placeholders, and a flag with no named owner
    is a branch nobody will ever remove
  detail: '`make check-docs` warns on each. Becomes an error before the first merge request'
- id: ISS-088
  severity: MEDIUM
  status: FIXED
  summary: Values were being written into code, compose and the Makefile with no single place to change
    them and no note of what each one does
  detail: '[ADR-0017](docs/adr/ADR-0017-configuration-and-feature-flags.md), `.env.example`, enforced
    by `scripts/ci/check_hardcoded.py`'
- id: ISS-089
  severity: MEDIUM
  status: FIXED
  summary: The management account dependency sat on the critical path, blocking the credential broker
    and everything downstream of it
  detail: Organizations is emulated by LocalStack, so the whole organization path is built and tested
    locally. The real management account is needed only for final verification. ISS-002 downgraded
- id: ISS-090
  severity: HIGH
  status: OPEN
  summary: A self hosted Grafana in a private subnet is not reachable from the hub VPC, so its queries
    cannot be scanned
  detail: '[P2 spec](docs/specs/2026-08-23-p2-query-cost-governance-design.md) section 12. Instance marked
    unreachable and excluded with a stated note. Agent based collection is a later sub project'
- id: ISS-091
  severity: MEDIUM
  status: OPEN
  summary: Scanning Grafana Cloud puts a third party API key inside Meter, which the threat model does
    not currently cover
  detail: '[P2 spec](docs/specs/2026-08-23-p2-query-cost-governance-design.md) section 12. Needs a new
    row in threat model boundary 5'
- id: ISS-092
  severity: HIGH
  status: OPEN
  summary: A deny action can cut an engineer off from Logs Insights during an incident, when it is exactly
    the tool they need
  detail: '[P2 spec](docs/specs/2026-08-23-p2-query-cost-governance-design.md) section 12. Auto expiry,
