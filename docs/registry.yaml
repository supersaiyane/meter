  detail: '[Data classification](docs/09-DATA-CLASSIFICATION.md) open question. Raised before data is
    aggregated away'
- id: ISS-079
  severity: MEDIUM
  status: OPEN
  summary: The audit_event non erasure position needs sign off from whoever owns data protection
  detail: '[Data classification](docs/09-DATA-CLASSIFICATION.md) open question. Before the first production
    deployment'
- id: ISS-080
  severity: MEDIUM
  status: FIXED
  summary: VPC interface endpoints were justified on cost, and the arithmetic shows NAT is cheaper below
