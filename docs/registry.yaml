    is
  detail: Noted in `pyproject.toml`. TASK-P0-011 and TASK-P0-024 each carry a probe to confirm the contract
    fires once the module exists
- id: ISS-110
  severity: HIGH
  status: FIXED
  summary: 'The import linter contracts forbidding external modules never worked: include_external_packages
    was not set, so boto3, fastapi and sqlalchemy were never checked and the contract looked like protection
    it was not providing'
  detail: 'Set in `pyproject.toml`, and verified by probe: finops_core importing boto3 now breaks the
    contract'
- id: ISS-111
  severity: MEDIUM
  status: FIXED
  summary: TASK-P0-029 was marked done without running the dependency admission gate, one of its acceptance
    criteria
  detail: 'Run 2026-10-07 against the full resolved tree: grype 0 findings across 97 packages, pip-audit
    0 advisories across 113. Recorded in the task evidence'
