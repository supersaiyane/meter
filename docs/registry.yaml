  status: FIXED
  detail: '`docs/specs/2026-09-18-p1-cost-intelligence-design.md` section 4,
    `docs/plans/P1-implementation-plan.md` TASK-P1-001 and TASK-P1-002'
- id: ISS-179
  severity: MEDIUM
  summary: No pipeline run has ever been observed. The repository has no git remote, so
    .gitlab-ci.yml has never executed, and every statement in this repository about what CI
    does is a reading of the file rather than a result. Found 2026-09-06 while chasing a
    variable in the test job, which turned out to be decoration, see ISS-178. Nothing here is
    known to be wrong. The point is that nothing here is known to be right either, and the
