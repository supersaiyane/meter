- id: ISS-150
  severity: HIGH
  summary: The web container had no proxy for `/api`, because a deployed environment terminates
    that path at the load balancer and the image config is written for that. Locally there is no
    load balancer, so every screen rendered an nginx 404 where its data should be. Fixed
    2026-08-29 with a local only overlay mounted over the image config, leaving the deployed
    configuration untouched
  status: FIXED
  detail: '`docker/nginx.local.conf`, `docker-compose.yml`'
- id: ISS-151
  severity: HIGH
  summary: The nginx image ships its own server block with `server_name localhost`, and nginx
    matches a server name exactly before falling back to the catch all. Every request whose Host
    is localhost was therefore served by the image default rather than by docker/nginx.conf, so
    the single page fallback was absent and a hard refresh on any route returned 404, and none of
    the three security headers were sent. A deployed environment is served under its own hostname
    and matches the catch all, so the effect there is limited to the day someone reaches the
    container as localhost. Fixed 2026-08-29 by copying an empty file over the image default,
    because the image has no shell to delete it with
  status: FIXED
  detail: '`docker/nginx.disabled.conf`, `docker/Dockerfile.web`'
- id: ISS-152
  severity: MEDIUM
  summary: The partial coverage banner read "1 missing. outside your scope" whatever the cause. On
    the query screens the missing workspace is usually one Meter could not read, not one the
    viewer is not entitled to, and naming the wrong cause sends the reader to an access request
    for a permission they already hold. The interface had nothing better to say because the
    envelope carried no failure for an unreachable workspace, because the route knew and did
    not report it. Fixed 2026-09-11 at the source. The query routes now report every unreachable workspace as
