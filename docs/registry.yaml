    unit rather than one ratio across all of them
  status: FIXED
  detail: '`finops_api/schemas.py`, `finops-web/src/components/CoverageBanner.tsx`'
- id: ISS-148
  severity: MEDIUM
  summary: TASK-P2-021 names eight routes and three MCP tools. Five routes now exist. The two
    remediation routes landed 2026-09-05 once TASK-P2-019 gave them a mechanism, and they carry
    the guard the plan asked for, refusing a finding that is not an explicit policy violation
    because a judgement call is a recommendation rather than a remediation. Three routes remain
    and none can be built here. Enforcement and its revoke need TASK-P2-016, parked on the AWS
    infrastructure ISS-122 records as never provisioned, and accuracy needs FEAT-018 which needs
    real CUR data. Two of the three MCP tools are still missing for the same reason, because each
