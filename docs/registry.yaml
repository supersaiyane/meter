  status: OPEN
  detail: '[P2 plan](docs/plans/P2-implementation-plan.md) TASK-P2-025'

- id: ISS-138
  severity: HIGH
  summary: ADR-0019 decided Tailwind driven by our tokens, and it was never installed or admitted
