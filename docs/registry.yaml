  summary: tasks/STATUS.md hand maintained a second copy of the plan task list and had drifted, showing
    31 tasks and a finished task as not started
  detail: Generated from the plan files by `scripts/docs/sync.py`. Each generated block now names its
    own source rather than all claiming the registry
- id: ISS-108
  severity: MEDIUM
  status: FIXED
  summary: project_map.md and CLAUDE.md named the Python packages with hyphens, finops-core rather than
    finops_core, so a reader following either would look for a directory that cannot exist because a Python
    package cannot contain a hyphen
  detail: 'Both corrected and the map verified against the tree. Also fixed: the map claimed PLANNED modules
    had no directory, which stopped being true at TASK-P0-029, the feature count said 42 against an actual
    50, and nine files were absent from the listing'
- id: ISS-109
  severity: MEDIUM
  status: FIXED
  summary: Two of the five forbidden targets in the finops_mcp import contract are inert because finops_api.db
    and finops_api.guards do not exist yet, so the contract reads as more protective than it currently
    is
  detail: Noted in `pyproject.toml`. TASK-P0-011 and TASK-P0-024 each carry a probe to confirm the contract
    fires once the module exists
- id: ISS-110
  severity: HIGH
  status: FIXED
  summary: 'The import linter contracts forbidding external modules never worked: include_external_packages
    was not set, so boto3, fastapi and sqlalchemy were never checked and the contract looked like protection
    it was not providing'
  detail: 'Set in `pyproject.toml`, and verified by probe: finops_core importing boto3 now breaks the
    contract'
- id: ISS-112
  severity: MEDIUM
  status: FIXED
  summary: TASK-P0-029 was marked done without running the dependency admission gate, one of its acceptance
    criteria
  detail: 'Run 2026-10-07 against the full resolved tree: grype 0 findings across 97 packages, pip-audit
    0 advisories across 113. Recorded in the task evidence'
- id: ISS-113
  severity: LOW
  status: FIXED
  summary: make lint failed on a terraform directory that Wave D has not created yet, leaving
    verify red for a reason unrelated to the change under review
  detail: '[P0 plan](docs/plans/P0-implementation-plan.md) TASK-P0-002'
- id: ISS-111
  severity: HIGH
  status: OPEN
  summary: Narrowed 2026-09-17 from the whole drill to its first step. The procedure now exists
    as make restore-drill and docs/runbooks/restore.md, and three of its four steps have been
    performed against a real restore of a real database, 21 tables with the migrations reaching
    head, the application starting against the restored data and the freshness route reporting
    ten collectors. Those three are where restores actually fail. What has never run is restoring
    from an Aurora snapshot, because no account has ever been provisioned, which is ISS-122. P0 is
    not signed off until that one step has been done once
  detail: '[P0 plan](docs/plans/P0-implementation-plan.md) TASK-P0-028, `docs/runbooks/restore.md`'
- id: ISS-114
  severity: HIGH
  status: FIXED
  summary: The API image could never have started. Its CMD named finops_api.main:app and no such
    module level symbol has ever existed, so every deploy of that image would have failed at
    startup with an attribute error and nothing in the build would have caught it
  detail: Found while adding the MCP server's command to the same image. Fixed with a bootstrap
    factory and `--factory`, and a test in `tests/mcp/test_contract.py` now imports every target
    the Dockerfile names
- id: ISS-115
  severity: MEDIUM
  status: FIXED
  summary: The layer ordering was written down twice and the two disagreed. pyproject.toml put
    finops_mcp above finops_api, correctly, and scripts/docs/build_file_graph.py put it below,
    so the graph check was enforcing the opposite of constraint 8 for that pair
  detail: Neither check noticed, because each was internally consistent. Corrected in the graph
    builder and held equal by `tests/scripts/test_layer_agreement.py`
- id: ISS-116
  severity: MEDIUM
  status: FIXED
  summary: Two issue numbers were used twice each. ISS-110 and ISS-111 each named two different
    issues, so half of them could not be referred to unambiguously
  detail: The later entries renumbered to ISS-112 and ISS-113. `scripts/docs/sync.py` now fails
    on a duplicate identifier in any section of the registry
- id: ISS-117
  severity: LOW
  status: OPEN
  summary: Docstring coverage on public symbols is 70.8 percent and the gate is set to that
    figure, so it blocks a drop but does not yet require 80 to match the test coverage floor
  detail: 'The gap is real work rather than noise: the missing entries are classes and public
    methods such as OrgRepository and its list_tree, not restatements of a name. Raise
    fail-under in `[tool.interrogate]` as they are written. Never lower it'
- id: ISS-118
  severity: HIGH
  status: FIXED
  summary: Five pipeline jobs called make on images that do not have it, so each would have
    failed with "make - command not found" before running a single check
  detail: '`python:slim` is Debian with no build tools. Fixed with a shared before_script, and
    `tests/scripts/test_pipeline.py` now fails when a job calls make on an image without it'
- id: ISS-119
  severity: MEDIUM
  status: FIXED
  summary: The pipeline documentation gate ran three of the eight checks in make check-docs.
    The other five ran only in `make verify` on a contributor's own machine
  detail: The five were the registry sync check, the context index check, the feature flag check,
    the hardcoded value check and the forbidden import check. The job now runs the target
- id: ISS-120
  severity: MEDIUM
  status: FIXED
  summary: The automated code review ran on merge requests only, leaving the default branch,
    the one everything deploys from, as the one branch nothing reviewed
  detail: A default branch rule added, and the report is now exposed on the pipeline rather than
    only attached
- id: ISS-121
  severity: LOW
  status: FIXED
  summary: The plan and the runbook index both said two alerts page. The alert table in
    docs/10-OBSERVABILITY.md marks four
  detail: 'Both were misreadings of the sentence under the table: two of the four are unusual,
    which is not the same as two being the total. The table was followed, the two summaries
    corrected, and a test now holds the paging set against the four names'
- id: ISS-122
  severity: HIGH
  status: OPEN
  summary: No Terraform stack has been planned or applied. terraform validate and fmt pass on
    all three, which checks syntax, provider schema and references, and checks nothing about
    whether the stack builds
  detail: 'A plan needs real credentials for the S3 state backend and for the caller identity
    data sources. Also outstanding from TASK-P0-033: the screenshot of a stalled collector in
    ALARM. P0 is not signed off until a plan runs'
- id: ISS-123
  severity: MEDIUM
  status: FIXED
  summary: .terraform.lock.hcl was gitignored, so the provider version could differ between the
    pipeline and a contributor's machine while base images were pinned by digest
  detail: The constraint is `~> 6.0`, which lets any 6.x resolve. The lock files are now
    committed for linux_amd64 and darwin_arm64, matching the reproducibility argument in
    docker/base-images.lock
- id: ISS-124
  severity: CRITICAL
  status: FIXED
  summary: The security report parsed only the Vulnerabilities array from the trivy output and
    never the Misconfigurations array, so every infrastructure as code finding was dropped and
    the gate printed PASS over them
  detail: 'Invisible while infra/terraform did not exist, because the scanner then had nothing
    to find and agreed with the parser. The first Terraform commit produced seven findings, two
    CRITICAL, and make security-scan reported zero. Four were real and were fixed: unrestricted
    egress, Performance Insights without a customer managed key, no VPC flow logs, and no S3
    access logging. Five are deliberate and are now recorded in accepted.yaml with an argument'
- id: ISS-125
  severity: MEDIUM
  status: FIXED
  summary: Mapping trivy's Resolution field onto fixed_in made the gate treat every
    misconfiguration as fixable by upgrade, so an acceptance record could never apply to one
  detail: Resolution is advice text rather than a version. A misconfiguration is a design choice,
    so it is either changed or accepted under ADR-0018, and the advice now goes in the description
- id: ISS-126
  severity: MEDIUM
  status: FIXED
  summary: scripts/ and migrations/ were outside PY_SRC, so neither was linted or format checked,
    and mypy was pointed at four packages by name, silently skipping finops_mcp, both directories
    and the whole test suite
  detail: '10 ruff findings and 36 mypy errors had accumulated unreported. Two were real: a list
    annotated flat while it held groups, and load_allowlist declaring a str key while the code
    keyed on a tuple, which is the only place a reader learns what an entry must match on.
    tests/scripts/test_lint_scope.py now asks the filesystem which directories hold Python and
    fails when one is not covered'
- id: ISS-127
  severity: MEDIUM
  status: FIXED
  summary: Twelve type ignore comments in the test suite were stale, silencing errors that no
    longer existed and standing ready to silence whatever landed on those lines next
  detail: Found the moment mypy was pointed at tests/ for the first time. All twelve removed
    rather than narrowed, and the four genuinely needed ones now carry a comment saying why
- id: ISS-128
  severity: MEDIUM
  status: FIXED
  summary: The memory gate rejected the one resume vector format CLAUDE.md asks for. It read
    `file.py:88` as a filename ending in colon eighty eight, so every citation with a line number
    failed as a path that does not exist
  detail: CLAUDE.md asks a resume vector for exact files and line numbers. The suffix is now split
    off and the line checked against the length of the file, so a citation past the end of a file
    fails too. Probed by citing line 9999 and confirming it is caught
- id: ISS-129
  severity: LOW
  status: BY DESIGN
  summary: The QuerySurface port has one implementation rather than three, so the abstraction is
    carrying no weight and could be read as speculative generality
  detail: 'Kept deliberately. The port exists for the fake, which is what lets the cost model be
    tested without a Grafana at all, and that is weight enough on its own. A second real strategy
    is a connector rather than a rewrite if OPEN-04 is ever re answered again'
- id: ISS-130
  severity: MEDIUM
  status: FIXED
  summary: sync.py counted any task status it did not recognise as not started, so descoping two
    P2 tasks left the plan reading as 22 tasks of work remaining rather than 20, and the descoped
    tasks did not appear in the exceptions table either
  detail: A Descoped bucket added, and an unrecognised status now raises rather than being
    absorbed. Probed by setting a status of Parked and confirming the generator refuses it
- id: ISS-131
  severity: LOW
  status: FIXED
  summary: The prototype emitted em dashes into generated UI copy, which the project's writing
    rules forbid, and its copy was excluded from make check-writing while it was a frozen baseline
  detail: 'Fixed by deletion at TASK-P2-003 rather than by editing, which was never permitted
    while the file was a baseline. The exclusion went with the directory. One of the six survives
    as a recorded divergence in tests/query/test_cost_model.py, because the golden files still
    hold the string the prototype produced'
- id: ISS-132
  severity: HIGH
  status: OPEN
  summary: A CloudWatch metric maths expression using the FILTER function is classified as Logs
    Insights, because the engine test is a substring match on "filter " in the expression
  detail: 'Pinned by tests/query/test_classify.py rather than fixed, because TASK-P2-002 is an
    extraction and changing it moves real numbers. The consequence is a metric query priced as a
    log scan, which overstates it by orders of magnitude. Fix in its own commit where the golden
    diff shows which figures moved'
- id: ISS-133
  severity: MEDIUM
  status: OPEN
  summary: An unrecognised datasource reports its own type as the engine, so a Postgres panel is
    priced at zero rather than reported as not understood
  detail: 'Zero reads as free. The honest answer for an engine with no rate is that the query was
    not priced, which is a different thing from a query that costs nothing. Pinned by
    tests/query/test_classify.py. Fix alongside ISS-132'
- id: ISS-134
  severity: MEDIUM
  status: FIXED
  summary: check_hardcoded.py never scanned finops_query, so TASK-P2-002's criterion that the
    gate passes was satisfied over code the gate had not read
  detail: 'check_forbidden_imports.py already listed the package and this one did not, which is
    what two lists of one thing produces. Now 76 files scanned where 73 were, and probed by
    planting a region literal in cost_model.py and confirming it is caught'
- id: ISS-135
  severity: HIGH
  status: FIXED
  summary: finops_query was in no layer list, so nothing constrained what it could import. Not
    the import-linter contract, not the graph builder, and not the distribution's own packages
  detail: 'It could have imported finops_api and all three checks would have passed. Holding the
    two orderings equal did not catch it, because they agreed about a package neither mentioned.
    tests/scripts/test_layer_agreement.py now asserts every declared package has a layer, and the
    constraint was probed by importing finops_api and confirming it breaks'
