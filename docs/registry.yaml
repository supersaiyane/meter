    resolve without the package directories. pyproject listed top level packages explicitly, so
    subpackages like finops_api.db were never in the wheel and a migration inside the image failed
    on ModuleNotFoundError. finops_query was never added to either Dockerfile after TASK-P2-003
    created it. docker-compose bound host port 5432 with no override. The services enumerated
