- id: ISS-093
  severity: HIGH
  status: OPEN
  summary: The modelled query cost has no published accuracy, so every figure is a projection presented
    alongside measured ones
  detail: FEAT-018. Until it lands, every modelled figure carries a visible caveat
- id: ISS-094
  severity: MEDIUM
  status: OPEN
  summary: A change to the Grafana dashboard JSON shape could cause silent under reporting
  detail: '[P2 spec](docs/specs/2026-08-23-p2-query-cost-governance-design.md) section 6. SchemaDrift
    is loud by design and an unrecognised panel raises rather than being skipped'
- id: ISS-095
  severity: MEDIUM
  status: OPEN
  summary: Nobody owns the never deny list, and enabling deny without one risks cutting off incident response
  detail: '[P2 spec](docs/specs/2026-08-23-p2-query-cost-governance-design.md) section 13. Blocks enabling
    deny, not building it'
- id: ISS-096
  severity: LOW
  status: OPEN
  summary: Unknown whether any dashboards are managed as code today, which determines the value of the
    CI policy gate
  detail: '[P2 spec](docs/specs/2026-08-23-p2-query-cost-governance-design.md) section 13. Affects FEAT-014
    scope'
- id: ISS-097
  severity: CRITICAL
  status: FIXED
  summary: 'The stated policy of zero vulnerabilities at any severity is unachievable: every Python base
    image carries unfixable CPython findings, so the rule would have been routed around rather than met'
  detail: '[ADR-0018](docs/adr/ADR-0018-zero-fixable-not-zero-findings.md). Threshold is now zero findings
    that have a published fix'
- id: ISS-098
  severity: HIGH
  status: FIXED
  summary: The chosen base image versions were picked by habit, not measurement. python 3.12 carried 3
    High findings and nginx 1.27 carried 93 including 6 Critical
  detail: Moved to python 3.13 and nginx 1.30, both measured at TASK-P0-029. node:22-dev was already clean
- id: ISS-099
  severity: MEDIUM
  status: FIXED
  summary: Base image tags were floating, so a build was not reproducible and a tag could be repointed
    after it was scanned
  detail: '`docker/base-images.lock` with resolved digests, `make base-images-check` fails on drift'
- id: ISS-100
  severity: MEDIUM
  status: OPEN
  summary: Three unfixable CPython findings are accepted on a reachability argument that depends on nobody
    importing stringprep, poplib or urllib.request
  detail: Enforced by `scripts/ci/check_forbidden_imports.py`, which fails the build. Review 2026-11-21
- id: ISS-101
  severity: LOW
  status: FIXED
  summary: The doc and policy scripts claimed to run before make setup, but pyyaml is absent from a system
    interpreter and PEP 668 blocks adding it
  detail: They now run from the project venv, and `scripts/README.md` states this rather than the previous
    claim
- id: ISS-102
  severity: HIGH
  status: FIXED
  summary: Every honesty guarantee in the product is enforced by a database constraint and then delivered
    by an undesigned pixel, so the constraint work could be thrown away in the last six inches
  detail: '[docs/12-UI-DESIGN.md](docs/12-UI-DESIGN.md). The Figure component makes a number unrenderable
    without its provenance'
- id: ISS-103
  severity: MEDIUM
  status: FIXED
  summary: No component inventory existed, so each sub project would have invented its own table and the
    product would acquire several visual languages
  detail: '[docs/12-UI-DESIGN.md](docs/12-UI-DESIGN.md) section 11, built once in P0'
- id: ISS-104
  severity: MEDIUM
  status: FIXED
  summary: No accessibility position, when provenance encoded by colour alone would fail for roughly 8
    percent of men, in print, and in a screenshot pasted into a ticket
  detail: '[docs/12-UI-DESIGN.md](docs/12-UI-DESIGN.md) section 9. Provenance carried redundantly by fill,
    prefix and label'
- id: ISS-105
  severity: MEDIUM
  status: FIXED
  summary: No state matrix, so loading, empty, partial, stale, degraded and failed would each be improvised
    per screen and several would be missed
  detail: '[docs/12-UI-DESIGN.md](docs/12-UI-DESIGN.md) section 8. Seven states, enforced by StateBoundary'
- id: ISS-106
  severity: MEDIUM
  status: FIXED
  summary: TASK-P0-029 was completed without its Status, evidence or deviation being recorded in the plan,
    so the plan read as though no work had been done
  detail: Plan corrected. The deviation, that 029 created package namespaces belonging to TASK-P0-001,
    is now recorded rather than absorbed
- id: ISS-107
  severity: MEDIUM
  status: FIXED
  summary: tasks/STATUS.md hand maintained a second copy of the plan task list and had drifted, showing
    31 tasks and a finished task as not started
  detail: Generated from the plan files by `scripts/docs/sync.py`. Each generated block now names its
    own source rather than all claiming the registry
- id: ISS-108
  severity: MEDIUM
  status: FIXED
  summary: project_map.md and CLAUDE.md named the Python packages with hyphens, finops-core rather than
    finops_core, so a reader following either would look for a directory that cannot exist because a Python
    package cannot contain a hyphen
  detail: 'Both corrected and the map verified against the tree. Also fixed: the map claimed PLANNED modules
    had no directory, which stopped being true at TASK-P0-029, the feature count said 42 against an actual
    50, and nine files were absent from the listing'
- id: ISS-109
  severity: MEDIUM
  status: FIXED
  summary: Two of the five forbidden targets in the finops_mcp import contract are inert because finops_api.db
