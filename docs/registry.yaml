    tracked ones were meant to be is diluted by iteration output. The durable record is
    security/POSTURE.md, which is generated and tracked. Whether the timestamped directories belong
    in the repository at all is a decision for whoever owns the security posture, and is left open
    rather than changed unilaterally
  status: OPEN
  detail: '`security/reports/`, `.gitignore`'
