# Intentionally empty.
#
# The base image ships /etc/nginx/conf.d/nginx.default.conf with
# `server_name localhost`, and nginx matches a server name exactly before it
# falls back to the catch all `_`. Any request whose Host is `localhost`, which
# is every request in local development, was therefore served by the image's
# default rather than by docker/nginx.conf: no single page fallback, so a hard
# refresh on any route returned 404, and none of the security headers.
#
# The image has no shell, so this file is copied over it rather than deleted.
# ISS-151.
