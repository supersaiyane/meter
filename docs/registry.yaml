- id: ISS-172
  severity: MEDIUM
  summary: Meter has no memory of what a finding cost last week. The prototype saved a
    snapshot per run, loaded its own history and computed trends and a rogue cost from it,
    so a reader could see whether a workspace was getting worse. P2 has no snapshot table,
    no history and no trend, the word trend appears zero times in the spec, and section 3
    does not place it out of scope. Every figure the product shows is the present moment.
    A cost governance tool that cannot say a query got more expensive can report a problem
    and not that somebody caused it. Found 2026-10-11 by mapping the restored prototype
    against what P2 delivered
  status: OPEN
  detail: '`docs/reference/sample_lambda.py.txt`, build_snapshot, save_snapshot, load_history,
    compute_trends and compute_rogue_cost. Needs a table and a retention decision, and
    overlaps P1 which owns trend for spend. Fixed 2026-09-06, and smaller than it read:
    query_finding upserts on tenant, query and run_date, so the audit had been writing one
    row per query per day since it was built and nothing ever read them. The history is a
    side effect of idempotency rather than something anybody had to build. Scoped to a
    finding rather than to spend, which keeps it clear of P1: whether one query costs more
