  status: OPEN
  detail: '`.gitlab-ci.yml`, and any document that describes what the pipeline does'
- id: ISS-178
  severity: MEDIUM
  summary: The CI test job could not have run an integration test. It declared a PostgreSQL
    service and a METER_DATABASE_URL beside it, and nothing in the test path read either. The
    settings fixture builds from .env.example, and the database fixture started a
    testcontainer regardless, which python 3.13 slim has no Docker socket to do. Both were
    decoration, and the integration tests would have errored on every run. Found 2026-09-06
    by asking what the variable was for. Fixed the same day. The fixture now runs against a
    database it is given through METER_TEST_DATABASE_URL, falling back to a testcontainer,
    and the job sets that. The name is deliberately not METER_DATABASE_URL, which is in every
    .env and in the shell of anybody who has run make seed, and the fixture refuses a host
    that is not local because it migrates the database and writes to it
  status: FIXED
  detail: '`tests/conftest.py`, the engine fixture, and the test job in `.gitlab-ci.yml`'
- id: ISS-177
  severity: HIGH
  summary: The ad hoc query list reported one query once per day audited, and its cost that
    many times over. query_adhoc keeps one row per query per account, region and day, the
    same shape query_finding has, and most_expensive never filtered on the day. This is
    ISS-175 on the table that fix did not reach. Found 2026-09-06 by seeding seven days and
    reading the screen, which showed 14 rows for 2 queries and 356 runs where the newest day
    had 57. One seeded day hides it completely. The route had no test at all, which is what
    let a known bug reappear on a second table. Fixed the same day, the predicate is now one
    function both repositories call, named per table because getting the identity columns
    wrong drops rows silently rather than failing
  status: FIXED
  detail: '`finops_api/db/repositories/query.py`, latest_audit_only, and `tests/api/test_query_routes.py`'
- id: ISS-176
  severity: LOW
  summary: make unseed failed on a foreign key and could not remove the demo estate.
    query_adhoc was added in TASK-P2-026 and not added to DEMO_TABLES, so the teardown
    deleted everything else and then could not delete the tenant. The command reported an
    error and left a half removed estate behind. Found 2026-09-06 by running unseed, not by
    any test, because nothing derived the teardown list from the schema. Fixed the same day,
    and a test now derives every tenant scoped table from the model metadata and requires
    each to be either torn down or declared as never seeded, so the next table added is
    caught the day it is added rather than the day somebody unseeds
  status: FIXED
  detail: '`scripts/demo/seed_demo.py`, DEMO_TABLES, and `tests/scripts/test_seed_demo.py`'
- id: ISS-175
  severity: HIGH
  summary: The findings list and the grouped view returned every audited day rather than
    each query's latest, so a finding appeared once per day the collector had run and the
    group sums added those days together. The estate's reported cost therefore grew by one
    estate per day. It was invisible for as long as the seeded estate held a single day of
    history, and became visible the moment a second existed, which is also what made the
    trend in ISS-172 possible. The front page read $5,088 for a group whose true cost was
    $2,544. Found 2026-09-06 while adding the sparkline column, by reading the rendered
    table rather than by any test. Fixed the same day by confining both reads to each
    query's most recent run date, per query rather than one global maximum so a query that
    stops being audited keeps its last known state
  status: FIXED
  detail: '`finops_api/db/repositories/query.py`, ranked and grouped, via _latest_only'
- id: ISS-174
  severity: LOW
  summary: The ad hoc screen cannot tell an estate with no hand run queries from one whose
    evidence could not be read. Both render as an empty table. `_observations` in the query
    audit collector catches a CollectionError and returns None so the run continues, which
    is correct for the findings, because a modelled estate is still worth reporting and an
    aborted one is not. It leaves nothing for this screen to read. The fix is to record the
    evidence failure as a typed failure on the envelope, which is a change to the
    collector's error path rather than to the screen. Found 2026-09-06 while writing
    TASK-P2-026, and left as the one acceptance criterion that task did not meet. Fixed
    2026-09-06 by recording the failure through the run ledger, the same table and the
    same path an unreachable workspace uses, so it reaches the trust strip on every
    envelope rather than only this screen, and clears when the scope recovers. That also
    surfaces the reason every figure had quietly stayed modelled, which was invisible for
    the same reason
  status: FIXED
  detail: '`finops_ingest/collectors/query_audit.py`, _observations, and
    `finops-web/src/screens/QueryAdhocScreen.tsx`'
- id: ISS-171
  severity: MEDIUM
  summary: Ad hoc query detection was in the prototype and is in neither the P2 spec nor the
    code. The prototype's extract_adhoc_queries and its own report tab found Logs Insights
    queries run directly by a person, from no dashboard and no alert rule, and named the
    caller from CloudTrail. Those are the queries nobody owns, and a one off thirty day scan
    costs real money, appears on no dashboard, and Meter as built cannot see it at all.
    The word adhoc appears zero times in the spec and in zero source files, and section 3
    of the spec does not list it as out of scope either, so this was never deferred to a
    later sub project. It fell through the gap between the prototype and the specification
    written from it. Found 2026-10-11 by mapping the restored prototype against what P2
    delivered
  status: OPEN
  detail: '`docs/reference/sample_lambda.py.txt`, extract_adhoc_queries and build_adhoc_tab.
    Needs a CloudTrail read the AWS adapter does not make yet'
- id: ISS-172
  severity: MEDIUM
  summary: Meter has no memory of what a finding cost last week. The prototype saved a
    snapshot per run, loaded its own history and computed trends and a rogue cost from it,
    so a reader could see whether a workspace was getting worse. P2 has no snapshot table,
    no history and no trend, the word trend appears zero times in the spec, and section 3
    does not place it out of scope. Every figure the product shows is the present moment.
    A cost governance tool that cannot say a query got more expensive can report a problem
    and not that somebody caused it. Found 2026-10-11 by mapping the restored prototype
    against what P2 delivered
  status: OPEN
  detail: '`docs/reference/sample_lambda.py.txt`, build_snapshot, save_snapshot, load_history,
    compute_trends and compute_rogue_cost. Needs a table and a retention decision, and
    overlaps P1 which owns trend for spend. Fixed 2026-09-06, and smaller than it read:
    query_finding upserts on tenant, query and run_date, so the audit had been writing one
    row per query per day since it was built and nothing ever read them. The history is a
    side effect of idempotency rather than something anybody had to build. Scoped to a
    finding rather than to spend, which keeps it clear of P1: whether one query costs more
    this week is a governance question, and what an account spends is not'
- id: ISS-173
  severity: LOW
  summary: The P2 specification was written from the prototype and never recorded what it
    chose to leave behind. Section 3 lists four things as out of scope, all of them whole
    sub projects or engines, and none of the prototype's own capabilities. Two features
    were dropped silently as a result, ISS-171 and ISS-172, and neither was visible as
    missing until the prototype was restored and read side by side with the delivered
    work. The gap is process rather than code, because a specification derived from a working
    thing should enumerate what it declines to carry over. Found 2026-10-11
  status: OPEN
  detail: '`docs/specs/2026-08-23-p2-query-cost-governance-design.md` section 3, and
    `docs/reference/README.md` which now holds the prototype it was derived from'
- id: ISS-170
  severity: MEDIUM
  summary: get_settings loaded configuration from the environment unconditionally, so create_app's
    settings argument was a lie for every route that took the dependency. The application was
    assembled with one configuration and its routes answered from another, which is two sources
