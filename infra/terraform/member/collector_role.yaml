AWSTemplateFormatVersion: "2010-09-09"

# The role Meter reads a member account through.
#
# This is a CloudFormation template rather than Terraform because it is deployed
# by a service managed StackSet, and a service managed StackSet takes
# CloudFormation. That is also the whole reason for the choice: it deploys into
# every account in the organization automatically, including accounts created
# after this was applied. A newly vended account is therefore readable with no
# human step, which is the P0 definition of done for onboarding. A self managed
# StackSet does not do that, and neither does Terraform on its own without a
# provider alias per account.

Description: >-
  Read only collector role for Meter. Assumed by the hub task role only, and
  only from inside this organization.

Parameters:
  HubAccountId:
    Type: String
    AllowedPattern: "^[0-9]{12}$"
    Description: The account Meter's hub runs in.

  HubTaskRoleName:
    Type: String
    Default: FinOpsHubTaskRole
    Description: The exact role in the hub account that may assume this one.

  RelayRoleName:
    Type: String
    Default: FinOpsRelayRole
    Description: >-
      The relay in the hub account, which makes Support's Trusted Advisor reads outside the
      hub's VPC, ADR-0035. Assumes this role narrowed by a session policy to the one action.

  ExternalId:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: >-
      Shared secret required on every assume. At least 32 characters, because a
      guessable ExternalId is not a control.

  OrganizationId:
    Type: String
    AllowedPattern: "^o-[a-z0-9]{10,32}$"
    Description: >-
      Used in the aws:PrincipalOrgID condition. Without it, the ExternalId is
      the only thing standing between this role and a confused deputy.

  RoleName:
    Type: String
    Default: FinOpsCollectorRole
    Description: Must match METER_COLLECTOR_ROLE_NAME on the hub side.

  InvocationLogGroupPattern:
    Type: String
    Default: /aws/bedrock/*
    AllowedPattern: "^[A-Za-z0-9_./#*-]{1,512}$"
    Description: >-
      The CloudWatch Logs groups Bedrock model invocation logging writes to, P13 and FEAT-082.
      The role may start a Logs Insights query on these and on no other group, because the logs
      hold every prompt and response: Meter runs one aggregate query on them and reads no body,
      and this is what keeps its reach into the account's logs to the groups the owner chose.

Resources:
  CollectorRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref RoleName
      Description: Read only access for Meter. See the Meter repository, ADR-0004.
      MaxSessionDuration: 3600
      Tags:
        - Key: "finops:module"
          Value: member
        - Key: ManagedBy
          Value: cloudformation-stackset
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          # Three conditions, all required. The principal is the hub's task role
          # by name, the ExternalId is a secret, and PrincipalOrgID means a
          # principal outside this organization cannot assume the role even if
          # it holds both of the other two.
          - Sid: HubTaskRoleInsideThisOrganization
            Effect: Allow
            Action: sts:AssumeRole
            Principal:
              AWS:
                - !Sub "arn:${AWS::Partition}:iam::${HubAccountId}:role/${HubTaskRoleName}"
                - !Sub "arn:${AWS::Partition}:iam::${HubAccountId}:role/${RelayRoleName}"
            Condition:
              StringEquals:
                sts:ExternalId: !Ref ExternalId
                aws:PrincipalOrgID: !Ref OrganizationId

      Policies:
        - PolicyName: MeterCollectorRead
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # One block, and every action annotated with the collector that
              # needs it. ReadOnlyAccess appears nowhere: it grants S3 object
              # reads and SSM parameter reads that Meter never makes, which is
              # ISS-010.
              - Sid: MeterReadsOnly
                Effect: Allow
                Action:
                  # account_health, the probe that proves the role works.
                  - sts:GetCallerIdentity
                  # platform_cost and the P1 cost collectors.
                  - ce:GetCostAndUsage
                  - ce:GetCostAndUsageWithResources
                  - ce:GetDimensionValues
                  - ce:GetTags
                  # P3 utilization. Listed now so the StackSet is not
                  # redeployed across three hundred accounts to add one action.
                  - cloudwatch:GetMetricData
                  - cloudwatch:ListMetrics
                  - compute-optimizer:GetEC2InstanceRecommendations
                  - compute-optimizer:GetAutoScalingGroupRecommendations
                  - compute-optimizer:GetEBSVolumeRecommendations
                  - compute-optimizer:GetLambdaFunctionRecommendations
                  # P4 inventory and topology.
                  - tag:GetResources
                  - tag:GetTagKeys
                  - config:SelectResourceConfig
                  # P11 ownership, TASK-P11-003. AppRegistry's applications and the owners
                  # their attribute groups name; AppRegistry signs as servicecatalog.
                  - servicecatalog:ListApplications
                  - servicecatalog:GetApplication
                  - servicecatalog:ListAssociatedResources
                  - servicecatalog:ListAttributeGroupsForApplication
                  - servicecatalog:GetAttributeGroup
                  # P11 ownership, TASK-P11-004. Who created a resource, from CloudTrail's
                  # 90 days of event history. A read: it returns events, it changes nothing.
                  - cloudtrail:LookupEvents
                  # P5 quotas. Every entry is a read, and the absence is deliberate:
                  # servicequotas:RequestServiceQuotaIncrease is NOT granted. Constraint 6
                  # and P5 spec section 6, Meter drafts a quota increase and hands it to a
                  # person. The permission is not here to be misused later, and a test
                  # asserts that it is still missing.
                  - servicequotas:ListServices
                  - servicequotas:ListServiceQuotas
                  - servicequotas:GetServiceQuota
                  # The tracking half of FEAT-034. Reading what somebody else submitted.
                  - servicequotas:ListRequestedServiceQuotaChangeHistory
                  - support:DescribeTrustedAdvisorChecks
                  - support:DescribeTrustedAdvisorCheckResult
                  # The two quotas whose usage is counted directly, because nothing else
                  # publishes it. See COUNTERS in finops_providers/aws/quotas.py.
                  - ec2:DescribeVpcs
                  - ec2:DescribeAddresses
                  # P13 bedrock_invocations, TASK-P13-003. Where the account's invocation logs go,
                  # and the results of the one aggregate query below. Neither names a log group,
                  # so neither can be narrowed by one.
                  - bedrock:GetModelInvocationLoggingConfiguration
                  - logs:GetQueryResults
                  # P14 commitment_inventory, TASK-P14-002. What this account holds, its Savings
                  # Plans and its reservations, with their terms and ends. Reads only: nothing
                  # that buys, exchanges or sells a commitment is granted, constraint 6, held by
                  # tests/contract/test_no_commitment_purchases.py.
                  - savingsplans:DescribeSavingsPlans
                  - ec2:DescribeReservedInstances
                  - rds:DescribeReservedDBInstances
                  # TASK-P14-003. The other reservable services. DynamoDB reserved capacity has
                  # no read API, ISS-295, so nothing is granted for it.
                  - elasticache:DescribeReservedCacheNodes
                  - es:DescribeReservedInstances
                  - redshift:DescribeReservedNodes
                  - memorydb:DescribeReservedNodes
                Resource: "*"
              # P13 bedrock_invocations. Starting a query is the one action that reads a log
              # group, and the invocation logs hold every prompt and response, so it is granted
              # on the groups the owner names and nothing else. The query Meter runs returns
              # aggregates only, held by tests/providers/aws/test_bedrock_invocations.py.
              - Sid: MeterQueriesInvocationLogsOnly
                Effect: Allow
                Action:
                  - logs:StartQuery
                Resource: !Sub "arn:${AWS::Partition}:logs:*:${AWS::AccountId}:log-group:${InvocationLogGroupPattern}"

Outputs:
  RoleArn:
    Description: The collector role in this account.
    Value: !GetAtt CollectorRole.Arn
