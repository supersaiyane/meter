server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Single page application. Any unknown path resolves to index.html so
    # client side routing works on a hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets are immutable. index.html never is, or a deploy
    # would not reach a browser that already has it cached.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    add_header X-Content-Type-Options   "nosniff"        always;
    add_header X-Frame-Options          "DENY"           always;
    add_header Referrer-Policy          "same-origin"    always;

    gzip             on;
    gzip_types       text/css application/javascript application/json image/svg+xml;
    gzip_min_length  1024;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;
}
