issues:
- id: ISS-001
  severity: CRITICAL
  summary: Nine requirement areas as one project would produce a shallow scaffold of everything
  status: FIXED
  detail: '[ADR-0001](docs/adr/ADR-0001-decompose-into-sub-projects.md)'
- id: ISS-005
  severity: HIGH
  summary: A bespoke cost schema forces a migration per cloud provider
  status: FIXED
  detail: '[ADR-0002](docs/adr/ADR-0002-focus-canonical-schema.md)'
- id: ISS-006
  severity: HIGH
  summary: Serving dashboards from Athena recreates the runaway query cost problem inside Meter
  status: FIXED
  detail: '[ADR-0003](docs/adr/ADR-0003-postgres-only-serving-layer.md)'
- id: ISS-007
  severity: HIGH
  summary: Unblended per resource cost is meaningless with commitments in play
  status: FIXED
  detail: '[architecture](docs/02-ARCHITECTURE.md)'
- id: ISS-008
  severity: HIGH
  summary: CUR is restated all month, so naive ingest double counts
  status: FIXED
  detail: '[P0 spec](docs/specs/2026-08-23-p0-foundation-design.md) section 5.3'
- id: ISS-009
  severity: HIGH
  summary: Interface only scope enforcement is bypassable
  status: FIXED
  detail: '[P0 spec](docs/specs/2026-08-23-p0-foundation-design.md) section 8'
- id: ISS-010
  severity: HIGH
  summary: ReadOnlyAccess grants data plane reads that cannot be defended
  status: FIXED
  detail: '[ADR-0004](docs/adr/ADR-0004-cross-account-access.md)'
- id: ISS-015
  severity: HIGH
  summary: A failed collection rendered as zero silently produces wrong totals
  status: FIXED
  detail: '[P0 spec](docs/specs/2026-08-23-p0-foundation-design.md) section 6'
- id: ISS-016
  severity: HIGH
  summary: Entitlement based visibility silently makes organization totals partial
  status: FIXED
  detail: '[P0 spec](docs/specs/2026-08-23-p0-foundation-design.md) section 6'
- id: ISS-011
  severity: MEDIUM
  summary: A model producing sizing numbers destroys trust on the first hallucination
  status: FIXED
  detail: '[ADR-0007](docs/adr/ADR-0007-llm-never-computes-a-number.md)'
- id: ISS-012
  severity: MEDIUM
  summary: Organization wide AWS Config recording is a five figure monthly cost
  status: OPEN
  detail: '[tasks/ISSUES.md](tasks/ISSUES.md), resolved in P4'
- id: ISS-013
  severity: MEDIUM
  summary: Hundreds of describe loops for inventory is a year of work
  status: FIXED
  detail: '[roadmap](docs/01-ROADMAP.md) P4'
- id: ISS-014
  severity: MEDIUM
  summary: Neptune is a second database for capability not shown to be needed
  status: FIXED
  detail: '[ADR-0005](docs/adr/ADR-0005-postgres-adjacency-for-topology.md)'
- id: ISS-017
  severity: MEDIUM
  summary: A local identity provider reaching production is a total auth bypass
  status: FIXED
  detail: '[P0 spec](docs/specs/2026-08-23-p0-foundation-design.md) section 11'
- id: ISS-018
  severity: MEDIUM
