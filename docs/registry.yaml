- id: ISS-171
  severity: MEDIUM
  summary: Ad hoc query detection was in the prototype and is in neither the P2 spec nor the
    code. The prototype's extract_adhoc_queries and its own report tab found Logs Insights
    queries run directly by a person, from no dashboard and no alert rule, and named the
    caller from CloudTrail. Those are the queries nobody owns, and a one off thirty day scan
