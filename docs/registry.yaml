  status: FIXED
  detail: '`finops-web/src/shell/AppShell.tsx`, `finops-web/src/layout.css`'
- id: ISS-157
  severity: MEDIUM
  summary: The coverage banner said `accounts` on every screen because the noun was hardcoded in
    the component, and the query screens count workspaces. The aggregate then took the smallest
    visible and the largest total across panels counting different things, which on Home produced
    "Showing 0 of 3", true of nothing on the page. Fixed 2026-09-11 by carrying the counted noun
