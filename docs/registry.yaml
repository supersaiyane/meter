adrs:
- id: ADR-0001
  decision: Decompose into eight sub projects, build P0 then P2 then P1
  status: Accepted
  doc: docs/adr/ADR-0001-decompose-into-sub-projects.md
- id: ADR-0002
  decision: FOCUS 1.1 is the canonical cost schema
  status: Accepted
  doc: docs/adr/ADR-0002-focus-canonical-schema.md
- id: ADR-0003
  decision: PostgreSQL only for the serving layer, no ClickHouse in P0
  status: Accepted
  doc: docs/adr/ADR-0003-postgres-only-serving-layer.md
- id: ADR-0004
  decision: Cross account access by StackSet deployed role, curated policy
  status: Accepted
  doc: docs/adr/ADR-0004-cross-account-access.md
- id: ADR-0005
  decision: PostgreSQL adjacency tables for topology, not a graph database
  status: Accepted
  doc: docs/adr/ADR-0005-postgres-adjacency-for-topology.md
- id: ADR-0006
  decision: Ingest AWS native recommendation services before building a collector
  status: Accepted
  doc: docs/adr/ADR-0006-aws-native-recommendations-first.md
- id: ADR-0007
  decision: The language model never computes a number
  status: Accepted
  doc: docs/adr/ADR-0007-llm-never-computes-a-number.md
- id: ADR-0008
  decision: Identity adapter deferred, isolated behind two ports
  status: Accepted
  doc: docs/adr/ADR-0008-identity-adapter-deferred.md
- id: ADR-0009
  decision: An MCP server alongside the HTTP API, not instead of it
  status: Accepted
  doc: docs/adr/ADR-0009-mcp-alongside-http-api.md
- id: ADR-0010
  decision: Minimus base images and a continuously maintained zero CVE posture
  status: Accepted, threshold amended by ADR-0018
  doc: docs/adr/ADR-0010-minimus-zero-cve-base-images.md
- id: ADR-0011
  decision: A decision ladder before any new code, and token economy
  status: Superseded by ADR-0013
  doc: docs/adr/ADR-0011-minimal-code-decision-ladder.md
- id: ADR-0012
  decision: Collection cadence is data, not code, and is bounded by the source
  status: Accepted
  doc: docs/adr/ADR-0012-collector-cadence-registry.md
- id: ADR-0013
  decision: Seven rung ladder with a Rung Disqualification Record and a security sign off gate
  status: Accepted
  doc: docs/adr/ADR-0013-seven-rung-ladder-and-disqualification.md
- id: ADR-0014
  decision: Derived documentation is generated from a registry, not hand maintained
  status: Accepted
  doc: docs/adr/ADR-0014-generated-documentation.md
- id: ADR-0015
  decision: Deterministic forecasting is permitted where a language model number is not
  status: Accepted
  doc: docs/adr/ADR-0015-deterministic-forecasting-is-permitted.md
- id: ADR-0016
  decision: Severity on a cost finding is derived from the money, never chosen
  status: Accepted
  doc: docs/adr/ADR-0016-dollar-based-severity.md
- id: ADR-0017
  decision: Nothing is hardcoded, and every feature flag has an owner and an expiry
  status: Accepted
  doc: docs/adr/ADR-0017-configuration-and-feature-flags.md
- id: ADR-0018
  decision: The threshold is zero fixable findings, not zero findings
  status: Accepted
  doc: docs/adr/ADR-0018-zero-fixable-not-zero-findings.md
- id: ADR-0019
  decision: Headless component behaviour, our own visual layer
  status: Accepted, styling row superseded by ADR-0021
  doc: docs/adr/ADR-0019-headless-components-own-visual-layer.md
- id: ADR-0020
  decision: Seven fixed navigation groups, and the routes they fix
  status: Superseded by ADR-0030
  doc: docs/adr/ADR-0020-seven-fixed-navigation-groups.md
- id: ADR-0021
  decision: Plain CSS over a utility framework, against our own tokens
  status: Accepted
  doc: docs/adr/ADR-0021-plain-css-over-a-utility-framework.md
- id: ADR-0022
  decision: The fakes live outside the production packages, kept there by three mechanisms
  status: Accepted
  doc: docs/adr/ADR-0022-fakes-outside-the-production-packages.md
- id: ADR-0023
  decision: A coverage cause is the error taxonomy plus one member, never attempted
  status: Accepted
  doc: docs/adr/ADR-0023-coverage-cause-is-the-taxonomy-plus-one.md
- id: ADR-0024
  decision: One collector owns a slice's graph, with a composite source rather than two schedules
  status: Accepted
  doc: docs/adr/ADR-0024-one-collector-owns-a-slice.md
- id: ADR-0025
  decision: A payer wide finding gets its own table, not a row in recommendation
  status: Accepted
  doc: docs/adr/ADR-0025-a-payer-wide-finding-is-its-own-table.md
- id: ADR-0026
  decision: A seventh cause, for a value this deployment set that does not exist
  status: Accepted
  doc: docs/adr/ADR-0026-a-seventh-cause-for-misconfiguration.md

- id: ADR-0027
  decision: No performance dimension in P5, and what to build instead
  status: Accepted
  doc: docs/adr/ADR-0027-no-performance-dimension-in-p5.md
- id: ADR-0028
  decision: The language model runs in the hub account, on Bedrock
  status: Accepted
  doc: docs/adr/ADR-0028-the-model-runs-in-the-hub-account.md
- id: ADR-0029
  decision: A row that belongs to a person is scoped by that person
  status: Accepted
  doc: docs/adr/ADR-0029-a-row-that-belongs-to-a-person.md
- id: ADR-0030
  decision: Navigation follows the FinOps Framework
  status: Accepted
  doc: docs/adr/ADR-0030-navigation-follows-the-finops-framework.md
- id: ADR-0031
  decision: Dependencies are installed from a lock, never resolved
  status: Accepted
  doc: docs/adr/ADR-0031-dependencies-installed-from-a-lock.md

- id: ADR-0032
  decision: A row a person may share is read by its owner and, once shared, by the tenant
  status: Accepted
  doc: docs/adr/ADR-0032-a-shared-row-is-configuration.md

- id: ADR-0033
  decision: Scheduled reports render inside the API, as each recipient
  status: Accepted
  doc: docs/adr/ADR-0033-scheduled-reports-render-in-the-api.md

