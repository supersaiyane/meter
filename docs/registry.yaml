    then copied into the runtime with it. setuptools 70.3.0 alone accounted for one High and one
    Medium in every image, four of the eight unresolved findings in the first image scan that had
    ever run. Build tools are not runtime code and are now removed from the venv before it is
    copied, which fixes the findings at the source rather than chasing a version and makes the
    image smaller. The remaining finding, CVE-2026-19672 in the base image, has no published fix
    and is accepted with an enforced reachability argument
  status: FIXED
  detail: '`docker/Dockerfile.api`, `docker/Dockerfile.worker`, `security/policy/accepted.yaml`'
