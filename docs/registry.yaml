- id: CHG-0163
  date: '2026-10-12'
  type: Feature
  what: TASK-P12-004, the dispatcher and the worker as processes
  commit: pending
  detail: 'finops_ingest/processes.py: the one shot dispatcher, windows aligned to each cadence, a failed tenant
