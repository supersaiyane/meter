[project]
name = "meter"
version = "0.1.0"
description = "FinOps platform for AWS, built so other providers are connectors rather than rewrites"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "boto3>=1.35",
    "structlog>=24.4",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "moto[all]>=5.0",
    "testcontainers[postgres]>=4.8",
    "ruff>=0.8",
    "mypy>=1.13",
    "import-linter>=2.1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "finops_core",
    "finops_providers",
    "finops_ingest",
    "finops_api",
    "finops_mcp",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "ARG", "PTH", "RUF"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --cov=finops_core --cov=finops_providers --cov=finops_ingest --cov=finops_api --cov-report=term-missing --cov-fail-under=80"
testpaths = ["tests"]
markers = [
    "integration: requires a database or LocalStack",
    "contract: port contract test, runs against both the fake and the aws adapter",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true

# The rule that keeps multi cloud cheap. finops_core must stay free of every
# cloud SDK and every framework. Enforced here, not by good intentions.
[tool.importlinter]
root_packages = [
    "finops_core",
    "finops_providers",
    "finops_ingest",
    "finops_api",
    "finops_mcp",
]

[[tool.importlinter.contracts]]
name = "finops_core is independent of cloud SDKs and frameworks"
type = "forbidden"
source_modules = ["finops_core"]
forbidden_modules = ["boto3", "botocore", "fastapi", "sqlalchemy", "requests", "httpx"]

# ADR-0009 and CLAUDE.md constraint 8: the MCP server is a facade in front of
# the HTTP API. It calls the API over the network with the caller's token and
# never reaches into the service layer, because two implementations of one
# authorization rule is how an authorization bug is created.
#
# Until this contract existed, that rule was enforced by nothing. AUDIT-001,
# finding A001-F02.
[[tool.importlinter.contracts]]
name = "finops_mcp is a facade, never a second implementation"
type = "forbidden"
source_modules = ["finops_mcp"]
forbidden_modules = [
    "finops_api.db",
    "finops_api.guards",
    "finops_ingest",
    "finops_providers",
    "boto3",
    "botocore",
    "sqlalchemy",
]

[[tool.importlinter.contracts]]
name = "layers are respected"
type = "layers"
layers = [
    "finops_mcp",
    "finops_api",
    "finops_ingest",
    "finops_providers",
    "finops_core",
]
