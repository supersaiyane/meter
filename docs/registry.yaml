# Basic boiler Plate Doc | Grade B
# Why this file exists: The single source every derived document is generated from. Change a
# status here, run one command, and every view updates together.
# Grade B here: copy it, then replace every row. The seven top level keys are the schema worth
# keeping.
# Grades: A copy into a new project as is, no edits. B copy it and swap the
# names, paths or patterns named above. C leave behind, it is this project's
# own content rather than scaffolding, and is not tagged.

meta:
  note: Single source of truth for features, decisions, changes, issues and open questions. INDEX.md,
    the roadmap status table and the feature document headers are GENERATED from this file by scripts/docs/sync.py.
    Edit here, then run make doc-sync. See ADR-0014.
