    that read the metadata rather than a list, and a dedicated freshness screen exists and draws
    each collector against its own cadence. Freshness on every screen was true and was held by
    nothing at all: it was one new screen away from being false, and a screen rendering a number
    with no freshness is the exact defect constraint 10 exists to prevent, because a stale
    figure looks identical to a current one. finops-
    web/src/screens/__tests__/freshnessContract.test.ts now reads the route table in App.tsx and
    asserts every routed screen calls useReportMeta. Falsified by removing the call from the
    budgets screen and watching it be named, and it checks for a call rather than a mention
