issues:
- id: ISS-164
  severity: MEDIUM
  summary: security/reports/latest is a committed symlink and the scan script wrote it as an
    absolute path, so it stored the author's own home directory in the repository and resolved on
    exactly one machine. Fixed 2026-09-13 by linking to the basename, which is correct because the
    link sits in the directory it points into
  status: FIXED
  detail: '`scripts/security/scan.sh`'
- id: ISS-165
  severity: LOW
  summary: Timestamped scan report directories accumulate in the working tree and 21 of them are
    committed, one per change that ran a scan. A local session that runs the scan a dozen times
