- id: OPEN-13
  question: Which code host receives a remediation pull request, and with what credential
  status: OPEN
  blocks: 'FEAT-040 opening anything, ISS-228. The authoring is built and tested against the
    PullRequestSink port, so the answer costs one adapter'
  detail: '[P7 plan](docs/plans/P7-implementation-plan.md) TASK-P7-009. The credential would be
