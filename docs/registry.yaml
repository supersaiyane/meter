  blocks: 'Nothing. It is a decision to make before the screen is written rather than after'
  detail: '[P1 spec](docs/specs/2026-09-18-p1-cost-intelligence-design.md) section 13. They are
    different situations, no bill collected yet and no screen built yet, and looking the same
    would send a person to the wrong place'
