  status: FIXED
  detail: '`finops_api/routes/ingest.py`, `finops_api/db/repositories/ingest.py`,
    `finops-web/src/screens/FreshnessScreen.tsx`'
- id: ISS-155
  severity: HIGH
  summary: Every figure inside a table rendered its own provenance sentence and its own two
    timestamps, so a three figure row carried three copies of the same `as of` line and the phrase
    `accuracy not yet published`. Rows were about 90 px against the 32 px the design asks for, and
    the findings table ran 1297 px wide inside a 1147 px container on a 1440 px screen, which put
    monthly cost, the sort column and the point of the screen, off the right edge. Fixed
    2026-09-11 with a density context that DataTable sets and Figure reads, so a table added later
