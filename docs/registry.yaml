  question: Jira or ServiceNow for the recommendation lifecycle
  status: OPEN
  blocks: P3 design
  detail: '[tasks/ISSUES.md](tasks/ISSUES.md)'
- id: OPEN-10
  question: Which Bedrock model does P7 use, and is it available in Ireland and London
  status: OPEN
  blocks: 'Nothing structural. The port and the adapter are written either way and a model
