# Basic boiler Plate Doc | Grade A
# Why this file exists: Trivy scanner configuration.
# Grade A here: nothing in this file is specific to this project. Copy it unchanged.
# Grades: A copy into a new project as is, no edits. B copy it and swap the
# names, paths or patterns named above. C leave behind, it is this project's
# own content rather than scaffolding, and is not tagged.

# trivy configuration. Second vulnerability opinion, plus infrastructure as
# code misconfiguration scanning that grype does not do.

severity:
  - UNKNOWN
  - LOW
  - MEDIUM
  - HIGH
  - CRITICAL

exit-code: 1
ignore-unfixed: false

scan:
  scanners:
    - vuln
    - secret
    - misconfig

db:
  skip-update: false

misconfiguration:
  # Terraform is scanned separately from images. High and critical
  # misconfigurations block, medium and below are reported.
  include-non-failures: false
