- id: P4
  name: Inventory and Topology
  status: Delivered
  spec: specs/2026-09-20-p4-inventory-and-topology-design.md
  plan: plans/P4-implementation-plan.md
  depends_on: P0
- id: P5
  name: Quotas and Limits
  status: Delivered, 8 of 8 tasks. The sub project whose central decision is what the product
    refuses to do
  spec: specs/2026-09-20-p5-quotas-and-limits-design.md
  plan: plans/P5-implementation-plan.md
  depends_on: P0, P4
- id: P6
  name: Containers
  status: Delivered, 12 of 12 tasks in its first cut. Cost by cluster, namespace and
    workload, request against use, sizing into P3's table, Fargate snapped to sizes that
    can be ordered, and forecast as a third provenance before anything forecasts. FEAT-037
    is In build because the AWS adapter reads EKS and never ECS, ISS-224
  spec: specs/2026-09-20-p6-containers-design.md
  plan: plans/P6-implementation-plan.md
  depends_on: P0, P1
- id: P7
  name: Insight and LLM layer
  status: Delivered, 14 of 14 tasks in its first cut. A question answered from the routes the
    screens read, every figure cited from a tool result and never written by the model,
    refusals and failures as shapes of their own, a monthly token budget, secrets redacted or
    blocked before any prompt is built, and weekly digests composed whether or not anything can
    send them. FEAT-039 and FEAT-040 are In build because nothing reads change history or opens
    a pull request yet, ISS-227 and ISS-228. Bedrock spend is tagged for the platform cost
    screen through an inference profile per model, unverified against an account, ISS-002
  spec: specs/2026-09-28-p7-insight-and-llm-layer-design.md
  plan: plans/P7-implementation-plan.md
  depends_on: P1, P2, P3
- id: P8
  name: Experience and reporting
  status: Delivered, 18 of 18 tasks. Two themes of one glass design system, navigation by the FinOps Framework,
    Cost Explorer and the spend forecast, Excel and CSV reports behind the scope guard, saved views and
    scheduled reports rendered for each recipient, three persona dashboards and the account picker. Nothing
    is sent until OPEN-11 and nothing deleted until OPEN-15
  spec: specs/2026-10-05-p8-experience-and-reporting-design.md
  plan: plans/P8-implementation-plan.md
  depends_on: P1, P2, P3, P4, P5, P6, P7
- id: P9
  name: Price catalog and rightsizing targets
  status: Delivered on 2026-10-08 against fakes, TASK-P9-001 to TASK-P9-013. EC2 and EBS list prices,
    Savings Plans rates and spot prices for every commercial Region, the instance types they price,
    rightsizing down and up to a named and priced target with its alternatives, and gp2 to gp3, each
    figure modelled from a recorded price list version. The hub reaches every API it calls, ADR-0035;
    reading a real price list and real Compute Optimizer answers waits on ISS-002
  spec: specs/2026-10-05-p9-price-catalog-design.md
  plan: plans/P9-implementation-plan.md
  depends_on: P3
- id: P10
  name: 'Proven numbers: FOCUS 1.4 and invoice reconciliation'
  status: Delivered on 2026-10-08 against fakes, TASK-P10-001 to TASK-P10-006. The cost row carries
    FOCUS 1.4's mandatory and invoice columns, each AWS invoice is read and compared with Meter's billed
    cost on a screen and the FinOps practitioner's Overview, and constraint 2 names FOCUS 1.4. The comparison
    against a real invoice waits on ISS-002, ISS-003 and TASK-P9-001
  spec: specs/2026-10-07-p10-proven-numbers-design.md
  plan: plans/P10-implementation-plan.md
  depends_on: P1
- id: P11
  name: Owners and a savings ledger
  status: Delivered on 2026-10-11 against fakes, proven by TASK-P11-009. Approved by the owner on 2026-10-08
    with OPEN-25 to OPEN-27 as recommended. Chosen as the next priority, proposal 3 of next-in-scope.txt, OPEN-20. Owners from tags, AWS
    AppRegistry and CloudTrail as suggestions beside the assigned owner, and a ledger crediting each
    verified saving to its owner and team for every month the bill shows it held
  spec: specs/2026-10-08-p11-owners-and-savings-ledger-design.md
  plan: plans/P11-implementation-plan.md
  depends_on: P3
- id: P12
  name: Deployment readiness
  status: 'Delivered on 2026-10-12 against fakes and stubbed AWS clients, proven by TASK-P12-009. Every
    collector the worker runs is composed for a deployment and the local stack and runs end to end on the
    local stack; every setting reaches a deployed task from SSM Parameter Store; each deploy applies its own
    plan; and make first-contact proves the first account. A first deployment waits on three owner decisions,
    ISS-279, ISS-280 and ISS-283, and a real account on ISS-002'
  spec: specs/2026-10-12-p12-deployment-readiness-design.md
  plan: plans/P12-implementation-plan.md
  depends_on: P11
- id: P13
  name: FinOps for AI
  status: 'Delivered on 2026-10-13 against fakes, proven by TASK-P13-009 against the seeded demo through the API. Approved by the owner on 2026-10-12 with OPEN-31 to OPEN-34 answered, and chosen the same day as the next priority, proposal 2 of next-in-scope.txt. No provider has been called and no invocation log read, ISS-285 and ISS-002. Bedrock by model, token type, application and caller; OpenAI and Anthropic cost and usage through a NAT gateway only the worker can use; GPU hours, cost and utilization; and one screen for cost per token, per request and per feature'
  spec: specs/2026-10-12-p13-finops-for-ai-design.md
  plan: plans/P13-implementation-plan.md
  depends_on: P12
- id: P14
  name: Commitments
  status: 'In build. Approved by the owner on 2026-10-13 with OPEN-35 to OPEN-39 answered, and chosen the same day as the next priority, proposal 5 of next-in-scope.txt. Every commitment with its real term, the effective savings rate as the headline, a renewal calendar against a ladder, and purchase plans from Meter and from AWS side by side for a person to approve, buy and see verified. Meter never buys'
  spec: specs/2026-10-13-p14-commitments-design.md
  plan: plans/P14-implementation-plan.md
  depends_on: P13
