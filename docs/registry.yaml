  status: FIXED
  detail: '`finops_api/routes/query.py`, `finops-web/src/screens/surfaceStateFor.ts`'
- id: ISS-153
  severity: HIGH
  summary: grafana_instance.account_id held a workspace identifier for every real workspace. The
    collector parsed `aws:account:region` out of the surface identifier and fell back to the
