  status: OPEN
  detail: '`finops_api/routes/query.py`, `finops_api/tools.py`, where the tool table moved
    from `finops_mcp/tools.py` on 2026-10-04, CHG-0110'
- id: ISS-149
  severity: HIGH
  summary: The local stack could never show the data it ships with. docker-compose pinned
    METER_LOCAL_TENANT_ID to a tenant that has no row, while make seed writes a different one, so
    every read resolved a scope for a tenant that does not exist and the first query failed on the
    audit insert with a foreign key error rather than an empty page. Found by calling the routes
    against the running stack, not by any test. Fixed 2026-08-29 by pointing the local stack at
    the tenant its only data source writes
  status: FIXED
  detail: '`docker-compose.yml`, `.env.example`'
- id: ISS-150
  severity: HIGH
  summary: The web container had no proxy for `/api`, because a deployed environment terminates
    that path at the load balancer and the image config is written for that. Locally there is no
    load balancer, so every screen rendered an nginx 404 where its data should be. Fixed
    2026-08-29 with a local only overlay mounted over the image config, leaving the deployed
    configuration untouched
  status: FIXED
  detail: '`docker/nginx.local.conf`, `docker-compose.yml`'
- id: ISS-151
  severity: HIGH
  summary: The nginx image ships its own server block with `server_name localhost`, and nginx
    matches a server name exactly before falling back to the catch all. Every request whose Host
    is localhost was therefore served by the image default rather than by docker/nginx.conf, so
    the single page fallback was absent and a hard refresh on any route returned 404, and none of
    the three security headers were sent. A deployed environment is served under its own hostname
    and matches the catch all, so the effect there is limited to the day someone reaches the
    container as localhost. Fixed 2026-08-29 by copying an empty file over the image default,
    because the image has no shell to delete it with
  status: FIXED
  detail: '`docker/nginx.disabled.conf`, `docker/Dockerfile.web`'
- id: ISS-152
  severity: MEDIUM
  summary: The partial coverage banner read "1 missing. outside your scope" whatever the cause. On
    the query screens the missing workspace is usually one Meter could not read, not one the
    viewer is not entitled to, and naming the wrong cause sends the reader to an access request
    for a permission they already hold. The interface had nothing better to say because the
    envelope carried no failure for an unreachable workspace, because the route knew and did
    not report it. Fixed 2026-09-11 at the source. The query routes now report every unreachable workspace as
    a typed failure, and the banner names the cause it was given, falling back to entitlement only
    when nothing else explains the gap
  status: FIXED
  detail: '`finops_api/routes/query.py`, `finops-web/src/screens/surfaceStateFor.ts`'
- id: ISS-153
  severity: HIGH
  summary: grafana_instance.account_id held a workspace identifier for every real workspace. The
    collector parsed `aws:account:region` out of the surface identifier and fell back to the
    identifier itself, and the AMG adapter names a listed workspace by its workspace id, so the
    fallback fired every time. Harmless until TASK-P2-021 made that column the one scope
    enforcement reads, at which point a scoped viewer silently lost every workspace. The upsert
    also never refreshed the column, so a corrected value would not have reached an existing
    estate. Fixed 2026-08-29 by carrying the account and region on SurfaceInstance from the
    adapter that knows them, and refreshing both on conflict
  status: FIXED
  detail: '`finops_core/domain/query.py`, `finops_providers/grafana/amg.py`,
    `finops_ingest/collectors/query_audit.py`'
- id: ISS-154
  severity: LOW
  summary: make test-integration can never pass on its own. It runs only the integration marker
    while the coverage gate is set for the whole suite, so it reports 77 percent against a
    threshold of 80 and exits non zero even when every test passes. The pipeline was believed to run both
    suites in one pytest invocation and reach 98 percent. That was never observed and was
    not true, and ISS-178 says why. The repository has no remote, and the job could not run an
    integration test anyway. So this was a local target that lies, next to a pipeline
    nobody had watched. Fixed 2026-09-06, in the pass that put the integration
    tests into make verify. The coverage gate now runs on the one invocation that covers
    everything, and both slice targets pass --no-cov, because a fraction of the suite
    graded against the whole suite's threshold is a number that cannot be read in either
    direction. It fails when nothing is wrong, and it would pass a slice covering nothing
    it touched
  status: FIXED
  detail: '`Makefile`, targets test, test-unit and test-integration'
- id: ISS-146
  severity: HIGH
  summary: make security-scan could not complete and make security-scan-images had never run,
    because the images had never built. Three tooling faults hid the result. gitleaks ran with no
    config and reported two false positives on `collector=COLLECTOR`, matching a collector name as
    a secret. pip-audit was installed into the venv by make security-tools but the scan script
    looked only on PATH, so it reported the tool missing and stopped. pip-audit then audited the
    environment, which contains the project installed editable, failed to find `meter` on PyPI, and
    under --strict aborted before writing pip-audit.json, so Python dependencies were absent from
    every summary that reported zero findings. All three fixed 2026-08-29 and both scans pass
  status: FIXED
  detail: '`.gitleaks.toml`, `scripts/security/scan.sh`'
- id: ISS-147
