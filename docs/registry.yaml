- id: ISS-152
  severity: MEDIUM
  summary: The partial coverage banner read "1 missing. outside your scope" whatever the cause. On
    the query screens the missing workspace is usually one Meter could not read, not one the
    viewer is not entitled to, and naming the wrong cause sends the reader to an access request
    for a permission they already hold. The interface had nothing better to say because the
    envelope carried no failure for an unreachable workspace, because the route knew and did
    not report it. Fixed 2026-09-11 at the source. The query routes now report every unreachable workspace as
    a typed failure, and the banner names the cause it was given, falling back to entitlement only
    when nothing else explains the gap
  status: FIXED
  detail: '`finops_api/routes/query.py`, `finops-web/src/screens/surfaceStateFor.ts`'
- id: ISS-153
  severity: HIGH
  summary: grafana_instance.account_id held a workspace identifier for every real workspace. The
    collector parsed `aws:account:region` out of the surface identifier and fell back to the
    identifier itself, and the AMG adapter names a listed workspace by its workspace id, so the
    fallback fired every time. Harmless until TASK-P2-021 made that column the one scope
    enforcement reads, at which point a scoped viewer silently lost every workspace. The upsert
    also never refreshed the column, so a corrected value would not have reached an existing
    estate. Fixed 2026-08-29 by carrying the account and region on SurfaceInstance from the
    adapter that knows them, and refreshing both on conflict
  status: FIXED
  detail: '`finops_core/domain/query.py`, `finops_providers/grafana/amg.py`,
    `finops_ingest/collectors/query_audit.py`'
- id: ISS-154
  severity: LOW
  summary: make test-integration can never pass on its own. It runs only the integration marker
    while the coverage gate is set for the whole suite, so it reports 77 percent against a
    threshold of 80 and exits non zero even when every test passes. The pipeline was believed to run both
    suites in one pytest invocation and reach 98 percent. That was never observed and was
    not true, and ISS-178 says why. The repository has no remote, and the job could not run an
    integration test anyway. So this was a local target that lies, next to a pipeline
    nobody had watched. Fixed 2026-09-06, in the pass that put the integration
    tests into make verify. The coverage gate now runs on the one invocation that covers
    everything, and both slice targets pass --no-cov, because a fraction of the suite
    graded against the whole suite's threshold is a number that cannot be read in either
    direction. It fails when nothing is wrong, and it would pass a slice covering nothing
    it touched
  status: FIXED
  detail: '`Makefile`, targets test, test-unit and test-integration'
- id: ISS-146
  severity: HIGH
  summary: make security-scan could not complete and make security-scan-images had never run,
    because the images had never built. Three tooling faults hid the result. gitleaks ran with no
    config and reported two false positives on `collector=COLLECTOR`, matching a collector name as
    a secret. pip-audit was installed into the venv by make security-tools but the scan script
    looked only on PATH, so it reported the tool missing and stopped. pip-audit then audited the
    environment, which contains the project installed editable, failed to find `meter` on PyPI, and
    under --strict aborted before writing pip-audit.json, so Python dependencies were absent from
    every summary that reported zero findings. All three fixed 2026-08-29 and both scans pass
  status: FIXED
  detail: '`.gitleaks.toml`, `scripts/security/scan.sh`'
- id: ISS-147
  severity: HIGH
  summary: The runtime images carried pip, setuptools and wheel, installed to build the venv and
    then copied into the runtime with it. setuptools 70.3.0 alone accounted for one High and one
    Medium in every image, four of the eight unresolved findings in the first image scan that had
    ever run. Build tools are not runtime code and are now removed from the venv before it is
    copied, which fixes the findings at the source rather than chasing a version and makes the
    image smaller. The remaining finding, CVE-2026-19672 in the base image, has no published fix
    and is accepted with an enforced reachability argument
  status: FIXED
  detail: '`docker/Dockerfile.api`, `docker/Dockerfile.worker`, `security/policy/accepted.yaml`'
- id: ISS-143
  severity: HIGH
  summary: make up could not build or start, for six independent reasons found by running it. The
    builder stages ran as the base image's non root user and could not write /opt/venv. The
    dependency layer ran pip install with only pyproject.toml present, which setuptools cannot
    resolve without the package directories. pyproject listed top level packages explicitly, so
    subpackages like finops_api.db were never in the wheel and a migration inside the image failed
    on ModuleNotFoundError. finops_query was never added to either Dockerfile after TASK-P2-003
    created it. docker-compose bound host port 5432 with no override. The services enumerated
    environment variables by hand and had never been given the query or retention settings. Fixed
    2026-09-02 and make up, make seed and make unseed all verified working
  status: FIXED
  detail: '`docker/Dockerfile.api`, `docker/Dockerfile.worker`, `docker/Dockerfile.web`,
    `docker-compose.yml`, `pyproject.toml`, `.dockerignore`'
- id: ISS-145
  severity: MEDIUM
  summary: scripts/ops was in no image, so erase_principal.py could not be run in a deployed
    environment even though docs/09-DATA-CLASSIFICATION.md commits to that erasure procedure. The
    api image now carries scripts/ops. Found 2026-09-02 while making make seed work, which failed
    for the same reason
  status: FIXED
  detail: '`docker/Dockerfile.api`, [docs/09-DATA-CLASSIFICATION.md](docs/09-DATA-CLASSIFICATION.md)'
- id: ISS-144
  severity: HIGH
  summary: default_ingest_rate passed the per day ingest setting into IngestRate, which
    _logs_insights_cost multiplies by a window measured in hours, overstating every Logs Insights
    figure by exactly 24. The seeded demo panel read 3,888,000 dollars a month against a correct
    162,000. Introduced with the seed tooling on 2026-09-02 and fixed the same day, with the unit
    documented on IngestRate and pinned by a test, because the type carried no unit and nothing
    else in the codebase supplied one to compare against
  status: FIXED
  detail: '`finops_ingest/collectors/query_audit.py`, `finops_query/cost_model.py`'
- id: ISS-142
  severity: LOW
  summary: strip_comments removes a comment marker that begins a line or follows whitespace, so a
    hash or a double hyphen inside a quoted string in a query is treated as the start of a comment
    and the rest of that line is dropped from the key. It affects the fingerprint and the query key
    only, never the stored query text, the targets or the cost, so the consequence is that two
    queries differing only after such a marker could share a key. Judged unlikely enough to accept
    for now against the alternative, which is a parser per query language. Found 2026-09-01 while
    implementing TASK-P2-011
  status: OPEN
  detail: '`finops_query/policy.py`, TASK-P2-011'
- id: ISS-141
  severity: MEDIUM
  summary: TASK-P2-006 asked for the contract suite under moto, and moto implements no Grafana
    operation at all. ListWorkspaces, DescribeWorkspace, CreateWorkspace and every service account
    call answer Not yet implemented, while botocore knows them from the service model, so the gap
    is invisible until a call is made. botocore.stub is used instead and is stronger for API
    correctness, validating a request and a response against the real model. It caught the first
    draft of the test fixture omitting created, modified, grafanaVersion and authentication, all
    required by ListWorkspaces. Revisit if moto adds a grafana backend. Found 2026-09-24
  status: OPEN
  detail: '`tests/providers/test_amg_surface.py`, [P2 plan](docs/plans/P2-implementation-plan.md) TASK-P2-006'
- id: ISS-140
  severity: MEDIUM
  summary: Every Figure renders its own freshness inline, so a table cell carries the figure, its
    provenance, its accuracy and two timestamps, and a dense row cannot be the 32 px that
    docs/12-UI-DESIGN.md section 7 asks for. The shell already shows worst case freshness for the
    whole view, so the per cell repetition may be redundant rather than load bearing. Rows are a
    minimum of 32 px and grow with their content. Deciding this is a product question rather than a
    styling one, because removing per cell freshness would change what a reader is told, and hiding
    it in CSS would take it from assistive technology as well. Found 2026-09-21 while styling the
    tables
  status: OPEN
  detail: '`finops-web/src/components/Figure.tsx`, `finops-web/src/layout.css`, TASK-P0-039'
- id: ISS-139
  severity: MEDIUM
  summary: TASK-P2-025 acceptance requires an end to end journey applying the workspace floor and
