  status: FIXED
  detail: '`finops-web/src/layout.css`, `finops-web/src/components/OrgTree.tsx`'
- id: ISS-163
  severity: MEDIUM
  summary: The freshness screen listed watermarks, and a watermark only exists after a collector
    has succeeded once. A scope that had never succeeded was therefore absent from the page rather
    than shown as never collected, so the one collector in trouble was the one the freshness
    screen did not mention. Fixed 2026-09-13. The page now lists every pair that has been
    attempted, the union of watermarks and runs, and carries three states rather than two, because
    a collector that has never worked is not a stale one. Its age is null rather than zero, since
    a zero reads as collected this instant, and the row names the typed cause of its last attempt.
